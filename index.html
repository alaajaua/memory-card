<title>CIT 대본 암기카드</title>
<meta name="description" content="CIT 발표 대본을 한 문장씩 한국어/영어 플래시카드로 외우는 도구">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans+KR:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #eef2f3;
    --surface: #ffffff;
    --ink: #172024;
    --muted: #5c6b71;
    --line: #d5dde0;
    --copper: #a8552a;
    --copper-soft: #f4e3d8;
    --patina: #1f6b64;
    --patina-soft: #dcefec;
    --warn: #b23b3b;
    --warn-soft: #f7e1e1;
    --shadow: 0 1px 2px rgba(20, 35, 40, .06), 0 8px 24px rgba(20, 35, 40, .07);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #11171a;
      --surface: #1a2226;
      --ink: #e6ecee;
      --muted: #93a3a9;
      --line: #2c383d;
      --copper: #e39061;
      --copper-soft: #3a2a21;
      --patina: #6cc3b8;
      --patina-soft: #1d3533;
      --warn: #ee8a8a;
      --warn-soft: #3a2224;
      --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #11171a;
    --surface: #1a2226;
    --ink: #e6ecee;
    --muted: #93a3a9;
    --line: #2c383d;
    --copper: #e39061;
    --copper-soft: #3a2a21;
    --patina: #6cc3b8;
    --patina-soft: #1d3533;
    --warn: #ee8a8a;
    --warn-soft: #3a2224;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25);
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
    font-size: 15px;
    line-height: 1.55;
    padding-inline: 16px;
    padding-block: 20px 40px;
  }
  .wrap { max-width: 760px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }
  .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; font-variant-numeric: tabular-nums; }

  header h1 { margin: 0; font-size: 22px; font-weight: 700; text-wrap: balance; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 13px; }

  .flow { display: flex; flex-wrap: wrap; gap: 4px 2px; align-items: center; font-size: 12px; color: var(--muted); }
  .flow span.step { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 2px 9px; color: var(--ink); }
  .flow span.arrow { color: var(--copper); padding: 0 2px; }

  .panel { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 12px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  .label { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); min-width: 64px; }

  button { font: inherit; color: inherit; cursor: pointer; }
  button:focus-visible { outline: 2px solid var(--copper); outline-offset: 2px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .seg button { background: transparent; border: 0; padding: 6px 12px; font-size: 13px; }
  .seg button + button { border-left: 1px solid var(--line); }
  .seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface); }

  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip { background: transparent; border: 1px solid var(--line); border-radius: 6px; padding: 3px 8px; font-size: 12px; }
  .chip[aria-pressed="true"] { background: var(--copper-soft); border-color: var(--copper); color: var(--copper); font-weight: 600; }
  .toggle { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; }
  .toggle[aria-pressed="true"] { background: var(--patina-soft); border-color: var(--patina); color: var(--patina); font-weight: 600; }

  .progress { display: flex; justify-content: space-between; align-items: center; font-size: 13px; color: var(--muted); gap: 8px; }
  .bar { height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
  .bar i { display: block; height: 100%; background: var(--copper); width: 0; transition: width .25s; }

  .card {
    background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: var(--shadow);
    padding: 22px 20px; min-height: 300px; display: flex; flex-direction: column; gap: 16px; cursor: pointer;
    user-select: none; -webkit-user-select: none; touch-action: pan-y;
  }
  .card-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; font-size: 12px; color: var(--muted); }
  .card-top b { color: var(--copper); font-weight: 500; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; }
  .tag.known { background: var(--patina-soft); color: var(--patina); }
  .tag.again { background: var(--warn-soft); color: var(--warn); }
  .lang { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin-bottom: 6px; }
  .front { font-size: 21px; font-weight: 600; line-height: 1.5; text-wrap: pretty; }
  .hint { font-size: 17px; color: var(--copper); letter-spacing: .02em; line-height: 1.6; word-break: keep-all; }
  .back { border-top: 1px dashed var(--line); padding-top: 14px; font-size: 18px; line-height: 1.55; text-wrap: pretty; }
  .back .text { color: var(--patina); font-weight: 500; }
  .tap { margin-top: auto; text-align: center; font-size: 13px; color: var(--muted); }

  .actions { display: grid; grid-template-columns: 1fr 1.4fr 1fr; gap: 8px; }
  .actions button, .grade button {
    border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 8px; font-size: 14px; font-weight: 500;
  }
  .actions .primary { background: var(--ink); color: var(--surface); border-color: var(--ink); }
  .grade { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .grade .again { color: var(--warn); border-color: var(--warn); background: var(--warn-soft); }
  .grade .known { color: var(--patina); border-color: var(--patina); background: var(--patina-soft); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .tools button { background: transparent; border: 1px solid var(--line); border-radius: 8px; padding: 6px 12px; font-size: 13px; color: var(--muted); }
  .keys { text-align: center; font-size: 12px; color: var(--muted); }
  .keys kbd { font-family: "IBM Plex Mono", monospace; border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 11px; }

  .ez { font-size: 13px; line-height: 1.5; color: var(--muted); margin-top: 6px; font-weight: 400; }
  .answer .w.kw, .en-full .kw { font-weight: 700; color: var(--copper); }
  .ez b { font-size: 11px; font-weight: 600; letter-spacing: .04em; color: var(--copper); margin-right: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 40px 0; }

  /* 단계 학습 */
  .learn { display: flex; flex-direction: column; gap: 12px; }
  .stages { display: flex; gap: 4px; flex-wrap: wrap; }
  .stages span { font-size: 11px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
  .stages span.on { background: var(--copper); border-color: var(--copper); color: var(--surface); font-weight: 600; }
  .stages span.ok { background: var(--patina-soft); border-color: var(--patina); color: var(--patina); }
  .lcard { cursor: default; min-height: 0; }
  .en-full { font-size: 19px; line-height: 1.55; color: var(--patina); font-weight: 500; }
  .answer { min-height: 58px; border-bottom: 2px solid var(--line); padding-bottom: 10px; display: flex; flex-wrap: wrap; gap: 6px 5px; align-items: center; font-size: 17px; line-height: 1.5; }
  .answer .w { color: var(--ink); }
  .answer .w.new { color: var(--copper); }
  .answer .blank { display: inline-block; border-bottom: 2px solid var(--copper); min-width: 3em; height: 1.2em; }
  .answer .blank.next { background: var(--copper-soft); border-radius: 3px 3px 0 0; }
  .answer .filled { color: var(--copper); font-weight: 600; }
  .answer .cursor { width: 2px; height: 1.2em; background: var(--copper); animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
  .bank button { background: var(--surface); border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 10px; padding: 8px 12px; font-size: 16px; }
  .bank button:disabled { visibility: hidden; }
  .bank button.wrong { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); animation: shake .35s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
  .feedback { border-radius: 10px; padding: 10px 14px; font-size: 14px; }
  .feedback.good { background: var(--patina-soft); color: var(--patina); }
  .feedback.retry { background: var(--warn-soft); color: var(--warn); }
  .lrow { display: flex; gap: 8px; }
  .lrow button { flex: 1; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 8px; font-size: 14px; font-weight: 500; }
  .lrow .primary { background: var(--ink); color: var(--surface); border-color: var(--ink); flex: 2; }
  .lrow .ghost { color: var(--muted); }

  /* 전체 대본 보기 */
  .script { display: flex; flex-direction: column; gap: 10px; }
  .script details { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; }
  .script summary { cursor: pointer; font-weight: 600; font-size: 14px; }
  .script summary .mono { color: var(--copper); margin-right: 6px; font-size: 12px; }
  .script ol { margin: 10px 0 4px; padding-left: 22px; display: flex; flex-direction: column; gap: 10px; }
  .script li .en { font-weight: 500; }
  .script li .ko { color: var(--muted); font-size: 14px; }
  .script.hide-en li .en, .script.hide-ko li .ko { filter: blur(6px); cursor: pointer; transition: filter .15s; }
  .script li .revealed { filter: none !important; }

  @media (max-width: 480px) {
    .front { font-size: 19px; }
    .back { font-size: 17px; }
    .card { min-height: 260px; padding: 18px 16px; }
  }
  @media (prefers-reduced-motion: reduce) { .bar i { transition: none; } .answer .cursor, .bank button.wrong { animation: none; } }
</style>

<div class="wrap">
  <header>
    <h1>CIT 대본 암기카드</h1>
    <p>문법보다 말할 내용을 먼저. 보고 듣기 → 덩어리 배치 → 핵심어 빈칸, 세 단계로 외워요.</p>
  </header>

  <div class="flow" id="flow" aria-label="발표 흐름"></div>

  <div class="panel">
    <div class="row">
      <span class="label">보기 방식</span>
      <div class="seg" role="group" aria-label="보기 방식">
        <button id="viewLearn" aria-pressed="true">단계 학습</button>
        <button id="viewCard" aria-pressed="false">복습 카드</button>
        <button id="viewScript" aria-pressed="false">전체 대본</button>
      </div>
    </div>
    <div class="row">
      <span class="label">외울 버전</span>
      <div class="seg" role="group" aria-label="외울 버전">
        <button id="verOrig" aria-pressed="true">원문 대본</button>
        <button id="verEz" aria-pressed="false">쉬운 말</button>
      </div>
    </div>
    <div class="row" id="frontRow">
      <span class="label">앞면</span>
      <div class="seg" role="group" aria-label="앞면 언어">
        <button id="frontKo" aria-pressed="true">한국어 → 영어</button>
        <button id="frontEn" aria-pressed="false">English → 한국어</button>
      </div>
    </div>
    <div class="row" style="align-items:flex-start">
      <span class="label" style="padding-top:4px">페이지</span>
      <div class="chips" id="pageChips"></div>
    </div>
    <div class="row" id="cardOptions">
      <span class="label">옵션</span>
      <button class="toggle" id="shuffle" aria-pressed="false">섞기</button>
      <button class="toggle" id="onlyAgain" aria-pressed="false">못 외운 것만</button>
      <button class="toggle" id="resetMarks" aria-pressed="false">기록 초기화</button>
    </div>
  </div>

  <!-- 단계 학습 모드 -->
  <section id="learnView" class="learn">
    <div>
      <div class="progress">
        <span id="lCounter"></span>
        <span class="mono" id="lPct"></span>
      </div>
      <div class="bar" style="margin-top:6px"><i id="lBar"></i></div>
    </div>
    <div id="learnBody" class="learn"></div>
  </section>

  <!-- 카드 모드 -->
  <section id="cardView" style="display:flex;flex-direction:column;gap:12px" hidden>
    <div>
      <div class="progress">
        <span class="mono" id="counter">0 / 0</span>
        <span id="stats"></span>
      </div>
      <div class="bar" style="margin-top:6px"><i id="barFill"></i></div>
    </div>

    <div class="card" id="card" tabindex="0" aria-live="polite"></div>

    <div class="grade" id="grade" hidden>
      <button class="again" id="btnAgain">다시 볼래요</button>
      <button class="known" id="btnKnown">외웠어요</button>
    </div>
    <div class="actions">
      <button id="btnPrev">← 이전</button>
      <button class="primary" id="btnFlip">정답 보기</button>
      <button id="btnNext">다음 →</button>
    </div>
    <div class="tools">
      <button id="btnHint">첫 글자 힌트</button>
      <button id="btnSpeak">영어 듣기</button>
    </div>
    <div class="keys"><kbd>Space</kbd> 뒤집기 · <kbd>←</kbd><kbd>→</kbd> 이동 · <kbd>H</kbd> 힌트 · <kbd>1</kbd> 다시 · <kbd>2</kbd> 외웠어요 · 모바일은 좌우로 밀기</div>
  </section>

  <!-- 전체 대본 모드 -->
  <section id="scriptView" hidden>
    <div class="row" style="margin-bottom:10px">
      <span class="label">가리기</span>
      <div class="seg" role="group" aria-label="가리기">
        <button id="hideNone" aria-pressed="true">안 가림</button>
        <button id="hideEn" aria-pressed="false">영어 가리기</button>
        <button id="hideKo" aria-pressed="false">한국어 가리기</button>
      </div>
    </div>
    <div class="script" id="script"></div>
  </section>
</div>

<script>
const FLOW = ["AI 성장", "전력 문제", "구리의 한계", "표면 거칠기·결정립계", "ASE 기술", "평탄한 구리", "더 빠른 데이터 전송", "다양한 산업 적용"];

const PAGES = [
  { p: "1P", t: "Company Introduction", en: [
    "CIT is an advanced IT materials company for next-generation AI.",
    "Today, I’ll briefly introduce our technology and where it creates value in AI infrastructure."
  ], ko: [
    "씨아이티는 차세대 AI를 위한 첨단 IT 소재 기업입니다.",
    "오늘은 씨아이티의 기술과 AI 인프라에서 이 기술이 어떤 가치를 창출하는지 간략히 소개하겠습니다."
  ]},
  { p: "2P", t: "Global Validation", en: [
    "Before the technology, let me start with validation.",
    "CIT’s research has been published in Nature, Nature Communications, and Advanced Materials.",
    "Our technology has also received CES Innovation Awards in 2025 and 2026.",
    "Now, let’s look at the problem we are solving in AI infrastructure."
  ], ko: [
    "기술을 설명하기에 앞서, 검증 성과부터 말씀드리겠습니다.",
    "씨아이티의 연구 성과는 Nature, Nature Communications, Advanced Materials에 게재됐습니다.",
    "또한 CES 혁신상을 2025년과 2026년 2년 연속 수상했습니다.",
    "이제 AI 인프라에서 저희가 해결하고자 하는 문제를 살펴보겠습니다."
  ]},
  { p: "3P", t: "Energy Problem", en: [
    "So, what is really limiting AI infrastructure expansion?",
    "Is it a shortage of AI chips?",
    "No the real problem is Energy.",
    "Energy is becoming a major challenge for data center expansion."
  ], ko: [
    "AI 인프라 확장을 제약하는 것은 무엇일까요?",
    "AI 칩 부족일까요?",
    "핵심은 전력 문제입니다.",
    "전력은 데이터센터의 확장을 제약하는 주요 문제로 부각되고 있습니다."
  ]},
  { p: "4P", t: "Copper Problem", en: [
    "This Energy Challenge brings us to copper, a key material for data transmission in AI hardware.",
    "Conventional copper surfaces are rough.",
    "This can increase heat and signal delay, limiting AI accelerator performance."
  ], ko: [
    "이 전력 문제는 AI 하드웨어에서 핵심 데이터 전송 소재인 구리와 연결됩니다.",
    "기존 구리는 표면이 거칩니다.",
    "이것은 발열과 신호 지연을 증가시켜 AI 가속기의 성능을 제한할 수 있습니다."
  ]},
  { p: "5P", t: "Root Cause", en: [
    "This is why Copper Circuit Quality matters.",
    "Two factors are important here: surface roughness and grain boundaries.",
    "A rough surface makes the signal path longer, and Grain Boundaries increase electron scattering.",
    "Together, they increase signal loss and heat."
  ], ko: [
    "그렇기 때문에 구리 회로의 품질이 중요합니다.",
    "핵심 요인은 표면 거칠기와 결정립계입니다.",
    "거친 표면은 신호 이동 거리를 늘리고, 결정립계는 전자 산란을 증가시킵니다.",
    "두 요인 모두 신호 손실과 발열을 증가시킵니다."
  ]},
  { p: "6P", t: "ASE Solution", en: [
    "To solve this, we developed ASE, or Atomic Sputtering Epitaxy.",
    "ASE deposits copper atom by atom, creating an ultra-flat, highly uniform copper thin film.",
    "By making the copper surface much flatter, ASE directly addresses the signal-loss and heat problem we just discussed."
  ], ko: [
    "이를 해결하기 위해 ASE, Atomic Sputtering Epitaxy 기술을 개발했습니다.",
    "ASE는 구리를 원자 단위로 증착해 초평탄하고 매우 균일한 구리 박막을 형성합니다.",
    "구리 표면을 훨씬 평탄하게 만들어, 앞서 말씀드린 신호 손실과 발열을 줄입니다."
  ]},
  { p: "7P", t: "ASE Characteristics", en: [
    "ASE combines the advantages of ALD and PVD to make flat, uniform copper films at high speed.",
    "It is ready for large-area industrial production.",
    "And Existing PVD equipment can be upgraded easily, with less than 2% additional equipment cost."
  ], ko: [
    "ASE는 ALD와 PVD의 장점을 결합한 하이브리드 공정으로, 평탄하고 균일한 구리 박막을 빠르게 형성합니다.",
    "또한 대면적 산업 생산에 적용할 준비를 갖췄고,",
    "기존 PVD 장비의 업그레이드가 용이하며 추가 설비 비용도 2% 미만으로 가능합니다."
  ]},
  { p: "8P", t: "Applications", en: [
    "We apply ASE across multiple applications.",
    "HVLP copper foil for accelerator boards Copper-coated glass for semiconductor packaging.",
    "And FCCL for High-Speed data transmission in FPCBs."
  ], ko: [
    "ASE는 다양한 분야에 적용됩니다.",
    "AI 가속기 보드용 HVLP 동박, 반도체 패키징용 구리 증착 유리기판,",
    "FPCB의 고속 데이터 전송을 위한 FCCL입니다."
  ]},
  { p: "9P", t: "AI Accelerator / HVLP Copper", en: [
    "First, the AI accelerator board.",
    "Compared with the 4th-generation HVLP copper used for NVIDIA’s Vera Rubin platform, CIT ASE copper reaches a 6th-generation level.",
    "The surface roughness is reduced from about 0.8 micrometers to 0.2 micrometers, up to about four times lower."
  ], ko: [

function buildDeck() {
  let d = CARDS.filter(c => state.pages.has(c.p));
  if (state.onlyAgain) d = d.filter(c => state.marks[c.id] !== "known");
  if (state.shuffle) {
    d = d.slice();
    for (let i = d.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [d[i], d[j]] = [d[j], d[i]]; }
  }
  state.deck = d; state.idx = 0; state.flipped = false; state.hint = false;
  renderCard();
}

function hintOf(text) {
  // 단어마다 첫 글자만 남기기 (숫자는 그대로)
  return text.split(/\s+/).map(w => {
    const m = w.match(/^([^\p{L}\p{N}]*)([\p{L}\p{N}])([\p{L}\p{N}.,:’'%\-·]*?)([^\p{L}\p{N}]*)$/u);
    if (!m) return w;
    if (/^\d/.test(m[2])) return w;
    return m[1] + m[2] + m[4];
  }).join(" ");
}

function renderCard() {
  const d = state.deck, card = $("card");
  const known = CARDS.filter(c => state.pages.has(c.p) && state.marks[c.id] === "known").length;
  const inScope = CARDS.filter(c => state.pages.has(c.p)).length;
  $("stats").textContent = `외운 문장 ${known} / ${inScope}`;
  if (!d.length) {
    card.innerHTML = `<div class="empty">${state.onlyAgain ? "모두 외웠어요! ‘못 외운 것만’을 끄면 전체를 다시 볼 수 있어요." : "선택한 페이지에 문장이 없어요."}</div>`;

    $("grade").hidden = true; return;
  }
  const c0 = d[state.idx], c = { ...c0, en: EN(c0) };
  const frontLang = state.front, backLang = frontLang === "ko" ? "en" : "ko";
  const mark = state.marks[c.id];

}

function flip() { if (!state.deck.length) return; state.flipped = !state.flipped; renderCard(); }
function go(delta) {
  if (!state.deck.length) return;
  state.idx = (state.idx + delta + state.deck.length) % state.deck.length;
  state.flipped = false; state.hint = false; renderCard();
}
function grade(v) {
  const c = state.deck[state.idx]; if (!c) return;
  state.marks[c.id] = v; store.set("marks", state.marks);
  if (state.onlyAgain && v === "known") {
    state.deck.splice(state.idx, 1);
    if (state.idx >= state.deck.length) state.idx = 0;
    state.flipped = false; state.hint = false; renderCard();
  } else go(1);
}

  const c = state.deck[state.idx]; if (!c || !("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(EN(c)); u.lang = "en-US"; u.rate = 0.95;
  speechSynthesis.speak(u);
}

// progress[id]: 다음에 할 단계 (0 보고 듣기, 1 단어 배치, 2 빈칸), 3 = 완료
const STAGES = ["보고 듣기", "덩어리 배치", "핵심어 빈칸"];
// 문법 단어는 빼고 '말할 내용'이 담긴 단어만 핵심어로
const STOP = new Set("a an the is are was were be been being it its it's this that these those of to in on at for with by from and or but so as than then our we we're we've us you your i i'll let let's me my there here has have had do does will can can't into also just now very what what's really which while who them they their out up about is it one two".split(" "));
const norm = w => core(w).replace(/[’]/g, "'").toLowerCase();
const isKey = w => { const n = norm(w); return /\d/.test(n) || (n.replace(/[^\p{L}]/gu, "").length >= 3 && !STOP.has(n)); };
const keyHtml = t => t.split(/\s+/).map(w => isKey(w) ? `<span class="kw">${esc(w)}</span>` : esc(w)).join(" ");
// 의미 덩어리로 자르기 (2~4단어)
const BREAK = new Set("and to for with in on at by from of that which while but so because than without including across into like as".split(" "));
function chunks(text) {
  const out = []; let cur = [];
  text.split(/\s+/).forEach(t => {
    const n = norm(t);
    if (cur.length && (BREAK.has(n) || cur.length >= 4 || (cur.length >= 2 && /^(a|an|the)$/.test(n)))) { out.push(cur); cur = []; }
    cur.push(t);
    if (/[,.:;?!]$/.test(t)) { out.push(cur); cur = []; }
  });
  if (cur.length) out.push(cur);
  // 한 단어짜리 조각은 앞(문장이 끝나지 않았으면) 또는 뒤 조각에 붙이기
  const merged = [];
  out.forEach((ch, i) => {
    const last = merged[merged.length - 1];
    if (ch.length === 1 && last && !/[.?!:]$/.test(last[last.length - 1])) last.push(...ch);
    else if (ch.length === 1 && i < out.length - 1) out[i + 1].unshift(...ch);
    else merged.push(ch);
  });
  return merged.map(ch => ch.join(" "));
}
const learn = { progress: store.get("progress", {}), queue: [], cur: null, stage: 0, tokens: [], answer: [], chips: [], blanks: [], placed: 0, mistakes: 0, done: false };
const pkey = c => (state.ver === "ez" ? "ez:" : "") + c.id;
const stageOf = c => learn.progress[pkey(c)] || 0;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const core = w => w.replace(/^[“"‘'(]+|[.,:;?!”"’')]+$/g, "");

function speakText(t) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t); u.lang = "en-US"; u.rate = 0.95;
  speechSynthesis.speak(u);
}

function buildLearn() {
  learn.queue = CARDS.filter(c => state.pages.has(c.p) && stageOf(c) < 3);
  nextTask();
}

function nextTask() {
  learn.cur = learn.queue.shift() || null;
  learn.placed = 0; learn.mistakes = 0; learn.done = false;
  const c = learn.cur;
  if (c) {
    learn.stage = stageOf(c);
    learn.tokens = learn.stage === 1 ? chunks(EN(c)) : EN(c).split(/\s+/);
    if (learn.stage === 1) {
      learn.answer = learn.tokens.slice();
      learn.chips = shuffled(learn.tokens.map((w, i) => ({ w, i })));
    } else if (learn.stage === 2) {
      const cand = learn.tokens.map((w, i) => i).filter(i => isKey(learn.tokens[i]));
      const pool = cand.length ? cand : learn.tokens.map((w, i) => i);
      const n = Math.max(1, Math.round(pool.length * 0.6));
      // 숫자·고유명사를 먼저, 나머지는 섞어서
      const score = i => { const w = learn.tokens[i]; return (/\d/.test(w) ? 100 : 0) + (i > 0 && /^[A-Z]/.test(w) ? 20 : 0) + Math.random() * 10; };
      learn.blanks = pool.slice().sort((a, b) => score(b) - score(a)).slice(0, n).sort((a, b) => a - b);
      learn.answer = learn.blanks.map(i => core(learn.tokens[i]));
      const used = new Set(learn.answer.map(w => w.toLowerCase()));
      const others = shuffled(CARDS.filter(x => x.id !== c.id).flatMap(x => EN(x).split(/\s+/).filter(isKey).map(core)))
        .filter(w => w.length >= 3 && !used.has(w.toLowerCase()) && (used.add(w.toLowerCase()), true)).slice(0, 2);
      learn.chips = shuffled([...learn.answer, ...others].map((w, i) => ({ w, i })));
    }
  }
  renderLearn();
}

function renderLearnProgress() {
  const scope = CARDS.filter(c => state.pages.has(c.p));
  const sum = scope.reduce((a, c) => a + stageOf(c), 0);
  const cnt = [0, 0, 0, 0]; scope.forEach(c => cnt[stageOf(c)]++);
  $("lCounter").textContent = `${state.ver === "ez" ? "쉬운 말" : "원문"} · 보고 듣기 ${cnt[0]} · 배치 ${cnt[1]} · 빈칸 ${cnt[2]} · 완료 ${cnt[3]}`;
  const pct = scope.length ? Math.round(sum / (scope.length * 3) * 100) : 0;
  $("lPct").textContent = pct + "%";
  $("lBar").style.width = pct + "%";
}

function renderLearn() {
  renderLearnProgress();
  const box = $("learnBody"), c = learn.cur;
  if (!c) {
    box.innerHTML = `<div class="card lcard"><div class="empty">선택한 페이지의 문장을 모두 외웠어요!<br>‘복습 카드’로 점검하거나 처음부터 다시 연습해 보세요.</div></div>
      <div class="lrow"><button class="primary" id="lRestart">이 페이지들 처음부터 다시</button></div>`;
    $("lRestart").onclick = () => { CARDS.forEach(x => { if (state.pages.has(x.p)) delete learn.progress[pkey(x)]; }); store.set("progress", learn.progress); buildLearn(); };
    return;
  }
  const st = learn.stage;
  const pills = STAGES.map((n, i) => `<span class="${i === st ? "on" : i < st ? "ok" : ""}">${i + 1} ${n}</span>`).join("");
  let body = "", bank = "", foot = "";

  if (st === 0) {
    body = `<div><div class="lang">English</div><div class="en-full">${keyHtml(EN(c))}</div>${subHtml(c)}</div>`;
    foot = `<div class="lrow"><button id="lSpeak">듣기</button><button class="primary" id="lNext">외웠어요, 다음 단계로</button></div>`;
  } else {
    let ans = "";
    if (st === 1) {
      ans = learn.tokens.slice(0, learn.placed).map((w, i) => `<span class="w${i === learn.placed - 1 ? " new" : ""}">${esc(w)}</span>`).join("") + (learn.done ? "" : '<span class="cursor"></span>');
    } else {
      let k = 0;
      ans = learn.tokens.map((w, i) => {
        if (i !== learn.blanks[k]) return `<span class="w">${esc(w)}</span>`;
        const idx = k++, cw = core(w), rest = w.slice(w.indexOf(cw) + cw.length), lead = w.slice(0, w.indexOf(cw));
        if (idx < learn.placed) return `<span class="w">${esc(lead)}<span class="filled">${esc(cw)}</span>${esc(rest)}</span>`;
        return `<span class="w">${esc(lead)}<span class="blank${idx === learn.placed ? " next" : ""}" style="min-width:${Math.max(2.5, cw.length * 0.55)}em"></span>${esc(rest)}</span>`;
      }).join("");
    }
    body = `<div><div class="lang">English</div><div class="answer">${ans}</div>${learn.done ? subHtml(c) : ""}</div>`;
    if (!learn.done) {
      bank = `<div class="bank" id="bank">${learn.chips.map((ch, j) => `<button data-j="${j}"${ch.used ? " disabled" : ""}>${esc(ch.w)}</button>`).join("")}</div>`;
      foot = `<div class="lrow"><button class="ghost" id="lGiveup">모르겠어요 (하나 보기)</button></div>`;
    } else {
      const ok = learn.mistakes === 0;
      const msg = ok
        ? (st === 2 ? "완벽해요! 이 문장은 완료했어요." : "정확해요! 다음엔 핵심어 빈칸으로 올라갑니다.")
        : `실수 ${learn.mistakes}번. 조금 뒤에 이 단계를 한 번 더 해요.`;
      foot = `<div class="feedback ${ok ? "good" : "retry"}">${msg}</div>
        <div class="lrow"><button id="lSpeak">듣기</button><button class="primary" id="lNext">계속</button></div>`;
    }
  }

  box.innerHTML = `
    <div class="card lcard">
      <div class="card-top"><span><b class="mono">${c.p}</b> ${esc(c.t)} · 문장 ${c.n}/${c.total}</span></div>
      <div class="stages">${pills}</div>
      <div><div class="lang">한국어</div><div class="front">${esc(c.ko)}</div></div>
      ${body}
    </div>
    ${bank}${foot}`;

  if ($("lSpeak")) $("lSpeak").onclick = () => speakText(EN(c));
  if ($("lNext")) $("lNext").onclick = finishTask;
  if ($("lGiveup")) $("lGiveup").onclick = () => {
    const want = learn.answer[learn.placed];
    const ch = learn.chips.find(x => !x.used && norm(x.w) === norm(want));
    learn.mistakes++; place(ch);
  };
  if ($("bank")) $("bank").onclick = e => {
    const b = e.target.closest("button"); if (!b) return;
    const ch = learn.chips[+b.dataset.j];
    if (norm(ch.w) === norm(learn.answer[learn.placed])) place(ch);
    else {
      learn.mistakes++;
      b.classList.remove("wrong"); void b.offsetWidth; b.classList.add("wrong");
    }
  };
}

function place(ch) {
  if (ch) ch.used = true;
  learn.placed++;
  if (learn.placed >= learn.answer.length) { learn.done = true; speakText(EN(learn.cur)); }
  renderLearn();
}

function finishTask() {
  const c = learn.cur; if (!c) return;
  if (learn.stage === 0 || learn.mistakes === 0) {
    learn.progress[pkey(c)] = learn.stage + 1;
    store.set("progress", learn.progress);
  }
  // 아직 안 끝난 문장은 두 문장 뒤에 다시 등장
  if (stageOf(c) < 3) learn.queue.splice(Math.min(2, learn.queue.length), 0, c);
  nextTask();
}

// 시작
setFront(state.front);
setView(store.get("view", "learn"));
renderChips();
setVer(state.ver);
buildDeck();
renderScript();
</script>
