<style>
/* Layout: 한 줄 상단바 + 720px 단일 컬럼 노트. 카드는 "색인 카드"처럼 쓰는 곳에만. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --ink: #1d2421;
  --muted: #5d6a64;
  --line: #dbe2de;
  --accent: #2b6e64;
  --accent-ink: #ffffff;
  --accent-soft: #e1eeea;
  --mark: #ffe680;
  --mark-ink: #3a3000;
  --good: #2c8553;
  --good-soft: #e3f3e9;
  --warn: #a8701a;
  --warn-soft: #fbf0dc;
  --bad: #be4038;
  --bad-soft: #fbe6e4;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --surface: #1b2220; --ink: #e5ebe8; --muted: #9aa7a1; --line: #2d3733;
    --accent: #6cc2b3; --accent-ink: #0f1a17; --accent-soft: #1d3430; --mark: #5c4f12; --mark-ink: #fff3c2;
    --good: #62c48d; --good-soft: #17301f; --warn: #e3a94f; --warn-soft: #33270f; --bad: #ef7d73; --bad-soft: #3a1c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1b2220; --ink: #e5ebe8; --muted: #9aa7a1; --line: #2d3733;
  --accent: #6cc2b3; --accent-ink: #0f1a17; --accent-soft: #1d3430; --mark: #5c4f12; --mark-ink: #fff3c2;
  --good: #62c48d; --good-soft: #17301f; --warn: #e3a94f; --warn-soft: #33270f; --bad: #ef7d73; --bad-soft: #3a1c19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: 0.98rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in, .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; font-size: 1rem; }
.wrap { padding-block: 20px 48px; display: flex; flex-direction: column; gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.tiny { font-size: 0.75rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }

.btn { border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-size: 0.9rem; font-weight: 500; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.wide { width: 100%; padding-block: 11px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer; text-align: left; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 0.74rem; font-weight: 500; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.good { background: var(--good-soft); color: var(--good); border-color: transparent; }

mark, .kw { background: var(--mark); color: var(--mark-ink); padding: 0 4px; border-radius: 3px; }

.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }

.stats b { display: block; font-size: 1.35rem; font-family: var(--font-mono); }
.notice { border-radius: var(--r); padding: 12px 14px; font-size: 0.86rem; background: var(--warn-soft); color: var(--ink); border: 1px solid transparent; }
.notice.err { background: var(--bad-soft); }
.defn { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-weight: 500; }

.field { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--surface); }
textarea.field { resize: vertical; }
.drop { display: block; border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; cursor: pointer; color: var(--muted); }
.drop:hover { border-color: var(--accent); }
.file { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
.file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; overflow-x: auto; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 49px); z-index: 4; }
.tab { flex: 1; white-space: nowrap; border: 0; background: transparent; border-radius: 7px; padding: 7px 10px; font-size: 0.88rem; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }

.flash { min-height: 230px; width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 28px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; cursor: pointer;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px); background-position: 0 58px; }
.flash .q { font-size: 1.12rem; font-weight: 500; background: var(--surface); padding: 0 6px; }
.flash .a { white-space: pre-line; background: var(--surface); padding: 0 6px; }
.flash .tiny, .flash .badge { background: var(--surface); padding-inline: 6px; }

.rate .r-unsure { color: var(--warn); }
.rate .r-dontknow { color: var(--bad); }
.rate button[aria-pressed="true"] { border-width: 2px; font-weight: 700; }
.rate .r-know[aria-pressed="true"] { border-color: var(--good); }
.rate .r-unsure[aria-pressed="true"] { border-color: var(--warn); }
.rate .r-dontknow[aria-pressed="true"] { border-color: var(--bad); }

.cloze { line-height: 2.4; }
.cloze input { width: 8.5em; max-width: 60vw; border: 0; border-bottom: 2px solid var(--accent); background: var(--bg); text-align: center; padding: 2px 6px; margin: 0 4px; border-radius: 4px 4px 0 0; }
.cloze input.ok { border-color: var(--good); color: var(--good); }
.cloze input.no { border-color: var(--bad); color: var(--bad); }
.cloze .fix { font-size: 0.78rem; color: var(--good); margin-right: 4px; }

.choice { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice .n { color: var(--muted); font-family: var(--font-mono); }
.answerbox { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.point { background: var(--mark); color: var(--mark-ink); border-radius: 8px; padding: 8px 12px; }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.dday { font-family: var(--font-mono); font-size: 0.8rem; color: var(--bad); font-weight: 500; }
details summary { cursor: pointer; }
ol, ul { margin: 0; padding-left: 1.3em; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 480px) { .stats b { font-size: 1.1rem; } .tab { padding: 7px 6px; font-size: 0.82rem; } }
</style>

<div class="bar"><div class="bar-in">
  <button class="brand" data-act="home">시험 맞춤 암기 도우미</button>
  <button class="btn sec" data-act="new" id="bar-new">+ 새 학습</button>
</div></div>
<main class="wrap" id="app"><p class="muted">불러오는 중…</p></main>

<script>
"use strict";
// ───────── 상수 ─────────
const QTYPES = ["mcq", "ox", "short", "fill", "brief", "essay"];
const QT = { mcq: "객관식", ox: "OX", short: "단답형", fill: "빈칸 채우기", brief: "약술형", essay: "서술형" };
const DIFF = { easy: "쉬움", normal: "보통", hard: "어려움" };
const GOAL = { minimum: "최소 암기", standard: "일반 학습", high: "고득점 대비" };
const GOAL_DESC = { minimum: "시험에 필요한 핵심만", standard: "주요 개념을 충분히", high: "세부 내용까지" };
const STATUS = { unlearned: "미암기", review: "복습 필요", mastered: "암기 완료" };
const STATUS_TONE = { unlearned: "", review: "warn", mastered: "good" };
const VERDICT = { correct: "정답", partial: "부분 정답", wrong: "오답" };
const CHUNK_CHARS = 30000;
const MIN_TEXT = 15;

// ───────── 상태 ─────────
let DB = null, SAMPLE = null, BASE = "";
const S = {
  ready: false, unavailable: "", sets: null,
  view: "home", setId: null, meta: null, concepts: [], attempts: [],
  tab: null, onlyEss: true, reviewTab: "weak", busy: "", error: "",
  draft: null, cards: null, quiz: null, confirmDelete: null, clozeState: {}, clozeDraft: {},
};

// ───────── 도우미 ─────────
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);
const str = (v) => (typeof v === "string" ? v : v == null ? "" : String(v));
const arr = (v) => (Array.isArray(v) ? v : []);
const strs = (v) => arr(v).map(str).filter(Boolean);
const norm = (s) => str(s).replace(/[\s.,·()\-"'`]/g, "").toLowerCase();
const clean = (s) => s.replace(/[ \t]+/g, " ").replace(/\n{3,}/g, "\n\n").trim();
const $ = (sel) => document.querySelector(sel);

function sampleErrorText(e) {
  const code = e && e.code;
  const map = {
    not_granted: "Claude 사용이 허용되지 않았습니다. 페이지의 권한 메뉴에서 Claude 사용을 허용한 뒤 다시 시도하세요.",
    sampling_disabled: "이 계정에서는 아티팩트의 Claude 호출을 사용할 수 없습니다.",
    rate_limited: "Claude 사용 한도에 도달했거나 요청이 많습니다. 잠시 후 다시 시도하세요.",
    session_expired: "로그인이 만료되었습니다. claude.ai에 다시 로그인하세요.",
    prompt_too_large: "보낼 내용이 너무 깁니다. 자료를 나눠서 올려주세요.",
    refused: "Claude가 이 내용에 응답하지 않았습니다. 자료 내용을 확인하세요.",
    invalid_json: "AI 응답 형식을 해석하지 못했습니다. 다시 시도하세요.",
    empty_completion: "AI가 빈 응답을 보냈습니다. 다시 시도하세요.",
    cancelled: "취소되었습니다.",
  };
  return map[code] || "AI 요청 중 일시적인 오류가 발생했습니다. 다시 시도하세요.";
}
function dbErrorText(e) {
  if (e && e.code === "quota_exceeded") return "저장 공간이 가득 찼습니다. 사용하지 않는 학습 세트를 삭제하세요.";
  if (e && e.code === "invalid_argument") return "저장하지 못했습니다(데이터가 너무 크거나 형식이 잘못됨).";
  return "저장소와 통신하지 못했습니다. 잠시 후 다시 시도하세요.";
}

// ───────── 저장소 (내 계정 전용 경로) ─────────
const P = {
  sets: () => `${BASE}/sets`,
  set: (id) => `${BASE}/sets/${id}`,
  chunks: (id) => `${BASE}/sets/${id}/chunks`,
  concepts: (id) => `${BASE}/sets/${id}/concepts`,
  attempts: (id) => `${BASE}/sets/${id}/attempts`,
};
async function retry(fn) {
  try { return await fn(); }
  catch (e) {
    if (e && e.code === "unavailable") { await new Promise((r) => setTimeout(r, 400 + Math.random() * 600)); return fn(); }
    throw e;
  }
}
const getAll = async (path) => (await retry(() => DB.collection(path).limit(1000).get())).docs.map((d) => ({ id: d.id, ...d.data() }));
const put = (path, data) => retry(() => DB.doc(path).set(data));
const patch = (path, data) => retry(() => DB.doc(path).update(data));
const remove = (path) => retry(() => DB.doc(path).delete());

async function loadSets() {
  try {
    const sets = await getAll(P.sets());
    for (const s of sets) {
      // 진행률 표시를 위해 개념 수만 가볍게 계산 (메타에 캐시)
      s.stat = s.stat || { essential: 0, mastered: 0 };
    }
    S.sets = sets.sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  } catch (e) { S.sets = []; S.error = dbErrorText(e); }
  render();
}

async function openSet(id, view = "set") {
  S.view = view; S.setId = id; S.meta = null; S.concepts = []; S.attempts = []; S.tab = null; S.cards = null; S.quiz = null; S.error = "";
  render();
  try {
    const meta = await retry(() => DB.doc(P.set(id)).get());
    if (!meta.exists) { S.meta = false; return render(); }
    S.meta = { id, ...meta.data() };
    S.concepts = (await getAll(P.concepts(id))).sort((a, b) => (a.order || 0) - (b.order || 0));
    S.attempts = (await getAll(P.attempts(id))).sort((a, b) => a.at - b.at);
  } catch (e) { S.error = dbErrorText(e); }
  render();
}

async function touchMeta() {
  const st = stats();
  S.meta.updatedAt = Date.now();
  S.meta.stat = { essential: st.essentialTotal, mastered: st.essential.mastered };
  try { await patch(P.set(S.meta.id), { updatedAt: S.meta.updatedAt, stat: S.meta.stat }); } catch (e) { /* 진행률 캐시는 다음 저장 때 다시 시도 */ }
}

// ───────── 진행 상태 계산 ─────────
const EMPTY = { status: "unlearned", streak: 0, correct: 0, wrong: 0, selfRating: null, lastAt: 0 };
const prog = (c) => c.progress || EMPTY;
function applyVerdict(p, v) {
  const now = Date.now();
  if (v === "correct") {
    const streak = p.streak + 1;
    const need = p.wrong > 0 ? 2 : 1; // 틀린 적 있으면 연속 2번
    return { ...p, streak, correct: p.correct + 1, status: streak >= need ? "mastered" : "review", lastAt: now };
  }
  if (v === "partial") return { ...p, streak: 0, status: "review", lastAt: now };
  return { ...p, streak: 0, wrong: p.wrong + 1, status: "review", lastAt: now };
}
function applySelf(p, r) {
  const next = { ...p, selfRating: r, lastAt: Date.now() };
  if (r !== "know" && p.status !== "review") next.status = "review";
  return next;
}
function priority(p) {
  let s = p.wrong * 3 - p.streak * 2;
  if (p.selfRating === "dontknow") s += 3;
  if (p.selfRating === "unsure") s += 2;
  if (p.status === "review") s += 4;
  if (p.status === "unlearned") s += 1;
  if (p.status === "mastered") s -= 10;
  return s;
}
const isWeak = (p) => p.status === "review" || (p.status !== "mastered" && (p.selfRating === "unsure" || p.selfRating === "dontknow"));
const weakConcepts = () => S.concepts.filter((c) => isWeak(prog(c))).sort((a, b) => priority(prog(b)) - priority(prog(a)));
function stats() {
  const ess = S.concepts.filter((c) => c.tier === "essential");
  const essential = { mastered: 0, review: 0, unlearned: 0 };
  for (const c of ess) essential[prog(c).status]++;
  const by = {};
  for (const a of S.attempts) {
    const t = (by[a.question.type] ||= { total: 0, score: 0 });
    t.total++; t.score += a.verdict === "correct" ? 1 : a.verdict === "partial" ? 0.5 : 0;
  }
  return {
    essentialTotal: ess.length, essential,
    percent: ess.length ? Math.round((essential.mastered / ess.length) * 100) : 0,
    byType: QTYPES.filter((t) => by[t]).map((t) => ({ type: t, total: by[t].total, rate: Math.round((by[t].score / by[t].total) * 100) })),
  };
}
async function saveProgress(c, p) {
  c.progress = p;
  render();
  try { await patch(`${P.concepts(S.meta.id)}/${c.id}`, { progress: p }); await touchMeta(); }
  catch (e) { S.error = dbErrorText(e); render(); }
}

// ───────── 파일 읽기 (브라우저에서) ─────────
async function parsePdf(buf) {
  if (!window.pdfjsLib) throw new Error("PDF 라이브러리를 불러오지 못했습니다.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    let t = "";
    for (const it of tc.items) { t += it.str || ""; if (it.hasEOL) t += "\n"; }
    pages.push({ label: `p.${i}`, text: clean(t) });
  }
  return pages;
}
const decodeXml = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n)).replace(/&amp;/g, "&");
async function parsePptx(buf) {
  if (!window.JSZip) throw new Error("PPTX 라이브러리를 불러오지 못했습니다.");
  const zip = await JSZip.loadAsync(buf);
  const slides = Object.keys(zip.files).map((n) => [n, n.match(/^ppt\/slides\/slide(\d+)\.xml$/)]).filter((x) => x[1]).map((x) => ({ name: x[0], n: +x[1][1] })).sort((a, b) => a.n - b.n);
  const pages = [];
  for (const s of slides) {
    const xml = await zip.file(s.name).async("string");

    cur += p + "\n\n";
  }
  if (cur.trim()) pages.push({ label: `구간 ${pages.length + 1}`, text: clean(cur) });

}
async function parseFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".ppt")) throw new Error("구버전 .ppt는 지원하지 않습니다. PowerPoint에서 .pptx 또는 PDF로 저장해 올려주세요.");
  if (!/\.(pdf|pptx|txt|md)$/.test(name)) throw new Error("PDF, PPTX, TXT 파일만 지원합니다.");
  if (file.size > 50 * 1024 * 1024) throw new Error("파일이 너무 큽니다(최대 50MB).");
  const buf = await file.arrayBuffer();
  let pages;
  try {
    pages = name.endsWith(".pdf") ? await parsePdf(buf) : name.endsWith(".pptx") ? await parsePptx(buf) : parseTxt(buf);
  } catch (e) {
    throw new Error(`파일을 읽지 못했습니다. 손상되었거나 암호가 걸려 있을 수 있습니다.`);
  }
  const empty = pages.filter((p) => p.text.length < MIN_TEXT).map((p) => p.label);
  if (!pages.length || empty.length === pages.length)
    throw new Error("텍스트를 찾지 못했습니다. 스캔본·이미지로만 된 자료는 텍스트 추출이 불가능합니다. 내용을 TXT로 붙여넣어 올려주세요.");
  const warnings = [];
  if (empty.length) warnings.push(`텍스트가 거의 없는 페이지(이미지 위주일 가능성): ${empty.slice(0, 15).join(", ")}${empty.length > 15 ? ` 외 ${empty.length - 15}개` : ""}. 이 부분의 그림·도표 내용은 학습에 반영되지 않습니다.`);
  return { pages: pages.filter((p) => p.text.length >= MIN_TEXT), warnings };
}
function buildChunks(materials) {
  const chunks = [];
  for (const m of materials) {
    let buf = [], size = 0, first = "", last = "";
    const flush = () => { if (buf.length) { chunks.push({ text: buf.join("\n\n"), label: `${m.lecture} ${first}${first !== last ? `~${last}` : ""}` }); buf = []; size = 0; } };
    for (const p of m.pages) {
      const block = `[${m.lecture} | ${p.label}]\n${p.text}`.slice(0, CHUNK_CHARS);
      if (size + block.length > CHUNK_CHARS && buf.length) flush();
      if (!buf.length) first = p.label;
      buf.push(block); size += block.length; last = p.label;
    }
    flush();
  }
  return chunks;
}

function splitCounts(types, weights, total) {
  const w = types.map((t) => weights[t] || 0), sum = w.reduce((a, b) => a + b, 0);
  const raw = (sum ? w.map((x) => x / sum) : types.map(() => 1 / types.length)).map((r) => r * total);
  const counts = raw.map(Math.floor);
  let left = total - counts.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { counts[i]++; left--; } });
  return Object.fromEntries(types.map((t, i) => [t, counts[i]]));
}

function statusBadge(c) { const s = prog(c).status; return badge(STATUS[s], STATUS_TONE[s]); }

function viewCards(list) {

function clozeParts(text) { return str(text).split(/(\[\[[^\]]+\]\])/g).filter((p) => p !== "").map((p) => (p.startsWith("[[") ? { blank: p.slice(2, -2) } : { text: p })); }

    let j = -1;

      j++;
      const val = st ? st.inputs[j] || "" : S.clozeDraft[`${c.id}-${j}`] || "";
      const cls = st && st.checked ? (norm(val) === norm(p.blank) ? "ok" : "no") : "";
      return `<input id="cz-${c.id}-${j}" data-cz="${c.id}" data-j="${j}" aria-label="빈칸 ${j + 1}" class="${cls}" value="${esc(val)}" ${st && st.checked ? "disabled" : ""}>${st && st.checked && cls === "no" ? `<span class="fix">${esc(p.blank)}</span>` : ""}`;
    }).join("");

}

      <div class="row"><button class="btn" style="flex:1" data-act="q-submit" ${S.busy === "grade" ? "disabled" : ""}>${S.busy === "grade" ? '<span class="spin"></span>AI가 채점하는 중…' : "제출"}</button><button class="btn sec" data-act="q-skip" ${S.busy === "grade" ? "disabled" : ""}>모르겠음</button></div>`;
  }
  const res = r ? `<div class="stack" style="border-top:1px solid var(--line);padding-top:12px;gap:10px">
      <div>${badge(VERDICT[r.verdict], r.verdict === "correct" ? "good" : r.verdict === "partial" ? "warn" : "bad")}</div>
      ${!choice ? `<p class="small"><span class="muted">내 답 · </span>${esc(r.userAnswer)}</p>` : ""}
      ${r.feedback ? `<p class="small">${esc(r.feedback)}</p>` : ""}
      ${r.missing.length ? `<p class="small" style="color:var(--bad)"><b>부족한 내용 · </b>${esc(r.missing.join(", "))}</p>` : ""}
      <div class="answerbox"><p class="label">${long ? "모범답안" : "정답"}</p><p style="white-space:pre-line">${esc(long ? item.modelAnswer || item.answer : item.answer)}</p>${item.requiredKeywords.length ? `<p class="tiny muted">필수 키워드 · ${esc(item.requiredKeywords.join(", "))}</p>` : ""}</div>
      <p class="small"><span class="label">해설 </span>${esc(item.explanation)}</p>
      <p class="point small"><b>암기 포인트</b> ${esc(item.keyPoint)}</p>
      ${c ? `<p class="tiny muted">출처 ${esc(src(c))} · 개념 ${esc(c.title)}</p>` : ""}
      <button class="btn wide" data-act="q-next">${q.i + 1 < q.questions.length ? "다음 문제" : "결과 보기"}</button>
    </div>` : "";
  return `<div class="between tiny muted"><span class="mono">${q.i + 1} / ${q.questions.length}</span>${badge(QT[item.type])}</div>
    <section class="card"><p style="white-space:pre-line;font-weight:500">${esc(item.question)}</p>${input}${res}</section>`;
}

function viewReview() {
  if (S.meta === null) return `${errBox()}<p class="muted"><span class="spin"></span>불러오는 중…</p>`;
  if (S.meta === false) return `<div class="card">학습 세트를 찾을 수 없습니다.</div>`;
  const weak = weakConcepts();
  const latest = new Map();
  for (const a of S.attempts) latest.set(a.question.question, a);
  const wrong = [...latest.values()].filter((a) => a.verdict !== "correct").sort((a, b) => b.at - a.at);
  const t = S.reviewTab;
  let body = "";
  if (t === "weak") {
    body = weak.length ? `<p class="tiny muted">틀렸거나 헷갈린 개념만 우선순위 순으로 모았습니다. 반복해서 맞히면 목록에서 빠집니다.</p>` + weak.map((c) => {
      const p = prog(c);
      return `<article class="card">${conceptHead(c)}<p class="defn">${esc(c.definition)}</p><p class="small">${esc(c.summary)}</p>
        ${c.keywords.length ? `<div class="row">${c.keywords.map((k) => `<span class="kw small">${esc(k)}</span>`).join("")}</div>` : ""}
        ${c.confusions.map((x) => `<p class="small"><b>vs ${esc(x.other)}</b> · ${esc(x.difference)}</p>`).join("")}
        <p class="tiny muted">출처 ${esc(src(c))} · 오답 <span class="mono">${p.wrong}</span>회 · 연속 정답 <span class="mono">${p.streak}</span>회</p></article>`;
    }).join("") + `<button class="btn wide" data-act="rtab" data-t="test">취약 개념만 테스트하기</button>`
      : `<div class="card muted" style="text-align:center">취약 개념이 없습니다. 실전 테스트로 기억을 확인해보세요.</div>`;
  } else if (t === "wrong") {
    body = wrong.length ? wrong.map((a) => {
      const q = a.question, c = S.concepts.find((x) => x.id === q.conceptId), long = q.type === "brief" || q.type === "essay";
      return `<article class="card small"><div class="between"><div class="row">${badge(QT[q.type])}${badge(VERDICT[a.verdict], a.verdict === "partial" ? "warn" : "bad")}</div><span class="tiny muted mono">${new Date(a.at).toLocaleDateString("ko-KR")}</span></div>
        <p style="font-weight:500;white-space:pre-line">${esc(q.question)}</p>
        <p><span class="muted">내 답 · </span>${esc(a.userAnswer)}</p>
        <div class="answerbox"><span class="label">${long ? "모범답안" : "정답"} </span>${esc(long ? q.modelAnswer || q.answer : q.answer)}</div>
        ${a.missing.length ? `<p style="color:var(--bad)">부족한 내용 · ${esc(a.missing.join(", "))}</p>` : ""}
        <p>${esc(q.explanation)}</p><p class="point">${esc(q.keyPoint)}</p>
        ${c ? `<p class="tiny muted">출처 ${esc(src(c))}</p>` : ""}</article>`;
    }).join("") : `<div class="card muted" style="text-align:center">아직 틀린 문제가 없습니다.</div>`;
  } else {
    body = viewQuiz("weak");
  }
  return `${setHeader(`<button class="btn sec" data-act="to-set">학습 화면</button>`)}
    ${errBox()}${dashboard()}
    <div class="tabs" role="tablist">${[["weak", `취약 개념 ${weak.length}`], ["wrong", `오답 목록 ${wrong.length}`], ["test", "취약 개념 테스트"]].map(([id, l]) => `<button class="tab" role="tab" aria-selected="${t === id}" data-act="rtab" data-t="${id}">${l}</button>`).join("")}</div>
    ${body}`;
}

// ───────── 동작 ─────────
async function createSet() {
  const d = S.draft;
  const materials = d.uploads.filter((u) => u.state === "done").map((u) => ({ lecture: (u.lecture || "").trim() || u.fileName, fileName: u.fileName, pages: u.pages, warnings: u.warnings || [] }));
  const chunks = buildChunks(materials);
  const id = uid(), now = Date.now();
  const meta = {
    id, name: d.name.trim() || materials[0].lecture, createdAt: now, updatedAt: now,
    settings: { types: QTYPES.filter((t) => d.types.includes(t)), weights: Object.fromEntries(d.types.map((t) => [t, d.weights[t] || 0])), difficulty: d.difficulty, goal: d.goal, emphasis: d.emphasis, scope: d.scope, examDate: d.examDate, pastExam: d.pastExam },
    materials: materials.map((m) => ({ lecture: m.lecture, fileName: m.fileName, pageCount: m.pages.length, warnings: m.warnings })),
    strategy: null, notes: [], chunksTotal: chunks.length, chunksDone: 0, conceptCount: 0, stat: { essential: 0, mastered: 0 },
  };
  S.busy = "create"; S.error = ""; render();
  try {
    for (let i = 0; i < chunks.length; i++) await put(`${P.chunks(id)}/c${i}`, { index: i, label: chunks[i].label, text: chunks[i].text });
    await put(P.set(id), meta);
    S.busy = ""; S.draft = null;
    S.sets = null; loadSets();
    openSet(id);
  } catch (e) { S.busy = ""; S.error = dbErrorText(e); render(); }
}

async function analyze() {
  if (!SAMPLE) { S.error = "이 화면에서는 Claude를 호출할 수 없습니다."; return render(); }
  const m = S.meta;
  S.busy = "analyze"; S.error = ""; render();
  const titles = S.concepts.map((c) => c.title);
  try {
    for (let i = m.chunksDone; i < m.chunksTotal; i++) {
      const chunk = (await retry(() => DB.doc(`${P.chunks(m.id)}/c${i}`).get())).data();
      if (!chunk) throw { code: "missing_chunk" };
      const raw = await SAMPLE.json(analyzePrompt(m.settings, chunk.text, titles, `${i + 1}/${m.chunksTotal} (${chunk.label})`), { modelTier: "default" });
      const seen = new Set(titles.map(norm));
      const fresh = [];
      for (const rc of arr(raw && raw.concepts)) {
        const c = cleanConcept(rc || {});
        if (!c.title || !c.definition || seen.has(norm(c.title))) continue;
        seen.add(norm(c.title)); titles.push(c.title);
        fresh.push({ ...c, id: uid(), order: (m.conceptCount || 0) + fresh.length, progress: EMPTY });
      }
      for (const c of fresh) await put(`${P.concepts(m.id)}/${c.id}`, c);
      S.concepts.push(...fresh);
      if (!m.strategy && raw && raw.strategy) m.strategy = { overview: str(raw.strategy.overview), focus: strs(raw.strategy.focus), methods: strs(raw.strategy.methods) };
      m.notes = [...new Set([...(m.notes || []), ...strs(raw && raw.warnings)])];
      m.chunksDone = i + 1; m.conceptCount = (m.conceptCount || 0) + fresh.length;
      const st = stats();
      m.stat = { essential: st.essentialTotal, mastered: st.essential.mastered }; m.updatedAt = Date.now();
      await patch(P.set(m.id), { strategy: m.strategy, notes: m.notes, chunksDone: m.chunksDone, conceptCount: m.conceptCount, stat: m.stat, updatedAt: m.updatedAt });
      render();
    }
  } catch (e) {
    S.error = e && e.code === "missing_chunk" ? "저장된 자료 구간을 찾지 못했습니다. 학습 세트를 다시 만들어주세요." : e && "message" in e && DB_CODES.has(e.code) ? dbErrorText(e) : sampleErrorText(e);
  }
  S.busy = ""; render();
}
const DB_CODES = new Set(["invalid_argument", "resource_exhausted", "quota_exceeded", "unavailable", "revoked"]);

async function genQuiz() {
  if (!SAMPLE) { S.error = "이 화면에서는 Claude를 호출할 수 없습니다."; return render(); }
  const q = S.quiz, concepts = pickConcepts(q.scope);
  if (!concepts.length) { S.error = q.scope === "weak" ? "취약 개념이 없습니다. 먼저 학습·테스트를 진행하세요." : "출제할 개념이 없습니다."; return render(); }
  const ids = new Set(concepts.map((c) => c.id));
  const avoid = S.attempts.filter((a) => ids.has(a.question.conceptId)).map((a) => a.question.question);
  S.busy = "quiz"; S.error = ""; render();
  try {
    const raw = await SAMPLE.json(quizPrompt(S.meta.settings, concepts, splitCounts(q.types, S.meta.settings.weights, q.count), avoid), { modelTier: "default", cache: false });
    const questions = cleanQuestions(raw, ids, q.types);
    if (!questions.length) throw { code: "invalid_json" };
    Object.assign(q, { questions, i: 0, answer: "", result: null, score: [] });
  } catch (e) { S.error = sampleErrorText(e); }
  S.busy = ""; render();
}
async function record(item, userAnswer, g) {
  const q = S.quiz;
  q.result = { ...g, userAnswer }; q.score.push(g.verdict);
  const a = { id: uid(), at: Date.now(), question: item, userAnswer, verdict: g.verdict, feedback: g.feedback, missing: g.missing };
  S.attempts.push(a);
  const c = S.concepts.find((x) => x.id === item.conceptId);
  render();
  try {
    await put(`${P.attempts(S.meta.id)}/${a.id}`, a);
    if (c) await saveProgress(c, applyVerdict(prog(c), g.verdict));
  } catch (e) { S.error = dbErrorText(e); render(); }
}
async function submit(userAnswer) {
  const item = S.quiz.questions[S.quiz.i];
  if (item.type === "mcq" || item.type === "ox") return record(item, userAnswer, { verdict: userAnswer === item.answer ? "correct" : "wrong", feedback: "", missing: [] });
  if (!userAnswer.trim()) return record(item, "(모름)", { verdict: "wrong", feedback: "답을 쓰지 않았습니다.", missing: item.requiredKeywords });
  if ((item.type === "short" || item.type === "fill") && item.answer.split("/").map(norm).includes(norm(userAnswer)))
    return record(item, userAnswer, { verdict: "correct", feedback: "", missing: [] });
  if (!SAMPLE) { S.error = "이 화면에서는 AI 채점을 할 수 없습니다."; return render(); }
  S.busy = "grade"; S.error = ""; render();
  try {
    const g = await SAMPLE.json(gradePrompt(item, userAnswer), { modelTier: "default" });
    const verdict = ["correct", "partial", "wrong"].includes(g && g.verdict) ? g.verdict : null;
    if (!verdict) throw { code: "invalid_json" };
    S.busy = "";
    await record(item, userAnswer, { verdict, feedback: str(g.feedback), missing: strs(g.missing) });
  } catch (e) { S.busy = ""; S.error = sampleErrorText(e); render(); }
}
async function deleteSet(id) {
  S.confirmDelete = null; S.busy = "delete"; render();
  try {
    for (const p of [P.chunks(id), P.concepts(id), P.attempts(id)]) for (const d of await getAll(p)) await remove(`${p}/${d.id}`);
    await remove(P.set(id));
    S.sets = S.sets.filter((s) => s.id !== id);
  } catch (e) { S.error = dbErrorText(e); }
  S.busy = ""; render();
}

const ACTIONS = {
  home: () => { S.view = "home"; S.error = ""; S.confirmDelete = null; render(); window.scrollTo(0, 0); },
  new: () => { S.view = "new"; S.draft ||= newDraft(); S.error = ""; render(); window.scrollTo(0, 0); },
  open: (el) => openSet(el.dataset.id, "set"),
  "open-review": (el) => openSet(el.dataset.id, "review"),
  delete: (el) => { S.confirmDelete = el.dataset.id; render(); },
  "delete-no": () => { S.confirmDelete = null; render(); },
  "delete-yes": (el) => deleteSet(el.dataset.id),
  "rm-file": (el) => { S.draft.uploads = S.draft.uploads.filter((u) => u.key !== el.dataset.key); render(); },
  type: (el) => { const d = S.draft, t = el.dataset.t; d.types = d.types.includes(t) ? d.types.filter((x) => x !== t) : [...d.types, t]; render(); },
  goal: (el) => { S.draft.goal = el.dataset.g; render(); },
  diff: (el) => { S.draft.difficulty = el.dataset.k; render(); },
  extra: () => { S.draft.extraOpen = !S.draft.extraOpen; render(); },
  start: () => createSet(),
  analyze: () => analyze(),
  tab: (el) => { S.tab = el.dataset.tab; S.error = ""; render(); },
  "only-ess": (el) => { S.onlyEss = el.checked; render(); },
  "to-review": () => { S.view = "review"; S.quiz = null; S.error = ""; render(); window.scrollTo(0, 0); },
  "to-set": () => { S.view = "set"; S.quiz = null; S.error = ""; render(); window.scrollTo(0, 0); },
  rtab: (el) => { S.reviewTab = el.dataset.t; S.quiz = null; S.error = ""; render(); },
  rate: (el) => { const c = S.concepts.find((x) => x.id === el.dataset.id); saveProgress(c, applySelf(prog(c), el.dataset.r)); },
  flip: () => { S.cards.flipped = !S.cards.flipped; render(); },
  "card-rate": (el) => { const c = S.concepts.find((x) => x.id === el.dataset.id); S.cards.i++; S.cards.flipped = false; saveProgress(c, applySelf(prog(c), el.dataset.r)); },
  "card-prev": () => { S.cards.i = Math.max(0, S.cards.i - 1); S.cards.flipped = false; render(); },
  "card-next": () => { S.cards.i++; S.cards.flipped = false; render(); },
  "cards-restart": () => { S.cards = null; render(); },
  "cz-check": (el) => {
    const c = S.concepts.find((x) => x.id === el.dataset.id), blanks = clozeParts(c.cloze).filter((p) => p.blank !== undefined);
    const inputs = blanks.map((_, j) => ($(`#cz-${c.id}-${j}`) || {}).value || "");
    S.clozeState[c.id] = { inputs, checked: true };
    const allOk = blanks.every((b, j) => norm(inputs[j]) === norm(b.blank));
    saveProgress(c, applySelf(prog(c), allOk ? "know" : "unsure"));
  },
  "cz-reset": (el) => { delete S.clozeState[el.dataset.id]; for (const k of Object.keys(S.clozeDraft)) if (k.startsWith(el.dataset.id + "-")) delete S.clozeDraft[k]; render(); },
  "q-scope": (el) => { S.quiz.scope = el.dataset.s; render(); },
  "q-type": (el) => { const q = S.quiz, t = el.dataset.t; q.types = q.types.includes(t) ? (q.types.length > 1 ? q.types.filter((x) => x !== t) : q.types) : [...q.types, t]; render(); },
  "q-count": (el) => { S.quiz.count = +el.dataset.n; render(); },
  "q-gen": () => genQuiz(),
  "q-setup": () => { S.quiz.questions = null; render(); },
  "q-choice": (el) => submit(S.quiz.questions[S.quiz.i].choices[+el.dataset.i]),
  "q-submit": () => submit(S.quiz.answer),
  "q-skip": () => submit(""),
  "q-next": () => { Object.assign(S.quiz, { i: S.quiz.i + 1, result: null, answer: "" }); S.error = ""; render(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn && el.type !== "checkbox") fn(el);
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "only-ess") return ACTIONS["only-ess"](el);
  if (el.id === "d-files") {
    for (const file of Array.from(el.files || [])) {
      const u = { key: uid(), fileName: file.name, lecture: file.name.replace(/\.[^.]+$/, ""), state: "parsing" };
      S.draft.uploads.push(u);
      parseFile(file).then((r) => Object.assign(u, { state: "done", pages: r.pages, warnings: r.warnings })).catch((err) => Object.assign(u, { state: "error", error: err.message })).finally(() => { if (S.view === "new") render(); });
    }
    el.value = "";
    render();
  }
});
document.addEventListener("input", (e) => {
  const el = e.target, d = S.draft;
  if (el.dataset.draft && d) d[el.dataset.draft] = el.value;
  else if (el.dataset.lec && d) { const u = d.uploads.find((x) => x.key === el.dataset.lec); if (u) u.lecture = el.value; }
  else if (el.dataset.weight && d) { d.weights[el.dataset.weight] = Math.max(0, Math.min(100, +el.value || 0)); }
  else if ("qans" in el.dataset && S.quiz) { S.quiz.answer = el.value; return; }
  else if (el.dataset.cz) { S.clozeDraft[`${el.dataset.cz}-${el.dataset.j}`] = el.value; return; }
  else return;
  if (S.view === "new") {
    // 입력 중 포커스를 잃지 않도록 버튼·안내만 갱신
    const ck = draftCheck(d);
    $("#start-btn").disabled = !ck.ok;
    $("#start-hint").textContent = ck.hint;
    const w = $("#w-msg"); if (w) w.textContent = ck.weightOk ? "" : `비중 합계 ${ck.sum}%`;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.isComposing) return;
  const el = e.target;
  if (el.id === "q-ans" && el.tagName === "INPUT" && S.busy !== "grade") { e.preventDefault(); ACTIONS["q-submit"](); }
  if (el.dataset && el.dataset.cz) { e.preventDefault(); const b = document.querySelector(`[data-act="cz-check"][data-id="${el.dataset.cz}"]`); if (b) b.click(); }
});

// ───────── 시작 ─────────
(async () => {
  render();
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  const [db, user, sample] = await Promise.all([use("db"), use("user"), use("sample")]);
  S.ready = true;
  const id = user ? await user.id().catch(() => null) : null;
  if (!db || !id) {
    S.unavailable = "학습 기록을 저장하려면 claude.ai에 로그인한 상태로 이 페이지를 열어야 합니다. 페이지를 claude.ai에서 다시 열어주세요.";
    return render();
  }
  DB = db; SAMPLE = sample; BASE = `data/users/${id}`;
  render();
  loadSets();
})();
</script>
