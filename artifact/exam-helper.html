async function analyze() {
  if (!SAMPLE) { S.error = "이 화면에서는 Claude를 호출할 수 없습니다."; return render(); }
  const m = S.meta;
  S.busy = "analyze"; S.error = ""; render();
  const titles = S.concepts.map((c) => c.title);
  try {
    for (let i = m.chunksDone; i < m.chunksTotal; i++) {
      const chunk = (await retry(() => DB.doc(`${P.chunks(m.id)}/c${i}`).get())).data();
      if (!chunk) throw { code: "missing_chunk" };
      const raw = await SAMPLE.json(analyzePrompt(m.settings, chunk.text, titles, `${i + 1}/${m.chunksTotal} (${chunk.label})`), { modelTier: "default" });
      const seen = new Set(titles.map(norm));
      const fresh = [];
      for (const rc of arr(raw && raw.concepts)) {
        const c = cleanConcept(rc || {});
        if (!c.title || !c.definition || seen.has(norm(c.title))) continue;
        seen.add(norm(c.title)); titles.push(c.title);
        fresh.push({ ...c, id: uid(), order: (m.conceptCount || 0) + fresh.length, progress: EMPTY });
      }
      for (const c of fresh) await put(`${P.concepts(m.id)}/${c.id}`, c);
      S.concepts.push(...fresh);
      if (!m.strategy && raw && raw.strategy) m.strategy = { overview: str(raw.strategy.overview), focus: strs(raw.strategy.focus), methods: strs(raw.strategy.methods) };
      m.notes = [...new Set([...(m.notes || []), ...strs(raw && raw.warnings)])];
      m.chunksDone = i + 1; m.conceptCount = (m.conceptCount || 0) + fresh.length;
      const st = stats();
      m.stat = { essential: st.essentialTotal, mastered: st.essential.mastered }; m.updatedAt = Date.now();
      await patch(P.set(m.id), { strategy: m.strategy, notes: m.notes, chunksDone: m.chunksDone, conceptCount: m.conceptCount, stat: m.stat, updatedAt: m.updatedAt });
      render();
    }
  } catch (e) {
    S.error = e && e.code === "missing_chunk" ? "저장된 자료 구간을 찾지 못했습니다. 학습 세트를 다시 만들어주세요." : e && "message" in e && DB_CODES.has(e.code) ? dbErrorText(e) : sampleErrorText(e);
  }
  S.busy = ""; render();
}
const DB_CODES = new Set(["local_error", "quota_exceeded"]);

function bankQuiz(q) {
  const concepts = pickConcepts(q.scope, Infinity);
  const asked = new Map();
  for (const a of S.attempts) asked.set(a.question.question, (asked.get(a.question.question) || 0) + 1);
  const pools = concepts.map((c) => shuffle((c.bank || []).filter((b) => q.types.includes(b.type)))
    .sort((a, b) => (asked.get(a.question) || 0) - (asked.get(b.question) || 0))
    .map((b) => ({ ...b, conceptId: c.id }))).filter((p) => p.length);
  const out = [];
  for (let round = 0; out.length < q.count && pools.some((p) => p.length > round); round++)
    for (const p of pools) { if (out.length >= q.count) break; if (p[round]) out.push({ ...p[round], id: uid() }); }
  for (const x of out) if (x.type === "multi") x.choices = shuffle(x.choices);
  return shuffle(out);
}
async function genQuiz(ai = false) {
  S.quiz.ai = ai;
  if (S.meta.bankMode && !ai) {
    const questions = bankQuiz(S.quiz);
    if (!questions.length) { S.error = S.quiz.scope === "weak" ? "취약 문항이 없습니다. 먼저 문제를 풀어보세요." : "출제할 문제가 없습니다."; return render(); }
    S.error = "";
    Object.assign(S.quiz, { questions, i: 0, answer: "", result: null, score: [] });
    return render();
  }
  if (!SAMPLE) { S.error = "이 화면에서는 Claude를 호출할 수 없습니다."; return render(); }
  const q = S.quiz, concepts = pickConcepts(q.scope);
  if (!concepts.length) { S.error = q.scope === "weak" ? "취약 개념이 없습니다. 먼저 학습·테스트를 진행하세요." : "출제할 개념이 없습니다."; return render(); }
  const ids = new Set(concepts.map((c) => c.id));
  const avoid = S.attempts.filter((a) => ids.has(a.question.conceptId)).map((a) => a.question.question);
  S.busy = "quiz"; S.error = ""; render();
  try {
    const raw = await SAMPLE.json(quizPrompt(S.meta.settings, concepts, splitCounts(q.types, S.meta.settings.weights, Math.min(q.count, 15)), avoid), { modelTier: "default", cache: false });
    const questions = cleanQuestions(raw, ids, q.types);
    if (!questions.length) throw { code: "invalid_json" };
    Object.assign(q, { questions, i: 0, answer: "", result: null, score: [] });
  } catch (e) { S.error = sampleErrorText(e); }
  S.busy = ""; render();
}
async function record(item, userAnswer, g) {
  const q = S.quiz;
  q.result = { ...g, userAnswer }; q.score.push(g.verdict);
  const a = { id: uid(), at: Date.now(), question: item, userAnswer, verdict: g.verdict, feedback: g.feedback, missing: g.missing };
  S.attempts.push(a);
  const c = S.concepts.find((x) => x.id === item.conceptId);
  render();
  try {
    await put(`${P.attempts(S.meta.id)}/${a.id}`, a);
    if (c) await saveProgress(c, applyVerdict(prog(c), g.verdict));
  } catch (e) { S.error = dbErrorText(e); render(); }
}
function submitMulti(skip) {
  const q = S.quiz, item = q.questions[q.i], picked = skip ? [] : item.choices.filter((c) => (q.picked || []).includes(c));
  if (!skip && !picked.length) { S.error = "보기를 하나 이상 선택하세요."; return render(); }
  const wrongPick = picked.filter((c) => !item.answers.includes(c)), missed = item.answers.filter((c) => !picked.includes(c));
  const verdict = !wrongPick.length && !missed.length ? "correct" : !wrongPick.length && picked.length ? "partial" : "wrong";
  const feedback = verdict === "correct" ? "" : [missed.length ? `빠뜨린 정답 ${missed.length}개` : "", wrongPick.length ? `잘못 고른 보기 ${wrongPick.length}개` : ""].filter(Boolean).join(" · ");
  S.error = ""; q.picked = [];
  record(item, picked.join(" / ") || "(모름)", { verdict, feedback, missing: missed, picked });
}
async function submit(userAnswer) {
  const item = S.quiz.questions[S.quiz.i];
  if (item.type === "mcq" || item.type === "ox") return record(item, userAnswer, { verdict: userAnswer === item.answer ? "correct" : "wrong", feedback: "", missing: [] });
  if (!userAnswer.trim()) return record(item, "(모름)", { verdict: "wrong", feedback: "답을 쓰지 않았습니다.", missing: item.requiredKeywords });
  if ((item.type === "short" || item.type === "fill") && item.answer.split("/").map(norm).includes(norm(userAnswer)))
    return record(item, userAnswer, { verdict: "correct", feedback: "", missing: [] });
  if (!SAMPLE) { S.error = "이 화면에서는 AI 채점을 할 수 없습니다."; return render(); }
  S.busy = "grade"; S.error = ""; render();
  try {
    const g = await SAMPLE.json(gradePrompt(item, userAnswer), { modelTier: "default" });
    const verdict = ["correct", "partial", "wrong"].includes(g && g.verdict) ? g.verdict : null;
    if (!verdict) throw { code: "invalid_json" };
    S.busy = "";
    await record(item, userAnswer, { verdict, feedback: str(g.feedback), missing: strs(g.missing) });
  } catch (e) { S.busy = ""; S.error = sampleErrorText(e); render(); }
}

  open: (el) => openSet(el.dataset.id, "set"),
  "open-review": (el) => openSet(el.dataset.id, "review"),
  delete: (el) => { S.confirmDelete = el.dataset.id; render(); },
  "delete-no": () => { S.confirmDelete = null; render(); },
  "delete-yes": (el) => deleteSet(el.dataset.id),
  "rm-file": (el) => { S.draft.uploads = S.draft.uploads.filter((u) => u.key !== el.dataset.key); render(); },
  type: (el) => { const d = S.draft, t = el.dataset.t; d.types = d.types.includes(t) ? d.types.filter((x) => x !== t) : [...d.types, t]; render(); },
  goal: (el) => { S.draft.goal = el.dataset.g; render(); },
  diff: (el) => { S.draft.difficulty = el.dataset.k; render(); },
  extra: () => { S.draft.extraOpen = !S.draft.extraOpen; render(); },
  start: () => createSet(),
  "make-bank": (el) => createBankSet(bankOf(el.dataset.preset)),
  "load-preset": () => {
    const d = S.draft;
    for (const m of PRESET.materials) {
      if (d.uploads.some((u) => u.preset === m.lecture)) continue;
      d.uploads.push({ key: uid(), preset: m.lecture, fileName: m.fileName, lecture: m.lecture, state: "done", pages: m.pages, warnings: m.warnings });
    }
    if (!d.name.trim()) d.name = PRESET.course;
    render();
  },
  analyze: () => analyze(),
  tab: (el) => { S.tab = el.dataset.tab; S.error = ""; render(); },
  "only-ess": (el) => { S.onlyEss = el.checked; render(); },
  "to-review": () => { S.view = "review"; S.quiz = null; S.error = ""; render(); window.scrollTo(0, 0); },
  "to-set": () => { S.view = "set"; S.quiz = null; S.error = ""; render(); window.scrollTo(0, 0); },
  rtab: (el) => { S.reviewTab = el.dataset.t; S.quiz = null; S.error = ""; render(); },
  rate: (el) => { const c = S.concepts.find((x) => x.id === el.dataset.id); saveProgress(c, applySelf(prog(c), el.dataset.r)); },
  flip: () => { S.cards.flipped = !S.cards.flipped; render(); },
  "card-rate": (el) => { const c = S.concepts.find((x) => x.id === el.dataset.id); S.cards.i++; S.cards.flipped = false; saveProgress(c, applySelf(prog(c), el.dataset.r)); },
  "card-prev": () => { S.cards.i = Math.max(0, S.cards.i - 1); S.cards.flipped = false; render(); },
  "card-next": () => { S.cards.i++; S.cards.flipped = false; render(); },
  "cards-restart": () => { S.cards = null; render(); },
  "cz-check": (el) => {
    const c = S.concepts.find((x) => x.id === el.dataset.id), blanks = clozeParts(c.cloze).filter((p) => p.blank !== undefined);
    const inputs = blanks.map((_, j) => ($(`#cz-${c.id}-${j}`) || {}).value || "");
    S.clozeState[c.id] = { inputs, checked: true };
    const allOk = blanks.every((b, j) => norm(inputs[j]) === norm(b.blank));
    saveProgress(c, applySelf(prog(c), allOk ? "know" : "unsure"));
  },
  "cz-reset": (el) => { delete S.clozeState[el.dataset.id]; for (const k of Object.keys(S.clozeDraft)) if (k.startsWith(el.dataset.id + "-")) delete S.clozeDraft[k]; render(); },
  "q-scope": (el) => { S.quiz.scope = el.dataset.s; render(); },
  "q-type": (el) => { const q = S.quiz, t = el.dataset.t; q.types = q.types.includes(t) ? (q.types.length > 1 ? q.types.filter((x) => x !== t) : q.types) : [...q.types, t]; render(); },
  "q-count": (el) => { S.quiz.count = +el.dataset.n; render(); },
  "q-gen": () => genQuiz(S.quiz.ai && S.quiz.questions ? true : false),
  "q-gen-ai": () => genQuiz(true),
  "q-setup": () => { S.quiz.questions = null; render(); },
  "q-pick": (el) => { const q = S.quiz, ch = q.questions[q.i].choices[+el.dataset.i]; q.picked = (q.picked || []).includes(ch) ? q.picked.filter((x) => x !== ch) : [...(q.picked || []), ch]; render(); },
  "q-multi": () => submitMulti(false),
  "q-multi-skip": () => submitMulti(true),
  "q-choice": (el) => submit(S.quiz.questions[S.quiz.i].choices[+el.dataset.i]),
  "q-submit": () => submit(S.quiz.answer),
  "q-skip": () => submit(""),
  "q-next": () => { Object.assign(S.quiz, { i: S.quiz.i + 1, result: null, answer: "", picked: [] }); S.error = ""; render(); },
};
document.addEventListener("click", (e) => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACTIONS[el.dataset.act];
  if (fn && el.type !== "checkbox") fn(el);
});
document.addEventListener("change", (e) => {
  const el = e.target;
  if (el.dataset.act === "only-ess") return ACTIONS["only-ess"](el);
  if (el.id === "d-files") {
    for (const file of Array.from(el.files || [])) {
      const u = { key: uid(), fileName: file.name, lecture: file.name.replace(/\.[^.]+$/, ""), state: "parsing" };
      S.draft.uploads.push(u);
      parseFile(file).then((r) => Object.assign(u, { state: "done", pages: r.pages, warnings: r.warnings })).catch((err) => Object.assign(u, { state: "error", error: err.message })).finally(() => { if (S.view === "new") render(); });
    }
    el.value = "";
    render();
  }
});
document.addEventListener("input", (e) => {
  const el = e.target, d = S.draft;
  if (el.dataset.draft && d) d[el.dataset.draft] = el.value;
  else if (el.dataset.lec && d) { const u = d.uploads.find((x) => x.key === el.dataset.lec); if (u) u.lecture = el.value; }
  else if (el.dataset.weight && d) { d.weights[el.dataset.weight] = Math.max(0, Math.min(100, +el.value || 0)); }
  else if ("qans" in el.dataset && S.quiz) { S.quiz.answer = el.value; return; }
  else if (el.dataset.cz) { S.clozeDraft[`${el.dataset.cz}-${el.dataset.j}`] = el.value; return; }
  else return;
  if (S.view === "new") {
    // 입력 중 포커스를 잃지 않도록 버튼·안내만 갱신
    const ck = draftCheck(d);
    $("#start-btn").disabled = !ck.ok;
    $("#start-hint").textContent = ck.hint;
    const w = $("#w-msg"); if (w) w.textContent = ck.weightOk ? "" : `비중 합계 ${ck.sum}%`;
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key !== "Enter" || e.isComposing) return;
  const el = e.target;
  if (el.id === "q-ans" && el.tagName === "INPUT" && S.busy !== "grade") { e.preventDefault(); ACTIONS["q-submit"](); }
  if (el.dataset && el.dataset.cz) { e.preventDefault(); const b = document.querySelector(`[data-act="cz-check"][data-id="${el.dataset.cz}"]`); if (b) b.click(); }
});

// ───────── 시작 ─────────
(async () => {
  render();
  const use = (n) => (window.claude && window.claude.use ? window.claude.use(n).catch(() => null) : Promise.resolve(null));
  DB = localStore(); BASE = "local";
  try { await DB.ready(); } catch (e) { DB = memoryStore(); S.memoryOnly = true; }
  S.ready = true;
  render();
  loadSets();
  use("sample").then((sm) => { SAMPLE = sm; render(); });
})();
</script>
