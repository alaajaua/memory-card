<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
/* Layout: 한 줄 상단바 + 720px 단일 컬럼 노트. 카드는 "색인 카드"처럼 쓰는 곳에만. */
:root {
  --bg: #f4f6f3;
  --surface: #ffffff;
  --ink: #1d2421;
  --muted: #5d6a64;
  --line: #dbe2de;
  --accent: #2b6e64;
  --accent-ink: #ffffff;
  --accent-soft: #e1eeea;
  --mark: #ffe680;
  --mark-ink: #3a3000;
  --good: #2c8553;
  --good-soft: #e3f3e9;
  --warn: #a8701a;
  --warn-soft: #fbf0dc;
  --bad: #be4038;
  --bad-soft: #fbe6e4;
  --font-body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", monospace;
  --r: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131816; --surface: #1b2220; --ink: #e5ebe8; --muted: #9aa7a1; --line: #2d3733;
    --accent: #6cc2b3; --accent-ink: #0f1a17; --accent-soft: #1d3430; --mark: #5c4f12; --mark-ink: #fff3c2;
    --good: #62c48d; --good-soft: #17301f; --warn: #e3a94f; --warn-soft: #33270f; --bad: #ef7d73; --bad-soft: #3a1c19;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131816; --surface: #1b2220; --ink: #e5ebe8; --muted: #9aa7a1; --line: #2d3733;
  --accent: #6cc2b3; --accent-ink: #0f1a17; --accent-soft: #1d3430; --mark: #5c4f12; --mark-ink: #fff3c2;
  --good: #62c48d; --good-soft: #17301f; --warn: #e3a94f; --warn-soft: #33270f; --bad: #ef7d73; --bad-soft: #3a1c19;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { text-wrap: balance; line-height: 1.3; margin: 0; }
h1 { font-size: 1.35rem; }
h2 { font-size: 1.05rem; }
h3 { font-size: 0.98rem; }
p { margin: 0; }
button, input, textarea, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

.bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.bar-in, .wrap { max-width: 760px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.bar-in { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 10px; }
.brand { font-weight: 700; color: var(--accent); background: none; border: 0; padding: 0; cursor: pointer; font-size: 1rem; }
.wrap { padding-block: 20px 48px; display: flex; flex-direction: column; gap: 16px; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.between { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.tiny { font-size: 0.75rem; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }
.label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.04em; color: var(--muted); }

.btn { border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-size: 0.9rem; font-weight: 500; cursor: pointer; background: var(--accent); color: var(--accent-ink); }
.btn:hover:not(:disabled) { filter: brightness(1.06); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn.sec { background: var(--surface); color: var(--ink); border-color: var(--line); }
.btn.ghost { background: transparent; color: var(--muted); }
.btn.wide { width: 100%; padding-block: 11px; }
.chip { border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 12px; font-size: 0.9rem; cursor: pointer; text-align: left; }
.chip[aria-pressed="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--ink); font-weight: 500; }
.badge { display: inline-block; border-radius: 999px; padding: 1px 9px; font-size: 0.74rem; font-weight: 500; background: var(--bg); color: var(--muted); border: 1px solid var(--line); white-space: nowrap; }
.badge.acc { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.badge.good { background: var(--good-soft); color: var(--good); border-color: transparent; }
.badge.warn { background: var(--warn-soft); color: var(--warn); border-color: transparent; }
.badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
mark, .kw { background: var(--mark); color: var(--mark-ink); padding: 0 4px; border-radius: 3px; }

.meter { height: 8px; border-radius: 99px; background: var(--line); overflow: hidden; }
.meter > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; }
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; text-align: center; }
.stats b { display: block; font-size: 1.35rem; font-family: var(--font-mono); }
.notice { border-radius: var(--r); padding: 12px 14px; font-size: 0.86rem; background: var(--warn-soft); color: var(--ink); border: 1px solid transparent; }
.notice.err { background: var(--bad-soft); }
.defn { background: var(--accent-soft); border-radius: 8px; padding: 8px 12px; font-weight: 500; }

.field { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 9px 11px; background: var(--surface); }
textarea.field { resize: vertical; }
.drop { display: block; border: 2px dashed var(--line); border-radius: var(--r); padding: 22px; text-align: center; cursor: pointer; color: var(--muted); }
.drop:hover { border-color: var(--accent); }
.file { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 6px; font-size: 0.88rem; }
.file .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.tabs { display: flex; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 4px; overflow-x: auto; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 49px); z-index: 4; }
.tab { flex: 1; white-space: nowrap; border: 0; background: transparent; border-radius: 7px; padding: 7px 10px; font-size: 0.88rem; color: var(--muted); cursor: pointer; }
.tab[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); font-weight: 500; }

.flash { min-height: 230px; width: 100%; border: 1px solid var(--line); border-radius: var(--r); background: var(--surface); padding: 28px 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px; text-align: center; cursor: pointer;
  background-image: repeating-linear-gradient(to bottom, transparent 0 31px, var(--line) 31px 32px); background-position: 0 58px; }
.flash .q { font-size: 1.12rem; font-weight: 500; background: var(--surface); padding: 0 6px; white-space: pre-line; }
.flash .a { white-space: pre-line; background: var(--surface); padding: 0 6px; }
.flash .tiny, .flash .badge { background: var(--surface); padding-inline: 6px; }
.rate { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.rate button { border-radius: 8px; padding: 9px 6px; font-size: 0.88rem; cursor: pointer; background: var(--surface); border: 1px solid var(--line); }
.rate .r-know { color: var(--good); }
.rate .r-unsure { color: var(--warn); }
.rate .r-dontknow { color: var(--bad); }
.rate button[aria-pressed="true"] { border-width: 2px; font-weight: 700; }
.rate .r-know[aria-pressed="true"] { border-color: var(--good); }
.rate .r-unsure[aria-pressed="true"] { border-color: var(--warn); }
.rate .r-dontknow[aria-pressed="true"] { border-color: var(--bad); }

.cloze { line-height: 2.4; }
.cloze input { width: 8.5em; max-width: 60vw; border: 0; border-bottom: 2px solid var(--accent); background: var(--bg); text-align: center; padding: 2px 6px; margin: 0 4px; border-radius: 4px 4px 0 0; }
.cloze input.ok { border-color: var(--good); color: var(--good); }
.cloze input.no { border-color: var(--bad); color: var(--bad); }
.cloze .fix { font-size: 0.78rem; color: var(--good); margin-right: 4px; }

.choice { width: 100%; text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 10px 12px; cursor: pointer; display: flex; gap: 10px; }
.choice:hover:not(:disabled) { border-color: var(--accent); }
.choice.right { border-color: var(--good); background: var(--good-soft); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.on { border-color: var(--accent); background: var(--accent-soft); }
.choice.missed { border: 2px dashed var(--good); }
.choice .n { color: var(--muted); font-family: var(--font-mono); }
.answerbox { background: var(--bg); border-radius: 8px; padding: 10px 12px; }
.point { background: var(--mark); color: var(--mark-ink); border-radius: 8px; padding: 8px 12px; }
.sets { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 12px; }
.dday { font-family: var(--font-mono); font-size: 0.8rem; color: var(--bad); font-weight: 500; }
details summary { cursor: pointer; }
ol, ul { margin: 0; padding-left: 1.3em; }
.spin { display: inline-block; width: 12px; height: 12px; border: 2px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: sp 0.8s linear infinite; vertical-align: -1px; margin-right: 6px; }
@keyframes sp { to { transform: rotate(360deg); } }
@media (max-width: 480px) { .stats b { font-size: 1.1rem; } .tab { padding: 7px 6px; font-size: 0.82rem; } }
</style>

</div></div>

<script type="application/json" id="course-preset">{"course":"한류와아시아문화교류","materials":[{"lecture":"2강 대중문화와 고급문화","fileName":"2강 대중문화와 고급문화.pdf","pages":[{"label":"p.1","text":"한류와아시아문화교류\n02. 대중문화와 고급문화\n이윤진\nyunjin@ssu.ac.kr\n대중문화의 이해\n힙한 문화와 구별짓기"},{"label":"p.3","text":"대중문화\n대중이란 무엇일까?\n대중 (大衆)\n1. 수많은 사람의 무리\n2. 대량 생산ㆍ대량 소비를 특징으로 하는 현대 사회를 구성하는 대다수의 사람.\n엘리트와 상대되는 개념으로, 수동적ㆍ감정적ㆍ비합리적인 특성을 가진다."},{"label":"p.4","text":"대중문화\n대중이란 무엇일까?\n대중 (大衆)\n1. 수많은 사람의 무리\n2. 대량 생산ㆍ대량 소비를 특징으로 하는 현대 사회를 구성하는 대다수의 사람.\n엘리트와 상대되는 개념으로, 수동적ㆍ감정적ㆍ비합리적인 특성을 가진다."},{"label":"p.5","text":"그냥 문화라고 하면 되지, 왜 “대중문화”라고 할까?\n그냥 문화 ≠ 대중문화\n대중문화"},{"label":"p.6","text":"대중문화\nMass Culture Popular Culture"},{"label":"p.8","text":"일간투데이, 대한민국 매스게임 모음 1974-1994 https://youtu.be/rLCpPrYz7cU?si=j6sOCi4fZmFpfuxe"},{"label":"p.9","text":"오늘날의 매스게임?\n월드오프스트릿우먼파이터, 메가크루미션, https://youtu.be/_xOnGP_Js1A?si=P4Zr00472E7nN5UC"},{"label":"p.10","text":"대중문화\nMass Culture\n어원: 마자 (Maza)"},{"label":"p.11","text":"대중문화\nMass\n• 어원: 그리스어 마자(maza) – 보리를 짓이겨 만든 과자, 덩어리라는 의미\n• 귀족사회에서는 귀족을 제외한 나머지 사람들로 교육을 받지 못한 계층\n• 시민사회에서는 무차별적인 집단, 하층민의 군중을 뜻함\nMASS\nPOPULACE\n대중적(popular) (1) 많은 사람들이 좋아하는 것\n(2) 질적으로 열등한 것\n(3) 대중의 선호에 맞춰 대량소비를 위해 대량생산된 것\nPopular\nPOPULACE\npeople"},{"label":"p.12","text":"대중문화\n대중문화란?\n(1) 많은 사람들이 널리 좋아하는 문화\n• 양적인 범위를 포함하는 개념\n• 대량 생산, 대량 소비, 보편성\n• 책이나 음반의 판매량, 텔레비전 시청률, 콘서트나 축제의\n참가율 등 수치로 분석"},{"label":"p.13","text":"대중문화\n대중문화란?\n(1) 많은 사람들이 널리 좋아하는 문화 BTS의 \u003c피,땀,눈물>, 2016\n• 유튜브 영상 9.6억 뷰\n• 헤르만 헤세 \u003c데미안> 1919\n• 피터 브뤼겔\n\u003c타락한 천사들의 추방>\nQ. 적은 사람이 좋아하는 대중문화는?\nQ. 많은 사람들이 널리 좋아하는 고급문화는?"},{"label":"p.14","text":"BTS \u003c피, 땀, 눈물> https://youtu.be/hmE9f-TEutc?si=lmGQ6alujm8RPmjr"},{"label":"p.15","text":"대중문화\n새는 알에서 나오려고 투쟁한다. 알\n은 세계이다. 태어나려는 자는 하나\n의 세계를 깨뜨려야 한다. 새는 신에\n게로 날아간다. 신의 이름은 아브락\n사스.\n피터 브뤼겔 \u003c타락한 천사들의 추방>"},{"label":"p.16","text":"https://youtu.be/R9At2ICm4LQ?si=jI3pjThBQtvz3sZG"},{"label":"p.17","text":"HAUSER - Air on the G String (J. S. Bach) 바흐 G선상의 아리아"},{"label":"p.18","text":"히에로니무스 보스 《세속적인 쾌락의 동산》"},{"label":"p.19","text":"히에로니무스 보스 《세속적인 쾌락의 동산》과 레드벨벳 “Feel My Rhythm’ MV”"},{"label":"p.20","text":"히에로니무스 보스 《세속적인 쾌락의 동산》과 레드벨벳 “Feel My Rhythm’ MV”"},{"label":"p.21","text":"Ophelia – Sir John Everett Millais"},{"label":"p.22","text":"대중문화\n대중문화란?\n(2) 고급문화 이외의 나머지 문화\n• 고급문화의 수준에 미달하는 나머지 문화들\n• 고급문화와 대중문화의 이분법에서 ‘열등한’ 문화로서의 대중문화\n• 대중문화는 대량생산되는 상업적인 문화인 반면, 고급문화는 개별적인 창조활동의 결과 라는 전제\n대중신문 고급신문\n대중영화 예술영화\n대중음악 클래식\n‘열등한’ 문화로서 대중문화"},{"label":"p.23","text":"고급문화와 대중문화의 이분법?\n어느 쪽이 고급예술일까?"},{"label":"p.24","text":"고급문화와 대중문화의 이분법?\n어느 쪽이 고급예술일까?"},{"label":"p.25","text":"대중신문 고급신문\n대중영화 예술영화\n대중음악 클래식\n‘열등한’ 문화로서 대중문화"},{"label":"p.26","text":"루치아노 파바로티가 부른 푸치니의 “아무도 잠들지 않으리라” (공주는 잠 못이르고)\nLuciano Pavarotti, One of the Most Important Vocal Artists of the Modern Opera Era - Barut B'log\n성악 오페라 고급문화\n대중문화와 고급문화는 분명하게 구분할 수 있을까?\n• 파바로티의 푸치니 앨범이 1990년에 영국 음반 판매순위\n1위 등극\n• “BBC 공식 월드컵 테마곡” 지정\n• 1991년 7월30일 런던 하이드파크 무료공연 10만명 참여"},{"label":"p.27","text":"대중문화\n대중문화란?\n(3) 대중의 선호에 맞춰 대량소비를 위해 대량생산된 문화\n• 대중문화는 대량소비를 위해 대량생산된 상업문화라는 관점\n• 무감각한 상태에서 수동적으로 소비되는 문화\n• 수입된 미국문화 및 ‘미국화’된 문화\n“만약 현대적 형태의 대중문화가 어느 한 곳에서 만들어진 것이라면 그곳은 바로 … 미국의 대도시들, 특히 뉴욕\n이다“ (Maltby, 1989:11)"},{"label":"p.28","text":"리처드 해밀턴, 도대체 무엇이 오늘날의 가정을 이토록 색다르고 매력 있게 만드는가?'(1956년)."},{"label":"p.29","text":"문화산업\n• 사람들의 니즈를 충족시키면 시장에서 승리?\n• '나'의 욕망은 진정으로 '나'로부터 시작된 것이 아니라는 주장\n• ‘내가 좋아서’ ‘내가 합리적으로’ 시장에서 상품을 선택한 것이 아님\n• 대중문화가 욕망을 주입 → 그 주입된 욕망을 충족\n아도르노(Adorno)의 “문화산업(Culture industry)” 개념과 대중문화 비판"},{"label":"p.30","text":"아도르노(Adorno)의 문화산업 Culture industry\n• E.g. Horkheimer & Adorno,\nDialectic of Enlightenment, 1944/1947.\ncf. 제2차세계대전: 1939~1945년\n“우리가 설정한 과제는 인류가 참된 인간애적인 상태로 들어서기보다는\n왜 새로운 종류의 야만상태에 빠져드는가 하는 인식이었다 (DA1) “\n“왜 인류는 해방 대신 파괴로 가는가? “\n“ ”\n계몽 = 진보 = 자유?\n아도르노(Adorno)의 “문화산업(Culture industry)” 개념과 대중문화 비판"},{"label":"p.31","text":"「On Popular Music」\n• 대중음악에 대하여\n• 대중음악의 특징:\n(1)＂규격화“ 되어 있음\n(2) 수동적인 청취를 조장 : ‘진정한 문화의 요구’를 위한 에너지는 고갈\n(3) 사회적 유대의 기능\n여러 유형의 인기가요나 인기배우, 멜로물들이 돌고 돌지만 실제로는 전혀 변화가 없는 것처럼, 오락물들의 내용들도 겉보\n기에는 변하는 것 같지만 사실은 전혀 변화 없는 반복일 뿐이며, 세부사항들만이 대체 가능하다. (중략) 문화산업이 오직 ‘효\n과＇에만 매달리게 됨으로 말미암아, 마음대로 주물러지지 않는 것이라는 ‘효과＇의 고유한 특성이 무시되고 ‘작품＇이라는\n관념을 대체해버린 상투화된 형식에 효과는 종속된다.\n『계몽의 변증법』, 문학과지성사(2001), p.190-191\n“ ”\n문화산업: 동질화, 획일화\n아도르노(Adorno)의 “문화산업(Culture industry)” 개념과 대중문화 비판"},{"label":"p.33","text":"https://youtube.com/shorts/pRlsv8PHvws?si=8OAJzVq7JMtYY_AN"},{"label":"p.34","text":"양산형 웹툰: 남녀관계 + 복수극\n커플 → 결혼,사랑,헌신 → 불륜, 배신 → 재탄생/각성 → 복수"},{"label":"p.35","text":"회귀물/빙의물\n미래의 주인공이 과거로 회귀하여 미래의 능력을 가지고 문제를 해결"},{"label":"p.36","text":"양산형 웹툰: 먼치킨물\n최강의 능력을 가진 주인공이 사건/퀘스트를 해결. 특별한 무기 또는 환생"},{"label":"p.37","text":"양산형 웹툰: 액션물, 학원물\n최강의 능력을 가진 주인공이 사건/퀘스트를 해결. 특별한 무기 또는 환생"},{"label":"p.38","text":"양산형 웹툰: 로판물(로맨스판타지)\n햇살여주 + 북부대공, 삼각관계의 흑발 남주와 은발(금발)남주"},{"label":"p.39","text":"아도르노의 문화산업론\n대중 기만으로서의 계몽\n• 문화산업은 대중을 저항의식으로부터 도피하게 만듦 (문화산업의 위험성)\n• 대중의 욕망을 조종함으로써 착취적이고 보수적인 자본주의 체제가 잘 굴러가고 유지되도록 함\n• 대중은 수동적, 무비판적 존재로 전락\n문화산업의 위치가 확고해지면 확고해질 수록 문화산업은 소비자의 욕구를 더욱 능란하게 다룰 수 있게 된다. 문화산업은\n소비자의 욕구를 만들어내고 조종하고 교육시키며, 심지어는 재미를 몰수할 수도 있다. (중략) 즐김의 근저에 있는 것은 무\n력감이다. 즐김은 사실 도피다. 그러나 그 도피는 일반적으로 얘기되듯 잘못된 현실에서의 도피가 아니라 마지막 남아있는\n저항의시긍로부터 도피하는 것이다. 오락이 약속하는 해방이란 ‘부정성’을 의미하는 사유로부터의 해방이다.\n『계몽의 변증법』, 문학과지성사(2001), p.218-219\n“ ”"},{"label":"p.40","text":"3S 정책참고\n1980년대 전두환 정부가 군사 독재로 인한 반발을 억제하기 위해 시행한 정책들을 일컫는 용어"},{"label":"p.41","text":"오늘날의 대중문화란?\n대중문화는 대중이 미디어와 플랫폼을 통해\n생산·공유·소비하며 참여와 재생산을 통해 끊임없이 변화하는 문화\n대중문화란 다수의 사람들이 미디어와 문화산업을 통해 접하고,\n일상 속에서 소비·해석·공유·재생산하는 문화적 의미와 실천의 총체"},{"label":"p.42","text":"대중문화는\n어떻게 생겨나게 됐을까?"},{"label":"p.43","text":"농경사회의 집과 일터\n대중문화의 등장배경: 산업화와 도시화"},{"label":"p.44","text":"이한철, 세시풍속도 (부분)"},{"label":"p.45","text":"전통적인 중세 도시\n주거와 영업장이 공존\n예)\n2층: 거주장소 (집)\n1층: 영업장\n다락: 도제 숙식\n지하: 저장고"},{"label":"p.46","text":"대중문화의 등장배경: 산업화와 도시화\n산업혁명\n18세기에 영국에서 일어난 1차 혁명\n기술의 변화(증기기관, 공장) → 분업화와 대량생산이 가능"},{"label":"p.48","text":"산업혁명의 영향\n• 기술문화적인 발전에 결정적인 기여\n• 노동자 계급의 여가시간 확보 및 임금 상승의 결과\n1) 계급 구조의 변화\n돈, 자본을 기반으로 하는 새로운 계급 구조\n시민계급의 탄생\n대중사회 성립의 기틀을 마련\n정치∙문화∙사회적인 변동\n2) 노동계급의 여가와 문화\n일 – 주거가 분리\n대중문화의 등장배경: 산업화와 도시화"},{"label":"p.49","text":"Illustration of a cotton mill in Summerseat, Bury (1850) Manchester Local Image Collection\n산업화와 도시화"},{"label":"p.51","text":"대중문화의 확립\n• 대중문화는 1850년대 유럽과 미국에서 중산층이 사회의 지배적 위치를 확립하면서 자리잡음\n• 산업화와 더불어 노동과 여가 사이에 구분이 생겨남\n• 늘어난 여가시간과 임금의 상승으로 오락 및 여가의 일환으로 대중문화가 확산\n• 제2차 세계대전 이후 미국을 중심으로 급격히 확산 및 전파\n대중문화의 등장배경: 산업화와 도시화"},{"label":"p.52","text":"20세기 미국의 대중사회\n• 1차세계대전 이후 미국 경제가 번영기를 맞이하면서 대중문화의 전형이 탄생\n• 1920년대 석유, 자동차, 농업기계, 전자제품, 정밀기계 부문을 중심으로 국제시장에서 지배적\n우위를 확보함\n• 영화, 라디오, 항공 등 새로운 사업에 투자\n대중문화의 등장배경: 산업화와 도시화"},{"label":"p.53","text":"힙(Hip)하다?\n우리가 '힙하다'고 느끼는 감각은 본능적인 끌림일까,\n아니면 특정한 사회적 배경과 교육을 통해 체득된 '학습된 결과물’일까?\n생각거리"},{"label":"p.55","text":"You are what you eat"},{"label":"p.56","text":"아는형님, https://youtu.be/7_SmiNPSgOI?si=mUKHDdlQWuB-1_71"},{"label":"p.58","text":"부르디외와 구별짓기\n피에르 부르디외 (Pierre Bourdieu, 1930~2002)\n피에르 부르디외\n• 프랑스 사회학자 및 철학자\n• 고등학교 교사로 근무하다가 1964년부터 고등연구대학원 교수 재직,\n1981년부터 College de France 교수로 근무"},{"label":"p.59","text":"세가지 유형의 자본\n1) 경제자본 | 생산요소(토지, 공장, 노동력)와 재화(자산, 수입, 소유물). 경제적 능력\n2) 문화자본 | 스스로를 보다 유능한 사람으로 도야하기 위해 습득한 것 (취향, 학력, 교육)\n3) 사회자본 | 한 개인이나 집단이 동원하고 활용할 수 있는 사회적인 관계망 (인맥, 학맥, 지연, 혈연)\n『자본의 형태(The Forms of Capital)』(1986)\n“상호적인 친분, 안면 등 어느 정도 제도화 된 관계들의 지속성 있는 연계망 속에 내재되어 있는 실제\n로 사용되고 있거나 사용 가능 성이 있는 자원들의 총체”(Bourdieu, 1986)\n부르디외와 구별짓기"},{"label":"p.60","text":"상징자본\n세가지 형태의 자본이 승인된 형식 (명성, 명예, 인정)\n특정한 자본이 사람들의 인식 속에서 상징적으로 표상되고 이해된 경우\n“모든 자본은 그 구현형태에 관계없이 자본으로서의 진실이 오인되면서 즉 그것이 인정되면서 상징\n폭력을 행사하며, 인정을 요구하는 권위로서 부과된다. 상징자본은 막스베버가 카리스마라고 부른\n것을 가리키는 또 다른 방식일 뿐이다“\n부르디외와 구별짓기"},{"label":"p.61","text":"더글로리 속 네 가지 자본\n#scene 1."},{"label":"p.62","text":"더글로리 속 네 가지 자본\n#scene 2."},{"label":"p.63","text":"더글로리 속 네 가지 자본\n#scene 3."},{"label":"p.64","text":"더글로리 속 네 가지 자본\n#scene 4.\nhttps://youtube.com/shorts/wZ_c0D_YlSw?si=W-vBLv6O6ATyfaU8"},{"label":"p.65","text":"더글로리 속 네 가지 자본\n#scene 5."},{"label":"p.66","text":"더글로리 속 네 가지 자본\n사회자본 (인맥) - #기캐박연진과, 골프장 회원권경제자본 (물질) – ‘겁나 비싼’ 집, 광고비, 디올\n문화자본 (취향) 예술작품을 보는 눈 상징자본 (명성) – 월 220 받지만 기상캐스터"},{"label":"p.67","text":"자본 간의 전환\n상이한 자본유형들이 서로 전환될 수 있음\nex. 인맥을 통해 학위의 경제적 수익 극대화\nex. 고액과외 등 학업 투자가 실패해서 좋은 학교를 나오지\n못했을 경우, 인맥을 통해 이차적 출구 마련\n경제자본\n사회자본 문화자본\nex. 교양 활동 을 통해 사교 관계의 확장\nex. 사회적 네트워크를 통해 교양의 확장 또는 경제적 이익\n확대\n부르디외와 구별짓기"},{"label":"p.68","text":"아비투스 Habitus\n특정한 환경에 의해 형성된 성향, 사고, 인지, 판단과 행동체계\n사회적 위치, 교육환경, 계급위상에 따라 후천적으로 체득된 취향\n개인에게 내면화된 계급적 성향\nhttps://tvtropes.org/pmwiki/pmwiki.php/Main/RichLanguagePoorLanguageLanguage\n고급문화와 하위문화를 구분하는 기준이 타당하지 않음\n문화적 자의성의 산물\n따라서 고급문화라고 해서 우위, 하위문화라고 해서 열등한 것은 아님\n부르디외와 구별짓기"},{"label":"p.70","text":"Parasite (기생충) The Same Smell Scene, https://www.youtube.com/watch?v=TSkM4NvsTR0"},{"label":"p.71","text":"https://www.youtube.com/watch?v=x5vXmr5W7_c (2:30)"},{"label":"p.74","text":"구별짓기 distinction\n문화에 대한 취향과 지식이 어떻게 계급 재생산에 기여하는가\n• 문화적 취향이 사회적 지위와 대응된다는 개념\n• 개인이 속한 계급적 위치에 따라 각기 다른 문화자본을 보유함\n• 개인의 취향이 자연적으로 발생하는 것이 아니라 사회구조적 획득\n부르디외와 구별짓기\n• 계급을 유지시키기 위해 고급문화/대중문화의 구분이 사용됨\n• 즉, “나의 문화적 취향이 곧 내가 속한 계급을 말해준다”"},{"label":"p.75","text":"피에르 부르디외 (Pierre Bourdieu, 1930~2002)\n피에르 부르디외의 네가지 자본\n1) 경제자본 (물질)\n2) 사회자본 (인맥)\n3) 상징자본 (명성)\n4) 문화자본(취향, 학력, 교육)\n구별짓기 Distinction\n• 계급을 유지시키기 위해 고급문화/대중문화의 구분이 사용된다고 주장\n• 문화의 소비는 “의식적, 의도적이건 아니건 간에 계급의 차이를 정당화\n하기 위한 사회적 작용을 충족시키기 위해 미리 배열되어 있는 것“\n• 즉, “나의 문화적 취향이 곧 내가 속한 계급을 말해준다”\n부르디외와 구별짓기"},{"label":"p.76","text":"부르디외와 구별짓기\nGelatin-silver print, Gift of the Farm Security Administration. © MoMA\n어떤 그림이 더 아름다운가요?"},{"label":"p.77","text":"어떤 노래를 가장 좋아하시나요?\n바흐의 피아노 평균율 거쉰의 랩소디 인블루 슈트라우스의 푸른도나우강\n16개 직군을 대상으로 설문조사"},{"label":"p.78","text":"노동자, 가사도우미\n점원\n초등교사\n기업가\n전문직\n중등교사\n대학교수., 예술가\n기술자\n중간관리직"},{"label":"p.79","text":"어떤 노래를 가장 좋아하시나요?\n바흐의 피아노 평균율 거쉰의 랩소디 인블루 슈트라우스의 푸른도나우강\nLegitimate taste\n정통적취향\nMiddle-brow taste\n중간층취향\nPopular-taste\n대중적취향"},{"label":"p.80","text":"대중문화의 정의\n정리\n많은 사람들이 널리 좋아하는 문화\n고급문화 이외의 나머지 문화\n대중의 선호에 맞춰 대량소비를 위해 대량생산된 문화\n민중(the people)으로부터 생겨나는 문화, 대중이 만들어낸 문화\n대중이 미디어와 플랫폼을 통해 생산·공유·소비하며 참여와 재생산을 통해 변화하는 문화\n대중문화의 배경 산업화, 도시화\n대중문화의 특징 의존효과, 디드로효과\n부르디외의 구별짓기\n아도르노의 문화산업론 (문화산업의 동질화와 획일화 비판)"},{"label":"p.81","text":"옴니보어-유니보어 가설 Omnivore-univore\n• Peterson(1992), Peterson & Kern (1996)\n• 모든 것을 무분별하게 좋아하는 것이 아니라, 모든 것을 감상할 수 있는 개방성\n• 상류층이 고급예술 뿐 아니라 저급예술까지도 포괄적으로 수용하는 현상 (Peterson, 1992)\n• 고상한 배척자(highbrow snob) → 포괄적 감상자(omnivore)로 변화\n• 가치의 변화, 예술세계의 변화, 세대 정치, 지위집단 정치 등의 요인에 기인\n계급과 문화적 취향"},{"label":"p.82","text":"옴니보어-유니보어 가설동형성 가설\n상층 고급\n하층 저급\n사회경제적지위 문화적취향\n상층\n하층\n사회경제적지위 문화적취향\n계급과 문화적 취향\nelite vs. mass elite vs. mass"},{"label":"p.83","text":"계급과 문화적 취향\n부자들이 먹는 음식 – 서민들이 먹는 음식 ?"},{"label":"p.86","text":"오늘날의 K-POP 산업을\n문화소비이론으로 어떻게 바라볼 수 있을까?\n생각거리"},{"label":"p.87","text":"K-POP 대중문화의 상류화?"},{"label":"p.88","text":"K-POP 대중문화의 상류화?\nhttps://youtu.be/qZ1iezXeOTw?si=3cPE19K7HjOLU2_7"},{"label":"p.89","text":"K-POP 대중문화의 상류화?\n올데이프로젝트"},{"label":"p.90","text":"K-POP 대중문화의 상류화?\n명품 브랜드와 아이돌"}],"warnings":["텍스트가 거의 없는 페이지(이미지 위주일 가능성): p.2, p.7, p.32, p.47, p.50, p.54, p.57, p.69, p.72, p.73, p.84, p.85, p.91. 이 부분의 그림·도표 내용은 학습에 반영되지 않습니다."]},{"lecture":"3강 초국가성과 한국성","fileName":"3강 초국가성과 한국성.pdf","pages":[{"label":"p.1","text":"한류와아시아문화교류\n이윤진\nyunjin@ssu.ac.kr\n한류의 개념과 이해\n글로벌시대 K-Culture의 “K”는 무엇일까\n03. 초국가성과 한국성"},{"label":"p.2","text":"강의목표\n아시아성, 문화적 근접성, 문화할인, 혼종성의 의미를 설명할 수 있다.\n네 개념이 한류의 확산을 어떻게 다르게 설명하는지 비교할 수 있다.\n한국성을 고정된 전통이 아니라 선택·재구성·해석되는 정체성으로 이해할 수 있다."},{"label":"p.3","text":"• 한국 대중문화가 해외로 퍼져 나가고 확산되는 현상\n• 즉, 한국의 드라마, 음악, 영화, 음식 등이 국경을 넘어 글로벌하게 인기를 얻고 영향을\n미치는 문화적 흐름\n• 문화 콘텐츠 자체가 아니라 문화가 확산되고 소비되는 과정과 현상에 초점을 둔 용어\n한류\n한류 ; the Korean Wave ; 限流 ; Hallyu\n한류의 개념과 이해"},{"label":"p.5","text":"단기적, 일시적 현상\n초기 현재\n지역적, 장르적 다양화\n전세계적 파급력\n한류의 개념과 이해"},{"label":"p.6","text":"한류의 어원\n• 합성신조어\n• 限(한국) + 流 (특성, 독특한 경향)\n• 1990년대 후반 한국 TV드라마의 인기를\n중국언론 ‘인민일보’人民日報가 “한풍韓風이\n지나간 후＂라고 언급\n• “다른 문화가 매섭게 파고든다“ (寒流)와\n동음이의어로 한류라고 표현 (황낙건, 2013)\n流\n~식, ~스타일, ~파 등을 뜻하는 일본식 용어\n예) 1980년대 홍콩 영화의 유행 ‘홍콩류’ (항류, 港流)\n1990년대 일본 자국 문화 (일류, 日流)\n그 외에 대류(臺流), 화류(華流) 등\n한류의 개념과 이해"},{"label":"p.7","text":"1980년대 홍콩의 문화 콘텐츠\n참고"},{"label":"p.8","text":"1980~90년대 홍콩의 문화 콘텐츠\n참고"},{"label":"p.9","text":"아비정전 엔딩 https://youtu.be/oUZD3b9Sh4k?si=8iEwaw2EJnnAokRa\n참고"},{"label":"p.10","text":"한류 명칭의 시작 : 1990년대 후반\n• 1997년경부터 중화권을 중심으로 한국 TV 드라마와 대중가요가 인\n기를 얻기 시작\n• 1990년대 후반 중화권에서 한국 가수들의 인기 현상을 한류로 지칭\n- 하일한류 (夏日韓流, 여름에 한국 바람이 불어옴)\n- 일진한류 (一陣韓流, 한국 문화의 기세)\n• 1999년 가을, 한국 문화관광부에서 한국 가요를 홍보하기 위한 \u003c限\n流 – song from Korea> 음반 제작 및 배포\n한류의 개념과 이해"},{"label":"p.12","text":"클론, 쿵따리샤바라 (Remastered) https://youtu.be/6SrNsoDomho?si=42vlgMUqIWHLC1Tc\n참고"},{"label":"p.13","text":"베이비복스, \u003cGet up> 1997 데뷔., 한류 Song From Korea (1999) 2집에 수록\n참고"},{"label":"p.14","text":"한류의 정의\n• 1990년대 후반 이후 중국과 일본을 비롯한 동아시아에서 한국의 대중문화가 선풍적인 인기를 끌고 있는 현상을\n가리키는 신조어\n• 한국의 대중문화를 포함한 한국과 관련된 것들이 한국 이외의 나라에서 인기를 얻는 현상(최창현,임선희, 2018: 15)\n• ‘한국문화에 대한 열풍’, ‘한국 대중문화 바람’, ‘한국대중문화 붐’ (고정민, 2016)\n• ‘한국의 문화와 상품 그리고 한국 자체를 동경하고 선호하는 현상’, ‘해외에서 나오는 한국을 좋아하는 현상’ (삼성경\n제연구소)\n• ‘한국의 드라마, 예능, 영화, 음악(K-pop), 애니메이션, 출판물(도서/전자책/만화/웹툰 포함), 온라인/모\n바일 게임, 패션, 뷰티, 한식 등 한국 대중문화콘텐츠가 해외 소비자들에 의해 널리 소비되고 동시에 한\n국의 것으로 인식되는 현상’ (한국국제문화교류진흥원, 『 2020 한류파급효과 연구』, 2021)\n한류의 개념과 이해"},{"label":"p.15","text":"한류를 설명하기 위한 초기의 키워드들\n문화적\n근접성\n아시안성 문화\n할인율\n한류를 이해하는 키워드\n한류는 왜 아시아에서 먼저 인기를 얻었을까?"},{"label":"p.16","text":"아시안성?\n초기 한류의 출발이자, 현재까지 가장 큰 비중을 차지하는 시장\nASIA\n한류를 설명하기 위한 초기의 키워드들: 아시안성\n한류를 이해하는 키워드\n한류는 왜 아시아에서 먼저 인기를 얻었을까?"},{"label":"p.17","text":"아시안성 Asian-ness\n한류를 설명하기 위한 초기의 키워드들: 아시안성\n한류를 이해하는 키워드\n한류는 왜 아시아에서 먼저 인기를 얻었을까?\n• 아시아 문화들이 공유한다고 인식되는 가치·정서·사회적 경험"},{"label":"p.18","text":"예시\n겨울연가(2002), https://youtu.be/cFy1AxftsIE?si=HJ_3eJqhPf0eeHlF (08:00~)"},{"label":"p.19","text":"예시\n스카이캐슬 2회(2018), https://youtu.be/7pDLXWLHfXA?si=84fd-FpcelDNNT1S"},{"label":"p.20","text":"문화적 근접성 Cultural proximity\n• 사람들이 타 문화를 받아들일 때 자국 문화와 유사한 문화를 더 선호하는 성향\n• 문화적으로 근접하다고 느끼는 국가 사이에서는 미국의 문화생산물 보다 자신들의 문화적 경험에\n비추어 훨씬 더 친숙하고 유사한 문화물을 선호 (Straubhaar, 1991)\n• 문화적 근접성에 영향을 미치는 요인:\n- 지리적 요인 : 지정학적으로 가까이 있는 나라\n- 언어적 요인 : 같은 언어를 사용하는 나라 (ex. 한자문화권)\n- 가치적 요인: 같은 문화적, 정신적 가치를 공유하는 나라\n한류를 이해하는 키워드"},{"label":"p.21","text":"예시\n사랑이뭐길래 1화, https://youtu.be/pYnrZ9r-SQ4?si=_4LqWm763XbcNP5O (18:58)"},{"label":"p.22","text":"드라마 \u003c사랑이뭐길래> (1991~1992)\n(극본 김수현)\n가부장적인 가족과 민주적 가족의 대비\n“남자는 하늘, 여자는 땅“\n한류를 이해하는 키워드"},{"label":"p.23","text":"문화할인율 Cultural Discount\n• 문화상품이 국경을 넘어 다른 문화권으로 전파되면 가치, 신념, 생활방식 등의 차이로 이질감이 생\n기며 자국에 비해 소비자의 호응도가 떨어지는 현상\n• 문화권 간 거리가 가까울 수록, 자신의 문화적 경험을 크게 할인하지 않아도 다른 문화권의 내용을\n이해할 수 있다는 내용 ( = 문화할인율이 낮다.)\n• 한류는 동아시아에서 문화할인율이 낮아 소통이 원활하고 성공 가능성이 높다는 인식\n한류를 설명하는 키워드"},{"label":"p.24","text":"중국드라마 \u003c위황후> \u003c튜더스>https://youtu.be/S1vbg2fctoo?si=4p-0vpoh4mmjmjPV"},{"label":"p.26","text":"드라마 \u003c브리저튼> 시즌3 예고편 https://youtu.be/0T2c_ineM_0?si=i8Buau0ueZmgJjno\n사교계? 데뷔탕스?"},{"label":"p.27","text":"문화적 근접성 개념의 의의와 한계\n• 동아시아권 내의 한류 현상을 이해하는데에 도움\n• 문화적 근접성 개념 자체가 모호\n• 다양한 배경을 지닌 한류라는 현상의 복잡성을 간과\n• 한류의 문화형식 중 전통문화적 영향은 일부에 불과\n• 한류2.0, 한류3.0의 지리적 확장성을 설명할 수 없음\n한류를 설명하는 키워드"},{"label":"p.28","text":"한류를 설명하는 키워드\n(4) Squid Game stars take on the Dalgona Challenge [ENG SUB] - YouTube"},{"label":"p.29","text":"넷플릭스시리즈 \u003c오징어게임> https://youtu.be/yJ0Pfldt8jw?si=Ku16hrQjwrJg8a1e"},{"label":"p.30","text":"넷플릭스시리즈 \u003c오징어게임> https://www.youtube.com/watch?v=TYd_pT9hZrM"},{"label":"p.31","text":"글로벌라이제이션\n글로벌라이제이션 Globalization ; 전지구화\n• Theodore Levitt, ‘The Globalization of Markets’, HBR\n1983 May.\n“각국 소비자의 기호에 맞게 상품을 생산·공급하는 다국적 기\n업시대는 가고, 규모의 경제를 실현한 글로벌 기업이 활약하는\n세상이 올 것”\n• 지구 전체가 국경을 초월하는 하나의 지구촌이 된 세계\n• 각 국의 경제가 세계경제로 통합되는 것을 의미\n• 국가 간에 존재하던 상품이나 서비스, 자본, 노동, 정보\n등에 대한 장벽이 제거되고 세계가 거대한 단일시장으로\n통합되는 것"},{"label":"p.32","text":"글로벌라이제이션 Globalization\n• 전지구화, 세계화\n• 정보과학기술혁명을 통해 전 지구촌이 하나의 단위로 통합되고, 자본과 상품의 유통이 국가경계를\n초월하여 신속하게 이루어지는 현상 (박익규, 2003)\n• 한류 초기 글로벌라이제이션 개념으로 설명하고자 했으나, 초기에는 아시아권에 제한되었기 때문에\n동→서 로의 흐름이 아니라 동→동 으로의 흐름을 보임\n• 세계화는 주로 기업과 사회조직이 정보화의 요건에 맞추어 바뀌는 결과를 야기\n글로컬라이제이션과 혼종성으로 대체\n한류를 설명하는 키워드"},{"label":"p.33","text":"글로벌라이제이션\n글로벌라이제이션 ≠ 국제화\n한 나라가 경제·환경·정치·문화적으로\n다른 여러 나라와 교류하는 것\n두 나라 이상이면 성립\n• 세계가 단일의 공동체로\n확산\n• 각 민족이나 국가의 특징,\n차별성보다 상호의존성\n을 강조"},{"label":"p.34","text":"완벽한 글로벌라이제이션?\n우리나라의 army와 다른 지역의 army는 같은 생각, 같은 가치를 공유할까?"},{"label":"p.35","text":"동양 vs. 서양 - 생각은 어떻게 작동하는가\nRichard E. Nisbett,\n생각의 지도"},{"label":"p.36","text":"동양 vs. 서양 - 생각은 어떻게 작동하는가\nRichard E. Nisbett,\n생각의 지도\n동양인 서양인\n맥락을 파악\n관계와 유사성\n대상에 집중\n규칙과 범주"},{"label":"p.37","text":"글로컬라이제이션\nglocalization\nglobalization localization"},{"label":"p.38","text":"글로컬라이제이션\n글로컬라이제이션 Glocalization\n• 1980년대 비즈니스 분야 글로벌 상품의 현지화를 위한\n마케팅론에서 발전\n• 1990년대 초 상품의 현지화를 설명하기 위한 사회문화적\n용어로 사용\n• 지역적인 것의 세계적 생산과 세계적인 것의 지역화를\n표현\n• 세계적이면서 지역적인 것은 서로를 구성하며, 지역적으\n로 여겨져서 세계적인 것과 균형을 이루는 것 대부분은\n초지역적인 과정의 결과라는 입장\n글로컬화\n지역화\n세계화\n보편성 특수성"},{"label":"p.39","text":"글로컬라이제이션\n맥도날드의 글로컬 전략 – 메뉴의 현지화\n터키 맥타코케밥 한국 불고기버거 인도 치킨마하라자맥 캐나다 맥랍스터"},{"label":"p.40","text":"글로컬라이제이션\n글로컬 문화의 형성 및 초국가적 소비의 과정\n세계화 외래문화의\n영향\n외래문화 +\n수용지역문화\n새로운\n글로컬문화의 출현 초국가적\n소비 글로컬문화\n개방 수용\n혼합\n전파수용\n문화적\n소통"},{"label":"p.42","text":"문화적 혼종성\n문화적 혼종성 cultural hybridity\n• 문화의 세계화 과정에서 글로벌한 요소와 로컬적인 것이 혼합되면서 내부와 외부의 속성들이\n혼재하는 것\n• 시간적: 전통과 근대의 융합\n공간적: 서구와 비서구의 융합\n• 초국가적인 문화 흐름에 따른 혼합의 과정을 통해 새로운 문화적 다양성과 정체성이 생성\n• 제3세계의 문화 수용의 저항성의 결과물이기도 함"},{"label":"p.44","text":"혼종성의 사례:\n\u003c대취타>\n왕의 행차 음악"},{"label":"p.47","text":"호미바바 Homi K. Bhabha (1949~)\n혼종성 hybridity\n• 후기식민주의 학파에 의해 발달한 개념\n• 순수한 전통 ( X ) 독자적인 자국 문화 ( X )\n• 문화는 다른 문화와 끊임없이 영향을 주고 받으면서 진화한다는 입장\n• 지역성은 이미 주어진 것이 아니라, 지속적으로 형성되는 것이라는 입장\n• 즉 혼종성은 대립적이었던 영역 간의 경계가 모호해지고 새로운 것을 창의적으로 생산해내는 과정임.\n• 모든 문화는 사실상 역사적 상호작용을 통해 ‘섞인‘ 혼종적 문화\n• 한네르츠(Ulf Hannerz) “인류의 역사 자체가 혼종화의 과정“"},{"label":"p.49","text":"페루\n칠레\n피스코 Pisco\n페루 vs. 칠레\n포도주를 증류해서 만든 술\n세비체 Ceviche\n날생선을 얇게 떠 레몬즙 등에 재워 먹는 해산물요리"},{"label":"p.50","text":"페루\n칠레\nYuSheng 유생; 이상; yee sang ; 魚生 ; Prosperity Toss\n싱가포르 vs. 말레이시아"},{"label":"p.51","text":"페루\n칠레\n인류 공통의 문화유산을 기리자는 의도로 출발한 UNESCO 세계문화유산 등재가 오히려 민족주의적 경쟁의 원인참고"},{"label":"p.52","text":"Lunar New Year\nChinese New Year / Korean Lunar New Year /\n상호존중 없이 한류는 없다"},{"label":"p.53","text":"문화적 혼종성\n- 즉, 단순히 두 개 이상의 문화가 만나서 섞이는 거나 하나로 합쳐져서 사라지는 것이 아님\n혼종성\n• 각자의 차이를 바탕으로 문화적∙경제적 생활이 서로 부딪히고 협상하며 문\n화가 혼성화되고 합쳐지면서 끊임없이 계속되는 과정\n중요한 것은 원조가 어디인가의 문제가 아니라,\n이러한 형식에 우리의 경험, 감정, 정서를 잘 담아내 삶을 풍요롭게 하는 것"},{"label":"p.54","text":"초국가성\n초국가성 transnational\n• 사람, 상품, 개념들이 국경에 구애 받지 않고 넘나들며 그 기원이 하나로 추적되지 않는 것 (Watson, 2006)\nK-POP의 초국가성\n- 해외 작곡가를 동반한 글로벌하고 트렌디한 음악적 스타일\n- 전략적인 글로벌 유통 및 마케팅\n- 놀이문화와 팬 문화 활동을 기반으로 한 초국가적 팬덤"},{"label":"p.55","text":"초국가성의 시대에 한국적 콘텐츠란 무엇인가?"},{"label":"p.56","text":"한국적 콘텐츠와 한국성\n(1) 시각적 미학과 전통의 재해석\nBTS \u003cIdol> MV\nhttps://youtu.be/pBuZEGYXA6E"},{"label":"p.57","text":"• 전통 역사적으로 전승된 사상, 관습, 행동 따위의 양식\n예시 : \u003cidol>\n호랑이 전통적으로 한국의 문화예술에서 용\n맹하고 신성한 동물\n북청사자놀음 함경남도 북청군에서 정월대보\n름 행해지던 탈놀이로, 악귀를 쫓고 마을의 평\n안을 기원\n봉산탈춤, 한국의 흥 조선시대 대표 가면극으\n로, 흥겨운 가락과 역동적 춤사위, 풍자가 특\n징\n• 한국적인 소품, 이야기, 소리, 춤사위를 스토리텔링\n• 단순히 \"옛 것\"을 보여주는 게 아니라, 글로벌 관객이 공감할 수 있게끔 새롭게 포장한 한국성의 힘\n한국적 콘텐츠와 한국성\n(1) 전통과 한국성: 시각적 미학과 전통의 재해석"},{"label":"p.58","text":"예시 : \u003c킹덤>\n한국적 콘텐츠와 한국성\n(1) 전통과 한국성: 시각적 미학과 전통의 재해석"},{"label":"p.59","text":"한국관광공사 2002년 홍보영상 colorful Korea\n한국적 콘텐츠와 한국성\n예시 : 한국 홍보영상"},{"label":"p.60","text":"한국관광공사 2008년 홍보영상 Sparkling Korea\n예시 : 한국 홍보영상"},{"label":"p.61","text":"한국관광공사 Feel the Rhythm of Korea\n예시 : 한국 홍보영상"},{"label":"p.62","text":"안은미컴퍼니 \u003c거시기모놀로그>, \u003c북한춤>\n(1) 전통과 한국성: 시각적 미학과 전통의 재해석\n한국적 콘텐츠와 한국성"},{"label":"p.64","text":"\u003c기생충> 2019 \u003c오징어게임> 2021\n(2) 발전과정과 한국성: 집단주의와 개인의 갈등\n한국적 콘텐츠와 한국성\n• 단기간의 급격한 경제발전, IMF 등의 경제위기, 정부의 정책 등에서 드러나는 자본주의와 물질주의의 폐해\n• 유교적 전통과 근대화의 충돌 속에서 “우리”와 “나＂의 긴장"},{"label":"p.65","text":"오징어게임, https://youtu.be/QzERY7N3ewM?si=dYEqdsjTuQbQ37Yj"},{"label":"p.66","text":"\u003c겨울연가> 2002 \u003c사내맞선> 2022\n(3) 로맨스와 한국성: 한국 로맨스 콘텐츠의 정형화된 캐릭터\n한국적 콘텐츠와 한국성\n• 다 갖췄으나 인격적 결함이 있\n는 남자주인공\n• 밝고 명랑하며 꿋꿋한 여자주\n인공"},{"label":"p.67","text":"참고 : 들장미 소녀 캔디 (캔디캔디)\n• 1차 세계대전 전후의 영국과 미국을 배경으로 한 일본의 순정만\n화\n• 딱히 특출난 거은 없는데 밝고 명랑하며 긍정적인 성격의 매력\n으로, 주변의 많은 사람들과 친해지며, 자신이 처한 환경과 상황\n마저 역전시키는 캐릭터"},{"label":"p.68","text":"시크릿가든(2010) 킬미힐미(2015) 주군의태양(2013) 뷰티인사이드(2018)\n(3) 로맨스와 한국성: 한국 로맨스 콘텐츠의 정형화된 캐릭터\n한국적 콘텐츠와 한국성"},{"label":"p.69","text":"\u003c사랑의 불시착> 2019\u003c눈물의 여왕> 2024\n(3) 로맨스와 한국성: 한국 로맨스 콘텐츠의 정형화된 캐릭터\n한국적 콘텐츠와 한국성\n변주 – 남녀의 역할 전환"},{"label":"p.70","text":"(4) 정서와 한국성: 한(恨)과 정(情)\n한국적 콘텐츠와 한국성\n한恨 • 순간적인 감정이 아닌, 분노, 억울함, 서러움, 아쉬움, 안타까움 등이 한데 뒤섞여 묵은 감정\n• 한국의 유교적 억압, 식민지 경험, 전쟁의 상흔 같은 역사적 배경에서 자라난 감정\n• 단순한 \"슬픔\"이나, \"분노”라기 보다는, \"어쩔 수 없다\"는 체념과 \"그래도 살아가야 한다\"는\n생명력도 포함\n• 응어리 (≠원망, 원한, 복수심 )\n• i.g. “여자가 한을 품으면 오뉴월에도 서리가 내린다”\n영화\u003c파묘> 중 굿 장면"},{"label":"p.71","text":"• 개인적인 감정에 초점\n• 개인의 상실에 기반 (사랑하는 사람의 죽음, 실패 등 )\n• [비교] “한”은 개인을 넘어선 집단적∙공동체적 맥락\n참고 : 다른 문화권의 유사한 정서\n일본 \"모노노아와레” 物の哀れ\n• 사물이나 순간의 덧없음에 대한 애잔한 감정\n• 자연의 무상함이나 미(美)에 초점을 맞춘 미학적 정서\n중국 \"원” 怨\n• 억울함과 분노\n• 개인간의 원한 및 복수심, 운명에 대한 저주\n서구의 슬픔 Sadness/Melancholy"},{"label":"p.72","text":"(4) 정서와 한국성: 한(恨)과 정(情)\n한국적 콘텐츠와 한국성\n정情 • 끈끈한 인간관계와 따뜻함\n• 애정, 연민, 동정, 애착, 유대 같은 감정들이 포함되는 정서적/심리적 유대\n• 오랜 시간과 맥락 속에서 쌓이는 정서\n• i.g. 미운 정, 고운 정"},{"label":"p.73","text":"서구의 사랑 love, care, affection\n• 영어권의 사랑은 낭만적 사랑이나 가족애처럼 특정한 관계에 초점이 맞춰져 있는 경우가 많음\n• 개인간의 강렬한 감정이나 선택적인 유대가 강조됨\n• [비교] 한국의 ‘정’은 더 넓고 느슨한 범위에 적용 (이웃, 동료, 반려동물, 사물 등)\n참고 : 다른 문화권의 유사한 정서\n인연 縁, En\n• 사람 사이의 운명적인 연결\n• ‘인연’이 좀 더 철학적, 운명론적 느낌을 내표\n• [비교] 정은 현실적, 일상적 (i.g. 몇 년간 옆집에 살면서 쌓인 작고 소소한 감정)\n인정 人情\n• 인간관계의 따뜻함의 개념을 포함하나, 사람간의 예의나 의리 등 좀 더 도덕적인 느낌을 내포\n• [비교] 정은 좀 더 비합리적이고 감정적인 면을 포함 (e.g. 정 때문에 아닌 걸 알면서도 어쩔 수 없이)"},{"label":"p.74","text":"https://youtu.be/boR1__F3P0w?si=74m7EycR9a17_vKx\n[#도깨비] 냉장고 좀 채워달라는 죽은 수험생의 부탁,, 죽은 딸의 방을 둘러보는 엄마와 그런 엄마를 바라보는 딸의 눈물"},{"label":"p.75","text":"폭삭 속았수다, 쌀독의 쌀\nhttps://youtube.com/shorts/JWuEnf7mM68?si=JtMk7N6Y4Un3YLjz"},{"label":"p.76","text":"\u003c부산행> 2016 \u003c7번방의 선물>. 2013\n(5) 신파와 한국성\n한국적 콘텐츠와 한국성"},{"label":"p.77","text":"한국적 콘텐츠와 한국성\n신파 新派\n• 1867년 일본에서 서양의 연극 형식(↔구파, 가부키극)을 가리키는 말. 새로운 유형, 새로운 분\n파.\n• 인간이라면 누구나 지닌 욕망(ex.사랑) 때문에 갈등과 좌절이 생기며, 이로 인해 죄의식, 피해의\n식, 자기연민의 뒤섞인 감정 상태로 과잉된 눈물과 탄식이 드러남\n• 감정 과잉. 사랑 등 보편적인 가치를 핑계로 논리와 개연성을 무시하는 전개와 관객에게 감정을\n강요하는 연출방식"},{"label":"p.78","text":"영화 7번방의 선물 중 \u003chttps://youtu.be/xqBbsi4an4o?si=aqH2yihjmno5MIgZ>"}],"warnings":["텍스트가 거의 없는 페이지(이미지 위주일 가능성): p.4, p.11, p.25, p.41, p.43, p.45, p.46, p.48, p.63, p.79. 이 부분의 그림·도표 내용은 학습에 반영되지 않습니다."]},{"lecture":"4강 드라마와 한류","fileName":"4강 드라마와 한류.pdf","pages":[{"label":"p.1","text":"한류와아시아문화교류\n이윤진\nyunjin@ssu.ac.kr\nK드라마와 한류\n\u003c사랑이 뭐길래>에서 \u003c참교육>까지\n04. 드라마와 한류"},{"label":"p.2","text":"한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마\n• 1990년대 후반~2000년대 초반 한류 1.0 견인\n• 감정적 공감과 스토리텔링으로 대중을 사로잡은 매개체\n• 초기의 한류는 주로 TV 드라마를 통해 “K-드라마”라는 브랜드를 형성하며 아시아권에서 흥행"},{"label":"p.3","text":"한류의 시발점: 드라마 중심의 확산\n• 1997년 중국 관영방송 \u003cCCTV>에서 방영된\n\u003c사랑이 뭐길래> (국내 평균 시청률 60%)\n• 가족드라마\n• 한국 드라마의 인기를 우연한 것, 일시적인\n현상으로 전망\n한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마 1990년대 후반 ~ 2000년대 초반\n한류1.0, 한류1기"},{"label":"p.4","text":"2000년대 초반의 멜로드라마\n• 가을동화(2000), 겨울연가(2002) 등이 아시아를 공략하며 한류 1.0을 견인\n• 멜로드라마(melodrama) 중심: 남녀간의 순수하고 가슴 아픈 사랑 이야기\n- 감정의 진폭이 크며, 대중의 보편적 정서에 호소하는 통속극 (e.g. 운명적인 사랑, 처절한 복수)\n- 권선징악과 갈등\n- 극단적 상황 (불치병, 출생의 비밀, 복수 등)\n- 한국 가족서사와 결합된 한국적 정서\n한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마 1990년대 후반 ~ 2000년대 초반\n한류1.0, 한류1기"},{"label":"p.5","text":"여름향기(2003), 윤석호감독, https://youtu.be/AGqTgfqyp04?si=GDTJdA0HNWjMcBHg"},{"label":"p.7","text":"사극 드라마 대장금의 인기 (2003~국내 방송, 2005~ 국외 방송)\n• 이영애 주연의 사극으로 조선시대 요리사 장금의 이야기를 통해 한국 전통 음식과 의학을 소개\n• 중국, 동남아시아 등에서 방영되며 아시아 전역에서 인기 견인 (90여개국 방영)\n• 홍콩 지상파방송 \u003cTVB> 시청률 50%대, 이란 국영방송 \u003cIRIB> 시청률 90% 기록\n• 방송 후 한국 음식점 및 한복 체험 수요가 증가\n한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마\n2000년대 초~중반\n\u003c대장금> 이후 사극의 부상\nMBC 주몽(2006) 300억원\n태왕사신기(2007) 387억원\nKBS 대조영(2006) 350억원\nSBS 연개소문(2006) 400억원"},{"label":"p.8","text":"1990년대 후반 ~ 2000년대 초반 한국 드라마의 초기 성공요인\n1. 문화적 근접성\n(1) 유교적 가치\n• 가족 중심, 효(孝), 부모-자식의 위계, 집단 우선\n• 드라마에서의 표현: 부모의 반대, 가족을 위한 희생, 결혼은 개인의 문제가 아니라 집단의 문제\n• 일본, 중국, 대만 등 동아시아 국가들은 공통된 유교적 가치(가족, 효도)와 감정 표현을 드라마에서 발견하며 친\n밀감 형성\n(2) 근대적 사랑\n개인의 선택, 자유로운 연애, 감정 중심의 관계\n드라마에서의 표현: 신분/계급을 넘는 사랑, 개인의 욕망을 강조\n한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마"},{"label":"p.9","text":"2009\n꽃보다남자\n사립고에 다니게 된 세탁소집 딸과 부잣집 도\n련님의 사랑을 그린 드라마\n• 일본 순정만화 원작\n• 이민호, 구혜선, 김현중 출연\n• 국내 최고시청률 32.9%\n• 이민호 중국 SNS팔로워수 1위 차지\n2000년대 중후반\n2009\n미남이시네요\n남장을 한 여성이 아이돌 밴드의 일원이 되면서\n벌어지는 이야기\n• 일본과 중화권에서 큰 인기\n• 장근석, 박신혜, 정용화, 이홍기 출현\n• 국내 평균시청률 10%\n2009\n커피프린스 1호점\n씩씩한 가장으로 남자 행세를 하는 24살 여주인공과\n동인식품 후계자지만 가업을 잇기 싫은 남주인공이\n못 이겨 시작한 \u003c커피프린스>에서의 사랑이야기\n• 소설 원작\n• 홍대 까페 촬영지 관광명소화\n• 공유, 유은혜 출현\n• 국내 평균시청률 20%\n한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마"},{"label":"p.10","text":"한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마\n• 아시아 시장에 안착\n• 여전히 로맨스와 사극이 주류이나, 현대적이고 세련된 설정이 추가되면서 도시\n적 감성의 표현\n• 젊은 시청자 유인\n• 한류’스타’의 배출 : 아시아투어, 팬미팅 등을 통해 팬덤을 관리\n• 인터넷 보급을 통해 해외 팬들이 국내 드라마를 접하는 환경 개선\n(e.g. 유튜브 2005 출시, 불법 스트리밍 사이트 등)\n2006 \u003c궁>\n인기만화 “궁”을 원작으로, 평범한 신분의 여고생 채경이 할아버지 간의 약\n속 때문에 왕위 계승자 세자 이신과 정략결혼을 하면서 벌어지는 이야기\n• 주지훈, 윤은혜, 김정훈, 송지효 출연\n• 국내 최고 시청률 27.1%\n• 특히 1030 세대 여성에게 큰 인기\n2000년대 중후반"},{"label":"p.11","text":"드라마 \u003c커피프린스>, 7화. https://youtu.be/AT4B7fwabTE"},{"label":"p.12","text":"2013\n별에서 온 그대\n• HB엔터테인먼트 제작\n• 해외방영: 아이치이(중국)\n중국 방영권 회당 3천2백만 원\n• 제작비 132억 원\n2016\n태양의 후예\n• 스튜디오앤뉴 제작\n• 해외방영: 아이치이(중국)\n중국방영권 회당 3억 원, 한중동시방송\n• 사전제작\n• 제작비 130억 원\n2018\n미스터션샤인\n• 화앤담픽처스 제작 *스튜디오드래곤, CJ ENM\n• 해외방영: 넷플릭스(글로벌)\n글로벌 방영권 회당 12억원, 190개국\n• 사전제작\n• 제작비 430억 원\n• OTT 플랫폼을 통한 유통시장 변화\n• 해외와 동시 방영 되는 사례 증가\n2010년대 중후반\n한류와 한국 드라마의 역사적 발전"},{"label":"p.13","text":"텐트폴 드라마 (tent pole)\n• 제작사의 사업성패를 가를만한 대작 콘텐츠\n• 블록버스터급 영화에서 주로 사용되던 용어\n• 국내의 경우 제작비 100억원 이상 규모의 콘텐츠를 지칭\n• 호화 캐스팅, 유명 연출 및 작가진으로 기대를 모으는 작품\n주요 용어"},{"label":"p.14","text":"아스달연대기 (2019)\n스튜디오드래곤 제작\n총 제작비 540억 원\n김원석 연출, 김영현&박상연 극본\n장동건, 송중기, 김지원, 김옥빈 출연\n최고시청률 7.7%\n미스터션샤인 (2018)\n화앤담픽쳐스 제작 (스튜디오드래곤 자회사)\n총 제작비 480억 원\n이응복 연출, 김은숙 극본\n이병헌, 김태리, 유연석, 김민정, 변요한 출연\n최고시청률 18.1%"},{"label":"p.15","text":"참고: K드라마, 성장세 유지하려면, 전자신문, 2023.9.25. https://www.etnews.com/20230925000005\nOTT가 올려놓은 제작비 … TV 드라마가 쪼그라든다, 매일경제, 2023.8.13. https://www.mk.co.kr/news/culture/10806876\n오징어게임\n(2021.09)\n9부작/ 253억 원\n이상한 변호사 우영우\n(2022.06~08)\n16부작/ 150억 원\n재벌집 막내아들\n(2022.11~12)\n16부작/ 회당 22억 원\n수리남\n(2022.09)\n6부작/ 350억 원"},{"label":"p.16","text":"• \u003c왕좌의 게임> 등과의 표절시비\n• 근로기준법, 산업안전보건법 고발\n• 세계관 전달력 부족으로 시청자 유입 장벽\n• CG 완성도 미흡"},{"label":"p.17","text":"참고: K드라마, 성장세 유지하려면, 전자신문, 2023.9.25. https://www.etnews.com/20230925000005\nOTT가 올려놓은 제작비 … TV 드라마가 쪼그라든다, 매일경제, 2023.8.13. https://www.mk.co.kr/news/culture/10806876\n텐트폴 드라마 증가의 요인\n(1) OTT 사업의 확대로 드라마 제작에서의 경쟁구도 심화\n(2) 소비자의 높아진 눈높이와 기대 충족\n(3) 제작비 상승\n- 인건비 상승 (제작진, 배우)\n- 사전제작 확대\n- 주52시간 근무제의 적용\n→ 외국자본의 의존도가 높아질 가능성"},{"label":"p.18","text":"도깨비(2016), https://www.youtube.com/watch?v=UqwrhhEPxEc (1:10~)"},{"label":"p.19","text":"미스터션샤인(2018), https://youtu.be/pHY8AdAZg4g"},{"label":"p.20","text":"2019\n킹덤\n• 넷플릭스 의 첫 한국 오리지널 시리즈\n• 회당 20억원\n2020\n스위트홈\n• 넷플릭스 오리지널\n• 회당 30억원\n• 4일만에 넷플릭스 TOP10 13개국 1위\n2020\n오징어게임\n• 넷플릭스 오리지널\n• 회당 22억원\n2020년 전후\n• OTT의 대중적 이용에 따른 글로벌시장 인기, 장르물의 흥행\n• 사회적 메시지 내포, OTT 글로벌 순위권\n한류와 한국 드라마의 역사적 발전\n한류의 흐름과 주요 K-드라마"},{"label":"p.21","text":"https://youtu.be/VMZBhtnCk4I?si=YwBUBhmprXjT_Sdm\n스위트홈2 티저 (2024)"},{"label":"p.22","text":"한국 드라마의 글로벌 확산\n드라마가 한류에 미친 영향\n한류의 다양화에 영향\n• 관광, 한식, 한국어의 인기를 앞장\n• 동남아권 수용자들에게 \u003c겨울연가> 의 눈 내리는 겨울과 가을 단풍에 대한 판타지\n촬영지 남이섬은 국내 단일 관광지 중 외국인 방문객이 가장 많음\n남이섬을 배경으로 한 동남아 드라마와 영화 다수 촬영\n• K-푸드의 시작점"},{"label":"p.23","text":"드라마가 K-Culture의 확산에 미친 영향\n한류의 다양화\n관광 한식 한국어웹툰\n한국 드라마의 글로벌 확산"},{"label":"p.24","text":"관광 • 동남아권 수용자들에게 \u003c겨울연가> 의 눈 내리는 겨울과 가을 단풍에 대한 판타지\n• \u003c겨울연가> 촬영지 남이섬은 국내 단일 관광지 중 외국인 방문객이 가장 많으며, 남이섬을 배\n경으로 한 동남아 드라마와 영화 다수 촬영"},{"label":"p.25","text":"관광 • 한국관광공사 등에서도 정책적으로 한류 테마 관광지를 발표 및 홍보\n위: 논산 \u003c선샤인스튜디오>\n아래: 강릉 영진해변\n한국관광공사, 한류관광 대표코스 51선 발췌. 2023.2.21 보도자료"},{"label":"p.30","text":"한국 드라마의 글로벌 확산\n디지털플랫폼의 역할\nOver-the-Top (OTT) 플랫폼\n• 인터넷을 통하여 영상 콘텐츠를 제공하는 서비스\n• 전통적인 TV 방송의 한계를 넘어 전세계 동시접근이 가능\n- 기존: 방송사 → 케이블 → 셋탑박스 → TV\n- 현재: 방송사 → 인터넷 → 기기\n• 코로나 19 팬데믹으로 OTT 중심의 소비 확대\n• 주요시기 :\n- 2006 구글 유튜브 인수\n- 2007 넷플릭스 서비스 시작\n* 특히 글로벌 플랫폼이 “오리지널 콘텐츠＂로 투자하면서 확산 속도 가속화\n- 2007 애플TV\n- 2019 디즈니+"},{"label":"p.31","text":"• 아시아를 넘어 글로벌 시청자에게 한국콘텐츠 접근성이 증가 (장소성)\n• 한류콘텐츠 소비의 동시성이 높아짐 (시간성)\n• 유통구조의 변화 : 국가 → 플랫폼\n- 과거처럼 국가별 방송사 계약 체결을 기다릴 필요 없이 즉시 시청 가능\n• E.g. 넷플릭스 오리지널 \u003c오징어게임> : 190개국 동시 공개\n한국 드라마의 글로벌 확산\n1) 전세계 동시 배포\n글로벌 OTT가 바꾼 새로운 소비양식"},{"label":"p.32","text":"• 수동에서 능동으로\n한국 드라마의 글로벌 확산\n2) 시청 방식의 변화\n과거 현재\n정해진 시간(편성)에 시청\n채널 중심 소비\n원하는 시간 시청(on-demand)\n콘텐츠 선택 중심 소비\n글로벌 OTT가 바꾼 새로운 소비양식"},{"label":"p.33","text":"한국 드라마의 글로벌 확산\n3) 알고리즘 추천 • OTT 플랫폼은 사용자의 시청 기록을 분석해 비슷한 취향의 콘텐츠를 추천\n• e.g. 서바이벌 생존게임 장르물 애호가에게 오징어게임 추천\n• 다국어 자막과 더빙의 제공이 언어 장벽 낮춤\nE.g. 스페인 더빙판 \u003c태양의 후예>가 멕시코에서 큰 인기를 견인\n• 로컬적인 것과 글로벌한 것의 혼종 : 전세계가 이해하면서 신선한 즐거움\n4) 로컬 → 글로컬(glocal)\n글로벌 OTT가 바꾼 새로운 소비양식"},{"label":"p.34","text":"한국 드라마의 글로벌 확산\n5) 팬덤 문화와 소셜미디어\n• 팬들이 자발적으로 자막을 번역(e.g.Viki의 팬 자막 팀)\n• X나 인스타그램 등의 SNS 에서 밈과 리뷰를 공유\n• 드라마 자체가 바이럴 콘텐츠가 됨\n다국어 자막 번역 서비스를 제공하는 라쿠텐 비키\n드라마 리뷰 영상 유튜브 채널 사례들\n글로벌 OTT가 바꾼 새로운 소비양식"},{"label":"p.35","text":"예시\n넷플릭스 \u003c폭싹 속았수다>(2025) 조연 부상길의 주요 대사를 활용한 짜깁기 “Hagssi”\nhttps://youtu.be/IpYHus9KOZo?feature=shared"},{"label":"p.36","text":"• 넷플릭스, 멜론 등 동영상, 음악 서비스 뿐만 아니라 가구, 의류, 식료품 등의 분야까지도 확대\n• 제품/서비스를 소유하는 것 보다 저렴한 가격에 편리한 방식으로 일정기간 제품, 서비스에 대한\n이용권을 갖는 방식\n전통 소비(purchasing) 구독경제 (subscription)\n소유형태 소비자가 재화의 소유권 가짐 소비자가 일정기간 이용할 권리을\n가짐\n비용지불방식 재화의 구매가격만큼 판매자/생산자\n에게 한번에 지출 (1회성)\n이용하는 일정기간마다 일정 금액을\n소유주에게 지불 (정기성)\n소비자선택 한번 구매하면 바꿀 수 있는 선택권\n이 없음\n이용권 아이템 내에서 자유롭게 수\n시로 선택하거나 전문가가 골라줌\n관계 단발성 지속적\n한국 드라마의 글로벌 확산\n6) 구독경제 subscription economy\n글로벌 OTT가 바꾼 새로운 소비양식"},{"label":"p.37","text":"빨리 감기로 영상을 시청한 경험이 있습니까?\n크로스마케팅, 2021년 3월, 아나다 도요시(2021) 재인용.\n34.4%YES 20대 남성 54.5%, 20대 여성 43.6%\n한국 드라마의 글로벌 확산\n7) 빨리감기 / N배속 보기\n글로벌 OTT가 바꾼 새로운 소비양식"},{"label":"p.38","text":"영화 \u003c헤어질 결심>, https://youtu.be/YaPxDz36UW4\n영화 \u003c헤어질 결심>, 박찬욱, 2022\n대사없이 흘러가는 침묵의 장면에는 의도가 있다\n예시"},{"label":"p.40","text":"http://ottnews.kr/View.aspx?No=2166255"},{"label":"p.41","text":"왜 빨리 감기로 영상을 볼까?\n(1) 유행을 따라가기 위해 봐야 할 작품이 많아서\n(2) 가성비 중시\n(3) 빠르게 봐도 상관 없는 콘텐츠 증가\n• 감상에서 소비로: 작품을 감상한다 → 콘텐츠를 소비한다\n• ‘보고 싶다’가 아닌 ‘알고싶다’\n• 개성을 표현해야 하는 시대 (Z세대)\n• 시간에 대한 가성비를 중시함 (타임 퍼포먼스)\n• 짧고 구체적이며, 이해하기 쉬운 것이 선호됨\n• 웹툰, 웹소설 기반 영상콘텐츠가 증가 → 친절한 설명이 증가"},{"label":"p.42","text":"“Z세대는 기댈 곳이 필요하다. 개성 있는 존재가 되려면 더 많은 작품을 봐야만 한다.\n그들은 이 과정을 ‘가성비 좋게 해결’하길 원한다. 그래서 “봐야만 하는(읽어야 하는) 중요한\n작품을 적어달라”고 한다. 그들은 재미없는 작품 때문에 시간 낭비하는 일을 피하고 싶어\n한다. 수많은 졸작을 거친 끝에 자신만의 걸작을 만나는 희열을 알지 못한다. 가급적 힘을 덜\n들이고 돌아가는 길을 피하고 싶어 한다. 이것이 빨리 감기로 영상을 시청하는 동기와\n뿌리를 같이 하는 맥락이다.”\n이나다 도요시, 『영화를 빨리 감기로 보는 사람들』\n왜 빨리 감기로 영상을 볼까?"},{"label":"p.43","text":"로마의 휴일 (1953), https://youtu.be/YqbSJu1JKkU"},{"label":"p.44","text":"binge + viewing\n폭음, 폭식\n한국 드라마의 글로벌 확산\n7) 빈지뷰잉, 폭음시청 binge viewing, binge watching\n글로벌 OTT가 바꾼 새로운 소비양식"},{"label":"p.45","text":"넷플릭스 2012년 포스트플레이(post-play) 기능 추가\n(다음 에피소드 자동 재생)\n• 한 에피소드가 끝나면 자동으로 다음\n에피소드가 재생\n• 소비자는 다음 에피소드를 ‘보기 위해\n‘ 클릭하던 행동을 이제 ‘보지 않기 위\n해‘ 종료버튼을 클릭하는 행동을 하도\n록 바뀜\n자동재생은 편의일까?\n중독을 위한 설계일까?"},{"label":"p.46","text":"1. 여성 중심 서사의 힘\n드라마의 여성성\n- 존 피스크, 『TV 읽기』(1987/1994)\n- TV프로그램은 남성장르(딱딱한 현실)와 여성장르(부드러운 허구)로 구분\n한국드라마가 여성시청자에게 매력적인 요인\n1) 여성의 로맨틱 판타지를 슬기롭게 충족\n\u003c꽃보다남자>, \u003c파리의 연인>, \u003c사내맞선>, \u003c일타스캔들> 등\n2) 강인한 여성이 서사를 이끌어감\n\u003c멜로가 체질>, \u003c술꾼도시여자들> , \u003c서른, 아홉>, \u003c이상한변호사 우영우>, \u003c닥터차정숙> 등\n한국 드라마의 인기 요인 및 지역성"},{"label":"p.47","text":"1. 여성 중심 서사의 힘\n한국 드라마의 인기 요인 및 지역성"},{"label":"p.48","text":"\u003c스위트홈>, https://youtu.be/t-4thZeNm4c?si=xf9GFbhl9B3wN-Ry\n예시"},{"label":"p.49","text":"\u003c안나>, 2022, 유미가 진짜 안나에게 협박 당하는 장면\n예시"},{"label":"p.50","text":"2. 중산층 이데올로기\n양극화된 현실에 대한 비판의식\n- 서구가 겪은 사회문제를 한국은 짧은 시간동안 압축적으로 경험 (자본주의 사회의 모순)\n- 서구는 이미 겪어온 문제, 아시아권은 현재/앞으로 겪어나갈 문제들을 비판적이고 직설적으로 성찰\n중산층 이데올로기로 다수의 평범한 욕망을 겨냥\n- “할리우드의 주인공이 평범하다면 한국의 주인공은 가난하다. 양극화가 세계적인 화두가 되고, 자본주\n의가 영악해지면서 사람들은 점점 더 가난해지고 돈을 벌어 일확천금을 얻고 싶은 사람이 많아지고 있\n다” (이진숙 프로듀서, 한겨레, 2022.9. https://h21.hani.co.kr/arti/culture/culture_general/52569.html)\n한국 드라마의 인기 요인 및 지역성"},{"label":"p.51","text":"워킹데드에는 없고 킹덤에는 있는 것?예시"},{"label":"p.53","text":"\u003c오징어게임> https://youtu.be/u42YrGdpAMQ?si=_m0RdBMmF_BbxOiw\n예시"},{"label":"p.54","text":"3. 혼종성: 익숙한 코드 + 한국식 신파\n어떤 장르이든 ‘인간성’(휴머니즘) 이 등장\n기존의 좀비물\n• 이성적 인간 vs. 비이성적 좀비\n• 좀비가 어떤 특성을 가지고 있\n으며, 언제 어떤 방식으로 등장\n하는가\n\u003c지금 우리학교는>, \u003c스위트홈>\n• 이성적 인간 vs. 감정적 인간\n• 가족 서사, 부성애와 모성애, 휴머니즘\n• 사회에 대한 비판의식 (왕따, 학교폭력, 은둔형외톨이, 취업난)\n신파 => 인간의 보편타당한 이야기에 대한 공감\n한국 드라마의 인기 요인 및 지역성"},{"label":"p.55","text":"문화번역이란?\n서로 다른 문화가 만날 때 기존의 의미를 그대로 전달하기보다는, 해석·협상을 거쳐 새롭게 구성되는 과정\n언어 뿐 아니라 관습·관계·제도·감정의 맥락도 번역\n문화번역 cultural translation"},{"label":"p.56","text":"\u003c폭싹 속았수다>의 문화번역\n지역별 로컬 문화를 고려한 번역\n'When Life Gives You Tangerines'\n• [제주방언] “정말 수고 많으셨습니다”\n• [영미권] “When life gives you lemons, make lemonade”\n• [대만] 苦盡柑來遇見你 (Kǔ jìn gān lái yùjiàn nǐ)\n- 사자성어 “고진감래(苦盡甘來· 쓴 것이 다하면 단 것이 온다)”에 기반\n- 달 감(“甘”) 을 귤 감(“柑 “) 으로 변경\n• [일본] おつかれさま (Otsukaresama)\n- ‘수고하셨습니다’의 직역. 일본에서는 사용하는 인사말\n예시"},{"label":"p.58","text":"“유년 시절 폭력으로 영혼까지 부서진 한 여자가 온 생을 걸어\n치밀하게 준비한 처절한 복수와 그 소용돌이에 빠져드는 이들의 이야기”\n\u003c더 글로리>는 어떻게 국경을 넘는가?"},{"label":"p.59","text":"\u003c더 글로리>\n기본정보\n오픈일 1 부 2022.12.30 (8부작)\n2 부 2023.03.10 (8부작)\n채널 넷플릭스\n제작 스튜디오드래곤, 화앤담픽쳐스\n제작진 안길호 연출, 김은숙 극본\n출연진 송혜교, 임지연, 이도현, 염혜란 외\n흥행 및 성과\n로튼토마토 신선도 지수 100%\n팝콘 지수 96%\n• 공개 직후 넷플릭스 순위 9위로 진입했으\n나, 이후 한국을 비롯한 다수 아시아권 국\n가 1위\n• 2023년 2월 기준 넷플릭스 최대 흥행작"},{"label":"p.60","text":"나무위키 참조 , (접속일: 2023.3.25)"},{"label":"p.61","text":"\u003c더 글로리> 에서 드러나는 혼종성\n보편적 요소 ① 학교폭력의 심각성\nbully\nイジメ(izime) 일본에서 크게 사회문제가 되고 있는 청소년들의 교내 폭력이나 집단 따돌림\n(약자를) 괴롭히는 사람, (약자를) 괴롭히다(왕따시키다), 협박하다"},{"label":"p.62","text":"학교폭력을 주제로 하는 드라마들\n루머의 루머의 루머\n(미국, 2017~2020)\n엘리트들\n(스페인, 2018~2022)\nhttps://youtu.be/5CoI1Djwk14\n3학년A반\n(일본, 2019)\nEarly Swallows\n(우크라이나, 2019)"},{"label":"p.63","text":"루머의 루머의 루머 https://youtu.be/vvFUaopRXVo?si=42bxLMHNHKrgwdR6\n학교폭력을 주제로 하는 드라마들"},{"label":"p.64","text":"가십걸 https://youtu.be/tpG1J_lMliI?si=j1410aW_ViHK8b2h\n학교폭력을 주제로 하는 드라마들"},{"label":"p.65","text":"\u003c더 글로리> 에서 드러나는 혼종성\n보편적 요소 ② 복수극과 카타르시스\n셰익스피어의 \u003c햄릿>, (1599~1601)\n복수를 결심하는 계기는 본인, 가족의 피해"},{"label":"p.66","text":"\u003c더 글로리> 에서 드러나는 혼종성\n보편적 요소 ② 복수극과 카타르시스\n억울하게 고통받는 인물\n유사경험\n행복감, 통쾌함, 카타르시스 (대리만족)\n감정이입, 공감\n“나만 어렵고 억울하게 살고 있다”\n(가난한 환경, 학교 폭력 등)"},{"label":"p.67","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ① 학교폭력 가해자와 피해자의 특징\n가정환경\n“경제력”"},{"label":"p.68","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ① 학교폭력 가해자와 피해자의 특징\n영화 \u003c퀸카로 살아남는 법>\n피해자: 시골에서 전학 왔으며 수수하고 영리함\n가해자: 외모에 관심 많고 쇼핑을 좋아하는 퀸카\n드라마 \u003c루머의 루머의 루머>\n피해자: 전학을 오고 킹카에게 대쉬를 받음\n가해자: 반 친구들 - 질투, 루머 확산 등\n드라마 \u003cearly swallow>\n피해자: 섹스 스캔들에 휘말린 학생대표, 동성애자"},{"label":"p.69","text":"드라마 \u003c상속자들>\n피해자: 최하위층, 가난, 엄마의 장애\n가해자: 최상위층, 외모\n드라마 \u003c돼지의 왕>\n피해자: 가정폭력, 불우한 환경\n가해자: 풍족한 환경, 명석한 두뇌, 의사 집안\n드라마 \u003c아름다운 세상>\n피해자: 평범한 가정, 중위권 성적\n가해자: 아빠 – 학교재단 이사장"},{"label":"p.70","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ② 방관하는 교사와 학교\n君師父一體 1960~90년대 교사의 행위와 태도\n- 교사의 비리: 촌지, 입시 부정\n- 교사의 학생인권 침해: 학교폭력 https://youtube.com/shorts/UZaV_rNl2\nbw?si=SPSjmW1QQPktOKv9"},{"label":"p.71","text":"\u003c말죽거리잔혹사>\n\u003c친구>\n\u003c선생 김봉두>"},{"label":"p.72","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ③ 가해자들의 직업"},{"label":"p.73","text":"https://travelview.co.kr/live/article/4155/"},{"label":"p.74","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ④ 종교와 신神"},{"label":"p.77","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ④ 종교와 신神"},{"label":"p.78","text":"https://youtu.be/t-6n8uu7VW0?si=9ipdkvzQ5HDqIi09\nhttps://youtube.com/shorts/4dp8Ll97l6w?si=qOJ14eDqg5oAtHji"},{"label":"p.79","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ⑤ 복수의 방식\n함무라비 법전\n“눈에는 눈, 이에는 이”\n연진 : 살인죄로 수감, 홀로 남겨짐 (연진)\n명오 : 후두부 타격으로 죽음 (연진+경란)\n재준 : 눈이 먼 채로 추락 (혜정+도영)\n사라 : 마약과 살인미수로 구속 (사라)\n혜정 : 성대 훼손 (사라)"},{"label":"p.81","text":"\u003c더 글로리> 에서 드러나는 혼종성\n로컬적 요소 ⑥ 엄마의 유형과 가족주의"},{"label":"p.82","text":"\u003c참교육>은 어떻게 국경을 넘는가?\n\u003c참교육>티저 https://youtu.be/08C7wXGMM-Q?si=jJTQD2NOwUs8-uDg"},{"label":"p.83","text":"\u003c참교육>, 5회 https://youtu.be/nxzbcaf9xK4?si=EA6mfEdrTjiRvgQY\n드라마 \u003c참교육> : 텍스트와 현실의 혼재"},{"label":"p.84","text":"드라마 \u003c참교육> : 텍스트와 현실의 혼재"},{"label":"p.85","text":"드라마 \u003c참교육> : “참교육”의 의미 전유\n참된 교육 • 교육 운동 진영의 슬로건\n• 학생을 존중하고 제대로 가르치는 진실되고 올바른 교육\n응징, 정의구현 • 잘못을 저지른 사람을 혼쭐내고 응징하여 본때를 보여주는 행동\n• 온라인 커뮤니티 상에서 발전된 밈\n• 영문제목 “Teach you a Lesson”"},{"label":"p.86","text":"드라마 \u003c참교육> : 장르의 혼종성\n액션물 : 특수요원이 악당을 제압하는 액션∙사이다극\n비질란테(vigilante) : 법이나 공권력이 해결해주지 못한 문제를 대신 처벌하는 사람(해결사)"}],"warnings":["텍스트가 거의 없는 페이지(이미지 위주일 가능성): p.6, p.26, p.27, p.28, p.29, p.39, p.52, p.57, p.75, p.76, p.80, p.87. 이 부분의 그림·도표 내용은 학습에 반영되지 않습니다."]},{"lecture":"5강 예능프로그램과 한류","fileName":"5강 예능프로그램과 한류.pdf","pages":[{"label":"p.1","text":"한류와아시아문화교류\n이윤진\nyunjin@ssu.ac.kr\n05. 예능프로그램과 한류\n- 리얼리티쇼의 초국가성\n- 한국 예능은 어떻게 국경을 넘는가?"},{"label":"p.2","text":"중간시험 안내 (월요일반)\n일시: 10월 26일 (월) 3시\n범위: 2주차~시험 전까지 배운 범위\n문항: 단답형 10 문항, 약술형 2문항\n중간시험 기말과제 토론 수업참여도 출석\n20 20 30 10 20"},{"label":"p.3","text":"예능은 무엇을 보여주는 콘텐츠일까?\n리얼리티 쇼의 주요 유형\n• 서바이벌/경연형 (survival/competition)\n• 일상 관찰형 (observational)\n• 연애/관계형(dating/relationship)\n• 리얼 버라이어티형(real variety)\n• 여행/어드벤처형 (travel/adventure)\n• 소셜실험형 (social experiment)\n실제 인물이 특정 상황에서 보이는 행동·감정·관계·경쟁을 중심으로 구성한 프로그램\n• 출연자들이 특정 목표(우승, 상금, 타이틀)를 놓고 경쟁하며,\n탈락자가 발생하는 구조\n• 세부유형\n(1) 재능 오디션: 요리, 노래, 춤 등\n(2) 피지컬/생존: 육체적 한계에 도전하거나 살아남기\n(3) 두뇌 및 심리: 게임쇼, 전략과 정치, 배신 게임쇼\n• E.g. \u003c쇼미더머니>, \u003c흑백요리사>, \u003c더지니어스>, \u003c피의게임>"},{"label":"p.4","text":"• 출연자의 일상, 직업, 가족 생활 등을 관찰하며 자연스러운 모습\n을 보여줌. 스크립트가 최소화되거나 특정 상황이 설정\n• 공감 가능한 일상, 보편적 주제로 문화적 장벽이 낮음\n• E.g. \u003c나 혼자 산다>, \u003c슈퍼맨이 돌아왔다>, \u003c전지적 참견시점>\n• 서바이벌/경연형 (survival/competition)\n• 일상 관찰형 (observational)\n• 연애/관계형(dating/relationship)\n• 리얼 버라이어티(real variety)\n• 여행/어드벤처형 (travel/adventure)\n• 소셜실험형 (social experiment)\n예능은 무엇을 보여주는 콘텐츠일까?\n리얼리티 쇼의 주요 유형"},{"label":"p.5","text":"• 참가자들이 낭만적 관계를 형성하거나 파트너를 찾는 과정\n을 다룸. 경쟁, 드라마, 감정적 갈등이 주요 요소\n• 사랑과 관계라는 보편적 주제, 감정적 몰입을 유도\n• e.g. \u003c하트시그널>, \u003c나는솔로>, \u003c테라스하우스> , \u003c투핫>\n• 서바이벌/경연형 (survival/competition)\n• 일상 관찰형 (observational)\n• 연애/관계형(dating/relationship)\n• 리얼 버라이어티(real variety)\n• 여행/어드벤처형 (travel/adventure)\n• 소셜실험형 (social experiment)\n예능은 무엇을 보여주는 콘텐츠일까?\n리얼리티 쇼의 주요 유형\n실제 인물이 특정 상황에서 보이는 행동·감정·관계·경쟁을 중심으로 구성한 프로그램"},{"label":"p.6","text":"• 정해진 대본보다는 출연진들의 캐릭터와 관계성, 즉\n흥적인 상황에서 오는 재미를 추구\n• 특정 장소에서 게임이나 미션을 해결하는 경우가 많음\n• E.g. 런닝맨, 무한도전, 1박2일\n• 서바이벌/경연형 (survival/competition)\n• 일상 관찰형 (observational)\n• 연애/관계형(dating/relationship)\n• 리얼 버라이어티(real variety)\n• 여행/어드벤처형 (travel/adventure)\n• 소셜실험형 (social experiment)\n예능은 무엇을 보여주는 콘텐츠일까?\n리얼리티 쇼의 주요 유형\n실제 인물이 특정 상황에서 보이는 행동·감정·관계·경쟁을 중심으로 구성한 프로그램"},{"label":"p.7","text":"• 출연자들이 새로운 장소를 여행하거나 모험을 통해 경험\n을 쌓음. 지역 문화, 음식, 도전 과제가 포함\n• 세부 유형 (1) 문화탐방 (2) 어드벤처(극한도전)\n• E.g. \u003c지구마불 세계여행>, \u003c꽃보다 할배>, \u003c태어난\n김에 세계일주> 등\n• 서바이벌/경연형 (survival/competition)\n• 일상 관찰형 (observational)\n• 연애/관계형(dating/relationship)\n• 리얼 버라이어티(real variety)\n• 여행/어드벤처형 (travel/adventure)\n• 소셜실험형 (social experiment)\n예능은 무엇을 보여주는 콘텐츠일까?\n리얼리티 쇼의 주요 유형\n실제 인물이 특정 상황에서 보이는 행동·감정·관계·경쟁을 중심으로 구성한 프로그램"},{"label":"p.8","text":"• 특정 사회적, 심리적 주제를 탐구하거나 참가자들을 특이한 환\n경에 배치해 반응 관찰. 교육적이거나 실험적 요소 포함\n• 하위 유형: (1) 사회적 실험: 인위적 상황에서의 행동 관찰 (2) 라\n이프스타일의 변화(다이어트, 집 개조 등)\n• e.g. \u003cBig Brother>,\u003c소사이어티게임>, \u003c머니게임>\n• 서바이벌/경연형 (survival/competition)\n• 일상 관찰형 (observational)\n• 연애/관계형(dating/relationship)\n• 리얼 버라이어티(real variety)\n• 여행/어드벤처형 (travel/adventure)\n• 소셜실험형 (social experiment)\n예능은 무엇을 보여주는 콘텐츠일까?\n리얼리티 쇼의 주요 유형\n실제 인물이 특정 상황에서 보이는 행동·감정·관계·경쟁을 중심으로 구성한 프로그램"},{"label":"p.9","text":"대환장기안장 2 예고편, 넷플릭스, 2026. https://youtu.be/UGLVvzfOJ-I?si=fxrp9H4zzmLZMGvH\n예능 유형의 혼종"},{"label":"p.10","text":"배신맛집, 런닝맨 스브스 공식채널, (11:17), https://youtu.be/AMlPQrW-kAA?si=0pw9KaiLXSu7BrKC\n예능은 무엇을 보여주는 콘텐츠일까?\n리얼 버라이어티의 재미 포인트\n주요 포인트: 미션, 배신, 협력, 돌발 상황\n주목할 요소: 출연자의 캐릭터와 관계\n예시"},{"label":"p.11","text":"흑백요리사 시즌1, 넷플릭스코리아, https://youtu.be/BjkGYHOoUo8?si=TfvJgqusiRbp7jJ6\n예능은 무엇을 보여주는 콘텐츠일까?\n서바이벌/경연형 리얼리티쇼의 재미 포인트\n주요 포인트: 실력, 경쟁, 평가, 탈락\n주목할 요소: 승패와 성장\n예시"},{"label":"p.12","text":"포포: 죽어도 사랑해 삿포로.1(5:00~), https://youtu.be/TJjvclYelLQ?si=soPhaAslsZPJee71\n예능은 무엇을 보여주는 콘텐츠일까?\n연애/관계형 리얼리티쇼의 재미 포인트\n주요 포인트: 호감, 설렘, 선택, 갈등\n주목할 요소: 관계의 변화와 감정\n예시"},{"label":"p.13","text":"한국에서 웃긴 장면은 해외에서도 웃길까?\n문화번역의 중요성\n쉽게 전달되는 요소 vs. 이해가 어려운 요소\n뿅뿅지구오락실, 훈민정음 한식레이스, (1:10~) https://youtu.be/ijoPeP6vGqM?si=o45c29mXMENBhBiE"},{"label":"p.14","text":"김미라. (2016). \u003c미스터리 음악쇼-복면가왕>의 서사전략과 그 함의. 한국극예술연구, 54, 121-153\n한국에서 웃긴 장면은 해외에서도 웃길까?\n예시"},{"label":"p.15","text":"넷플릭스 기사, 2023.9.5.\nhttps://about.netflix.com/en/news/unscripted-shows-asia-subtitling-dubbing\n한국에서 웃긴 장면은 해외에서도 웃길까?\n문화번역의 중요성\n\"넷플릭스는 더빙과 자막의 혁신을 통해 이러한 변화를 이어가고자\n지속적으로 노력하고 있습니다.\"\n고품질의 현지화\n- 더빙과 자막 작업에 충분한 시간을 확보하기 위해, 선 촬영 후 전세계 동시 공개\n대사의 복잡성과 비언어적 뉘앙스에 대한 탐색\n- \u003c피지컬 100>의 경우 200대의 카메라가참가자 얼굴의 표정 포착\n- 바디랭귀지의 미묘한 변화를 포착하기 위해 노력"},{"label":"p.16","text":"• \u003c아메리칸 아이돌>의 유사 포맷\n• \u003c슈퍼스타K> (2009~2016) , \u003c위대한 탄생>(2010~2013), \u003c방과후 설렘>(2021~2022) 등\n• 전국 오디션을 통해 팝 아이돌과 아티스트를 찾아내는 목적\n오디션 프로그램과 혼종성\n초국가적으로 이동하는 예능 프로그램에서 ‘한국성’이라는게 있을까?"},{"label":"p.17","text":"• 젠더, 나이, 인종, 외모와 무관한 공정\n한 경쟁\n• 시청자의 투표를 통한 참여의 최대화\n• K팝과 K드라마의 성공에 기반을 둔\n디아스포라 (diaspora) 요소\n• 한국의 하향식 교육 시스템과 연장자\n의 권위를 존중하는 멘토 시스템\n글로벌적 요소 로컬적 요소\n예) \u003c슈퍼스타K> 해외 오디션\n예) \u003c위대한 탄생> 백청강 , 존박, 배수정\n* 디아스포라:\n본토를 떠나 타국에서 살아가는 공동체 집단, 또는 이주\n오디션 프로그램과 혼종성\n초국가적으로 이동하는 예능 프로그램에서 ‘한국성’이라는게 있을까?"},{"label":"p.18","text":"Iam Tongi Makes The Judges Cry With \"Monsters\" And His Emotional Story (American Idol 2023, 2:00~)\nhttps://youtu.be/S_MAesZsnMk?si=cBoPm-g4Hbqczr7v"},{"label":"p.19","text":"슈퍼스타K 시즌3 (2011)참고"},{"label":"p.21","text":"[방과후 설렘] ＂같이 가고 싶었어요＂ 선생님 PICK 탈락자 추가 합격부터 학년별 담임 배정까지\n| #방과후설렘 #3화 #엠뚜루마뚜루 MBC211212방송 (0:30~)\n참고"},{"label":"p.22","text":"보이즈플래닛,” '베이킹만 몇 년 했냐?' 마스터님의 하늘같은 은혜에 감사드립니다 “| Mnet 230420 방송\n[EN/JP]\n참고"},{"label":"p.23","text":"한국예능은 어떻게 국경을 넘는가?\n한국예능이 해외로 전파되는 유형\n구분 무엇이 이동하는가? 해외 시청자가 보는 것\n완성 프로그램 유통 한국에서 제작한 영상 한국 출연자와 한국어로 진행되는 프로그램\n포맷 수출 규칙·구성·제작 노하우 현지 출연자와 현지 언어로 만든 프로그램\n글로벌 플랫폼 유통 여러 시장으로 연결되는 유통 경로 자막·더빙으로 제공되는 한국 프로그램"},{"label":"p.24","text":"한국예능은 어떻게 국경을 넘는가?\n한국예능이 해외로 전파되는 유형\nNE-YO is Badger! | Season 2 Final Reveal | The Masked Singer UK, https://youtu.be/QnwZ_LKv0yk?si=T2bV5lqsEa4firKb"},{"label":"p.25","text":"흑백요리사와 혼종성\n흑백요리사: 요리계급전쟁, 공식예고편, 넷플릭스 https://youtu.be/vebF7wUQLMo?si=EtHkqouAGIkUJZqU"},{"label":"p.26","text":"흑백요리사와 혼종성\n흑백요리사의 글로벌 보편성과 한국의 로컬성\n쉽게 이해할 수 있는 구조 한국의 로컬적 문화\n유명 요리사와 도전자의 대결 한국의 외식업과 요리사의 경력\n제한된 조건에서 요리하기 식재료와 조리 방식\n평가 · 탈락 · 역전 음식에 담긴 기억과 가치\n실력을 인정받으려는 이야기 ‘흑수저·백수저’라는 사회적 표현"},{"label":"p.27","text":"피지컬 100은 왜 글로벌적 인기를 끌었을까?\n참고"},{"label":"p.28","text":"피지컬100 시즌1 (2023) https://youtu.be/XhmO426jjPM?si=RXXaG9TIt8hhrGlB\n피지컬 100은 왜 글로벌적 인기를 끌었을까?"},{"label":"p.29","text":"고대 그리스∙로마 문화와 Physical 100\n아름답고 건강한 육체에 아름답고 건강한 정신이 깃든다는 믿음\n육체를 단련하고 이상화된 육체를 통해 정신성을 표현\n피지컬 100은 왜 글로벌적 인기를 끌었을까?"},{"label":"p.30","text":"고대 그리스∙로마 문화와 Physical 100\n아름답고 건강한 육체에 아름답고 건강한 정신이 깃든다는 믿음\n육체를 단련하고 이상화된 육체를 통해 정신성을 표현\n피지컬 100은 왜 글로벌적 인기를 끌었을까?"},{"label":"p.31","text":"피지컬100 시즌1\n아틀라스(Atlas)의 형벌\n참고"},{"label":"p.32","text":"피지컬100 시즌2 (2024) 결승전라운드 https://youtu.be/2Rr2-87rcho?si=FpQMY4DM54GYh1YS\n예시"},{"label":"p.33","text":"로맨스 예능프로그램의 혼종성\n로맨스 예능의 혼종적 특징\n• 단순히 연애 프로그램이 아니라, 각국의 사회적 가치, 결혼이나 자녀 등에 대한 생각, 젠더 관념, 미디\n어 트렌드가 얽히며 혼종적인 특성을 띰"},{"label":"p.34","text":"국내 리얼리티 프로그램의 혼종성과 글로컬라이제이션 전략\n일반인 남녀가 출연하는 연애프로그램에서 나타나는 혼종성의 요소는?\n우리나라 예능과 해외의 예능의 차이점은 무엇일까?"},{"label":"p.36","text":"연애 리얼리티 프로그램의 글로벌적인 요소?"},{"label":"p.37","text":"연애 리얼리티 프로그램의 글로벌적인 요소\n• 일반인 남녀가 출연\n• 정해진 공간, 정해진 기간(시간)을 관찰\n• 패널이나 성우가 등장해서 나래이션, 시청자의 입장을 대변하기도 함\n• 매력적인 남녀 출연\n• 게임이나 미션이 주어지기도 함\n• 마지막에 최종 결정이 이루어짐"},{"label":"p.39","text":"연애 리얼리티 프로그램의 혼종적 요소?"},{"label":"p.44","text":"커플팰리스 (2024) 5회 \u003chttps://youtu.be/JgMpSNf2D8A?si=LlbRmW8PsuTy3wI9>"},{"label":"p.48","text":"한국적 소재 x 로맨스 예능\n신들린 연애 (SBS, 2024~)"}],"warnings":["텍스트가 거의 없는 페이지(이미지 위주일 가능성): p.20, p.35, p.38, p.40, p.41, p.42, p.43, p.45, p.46, p.47, p.49. 이 부분의 그림·도표 내용은 학습에 반영되지 않습니다."]},{"lecture":"6강 애니메이션과 한류","fileName":"6강 애니메이션과 한류.pdf","pages":[{"label":"p.1","text":"한류와아시아문화교류\n이윤진\nyunjin@ssu.ac.kr\n06. 애니메이션과 한류\n- 페파피그에는 있고 콩순이에는 없는 것?"},{"label":"p.3","text":"한국 애니메이션의 역사적 맥락\n2000년대 이전까지의 한국 애니메이션 산업\n전세계 애니메이션 시장은 미국과 일본 애니메이션에 의해 점유"},{"label":"p.4","text":"한국 애니메이션의 역사적 맥락\n2000년대 이전까지의 한국 애니메이션 산업\n• 2000년대 초반까지 한국 애니메이션은 글로벌 분화시장에 적합한 작품 창작에 성공적이지\n못함\n- 1936년 고유 애니메이션 제작 시작\n- 1967 \u003c홍길동>\n- 1976 \u003c로보트 태권브이>\n- 1987 \u003c아기공룡 둘리>\n• 1970~1990년대: 주로 미국이나 일본과의 하청계약을 통한 OEM 방식 제작\n뛰어난 기술 축적, 그러나 기획력 부족 및 창작역량은 억제\nOEM (the Original Equipment Manufacturing) 주문자위탁생산\n유통망을 구축하고 있는 주문업체에서 생산성을 가진 제조업체에 자사에서 요구하는 상품을 제조하도록 위탁하\n여 완성된 상품을 주문자의 브랜드로 판매하는 방식"},{"label":"p.5","text":"• OEM 생산을 통해 축척한 노하우를 기반으로 고유 애니메이션 캐릭터 제작 및 산업 발전\n2002년 애니메이션 업체 163개 -> 2012년 341개 로 증가 -> 2020년 490개\n한국 애니메이션의 역사적 맥락\n2000년대 초 독자 기획 시작\n마당을 나온 암탉 ,4K버전 예고편 https://youtu.be/yhlMqP0Q6k4?si=-YTmz5gS-Aj9EwC4\n\u003c뽀롱뽀롱 뽀로로>, 2003\n\u003c마당을 나온 암탉>, 2011, 장편 애니메이션의 가능성 확인"},{"label":"p.6","text":"\u003c아기상어>\n- 북미 동요를 편곡, 2015년 핑크퐁 출시\n- 2021년 전세계 유튜브 조회수 1위\n- 2026년 기준 168억뷰\nhttps://youtu.be/XqZsoesa55w?si=SNDninLg64ScMWjc"},{"label":"p.7","text":"애니메이션의 혼종성과 텍스트\n한국 애니메이션의 성공 요인\n1) 디지털 테크놀로지\n2) 숙련된 인력\n3) OSMU 파생상품 출시\n원 소스 멀티 유즈(One source multi-use, OSMU)\n하나의 매체를 여러 매체의 유형으로 전개"},{"label":"p.9","text":"애니메이션의 혼종성과 텍스트\n뽀롱뽀롱 뽀로로\n• 2003년 11월 EBS 방영\n• 미취학 유아층을 대상\n• 아이코닉스 엔터테인먼트, 오콘, SK브로드밴드, EBS, 북한\n하청업체 삼천리 등의 협업으로 탄생\n• 동아시아, 남아시아, 호주, 서부유럽 등 전세계 시장에 판매\n2005년 대만 아동채널 YoYo Channel 방영 시작\n2005년 프랑스 지역방송사 TF1 최고시청률 47%\n2006년 중국 CCTV, 일본 후지 TV 방영\n2011년 호주, 영국 등 150개국 방영"},{"label":"p.11","text":"애니메이션의 혼종성과 텍스트\n뽀로로의 인기요인\n1) 서구 방식의 캐릭터 개발\n- 기존 한국 애니메이션은 원작 만화의 인기를 기반으로 함\n- 뽀로로는 헬로키티, 미키마우스 등 캐릭터 기반으로 제작\n유아 대상 애니메이션의 특징\n- 언어 장벽이 낮음: 더빙이 쉽고, 대사가 단순\n- 문화 특수성이 약함: 특정한 한국정서와 맥락 없이 소비\n- IP 비즈니스 중심: 수익 다각화 가능\n- 수용 연령층: 0~7세 + 부모"},{"label":"p.12","text":"안녕자두야\n1997년~\n학산문화사의 만화잡지 파티\n작가: 이빈\n아기공룡 둘리\n1983년 월간 보물섬\n작가: 김수정"},{"label":"p.13","text":"애니메이션의 혼종성과 텍스트\n뽀로로의 인기요인\n2) 서구 미취학 아동프로그램의 스토리라인, 주제음악 등 연구\n- 뽀로로는 7세 미만 유아를 대상으로 10분 안팎으로 에피소드 구성\n- 10대 청소년들이 1990년대에는 애니메이션 주 소비자였으나 사교육 등으로 더 이상 주고객이 아님을 간파\n텔레토비 teletubbies"},{"label":"p.14","text":"애니메이션의 혼종성과 텍스트\n뽀로로의 인기요인\n3) 독특한 텍스트적 특성\n- 아이들의 꿈을 대변하는 파일럿 펭귄 - “날고 싶은 꿈을 지닌 펭귄“\n4) 기억하기 쉬운 이름의 다양한 동물 캐릭터 등장\n- 개성있는 여러 인물군으로, 아동시청자가 동일시 가능\n패티: 활발한 꼬마 펭귄\n운동을 잘하며, 명랑한\n성격에 리더십이 강함.\n예시 루피: 다정한 꼬마 비버\n소심하고 겁이 많고 부끄\n럼을 많이 타지만 친절하\n고 마음씨 착하며 요리를\n좋아함\n에디: 영리한 발명왕 여우\n과학자가 꿈이며 매번 엉뚱\n하고 신기한 기계를 발명함.\n장난치는 것을 좋아함"},{"label":"p.15","text":"애니메이션의 혼종성과 텍스트\n뽀로로의 인기요인\n5) 반복적인 내러티브와 느린 포맷\n- 교육적인 목적에 초점을 맞추지 않고 그 자체로 즐길 수 있도록 의도\n- 종종 말썽을 일으키지만 자기 식대로 문제를 해결하는 인물상"},{"label":"p.16","text":"엉뚱발랄 콩순이, “사진 찍는 날“ (1:52~)"},{"label":"p.17","text":"애니메이션의 혼종성과 텍스트\n뽀로로의 혼종성\n(1) 이름\n뽀로로 PORORO\nPenguin\n‘쪼르르’\n(2) 식사문화\n한국음식 대신 케이크, 쿠키 등 을 먹는 모습"},{"label":"p.21","text":"“좀 더 친근한 한국 문화를 반영함으로써 한국 팬의 요청에 응답하고 싶은 만큼 우리는 또한 해외\n시청자들이 소외되는 느낌을 받지 않도록 해야 합니다“ (아이코닉스 CEO 최종일)\n뽀롱뽀롱 뽀로로 7기, 13화 “빵이 너무 좋아요”편"},{"label":"p.22","text":"애니메이션의 혼종성과 텍스트\n문화적 중립성\n• 주요 타켓이 글로벌 시대 민족성에 대한 인식이 없는 미취학 연령임을 고려\n• 문화적으로 중성적인 애니메이션 캐릭터의 제작\n- 눈 색깔, 머리카락 색깔이 드러나지 않도록 고글과 헬멧 착용\n- 돼지 캐릭터를 제외\n- 파랑, 핑크, 화이트 등 친근하면서 양성을 모두 표현할 수 있는 색상*\n- 글로벌적으로 보편화된 인사방법\n- 유교사상, 권위체계를 표현하지 않음*\n결과적으로, 지역 애니메이션의 글로벌 성공"},{"label":"p.24","text":"정치적 올바름\nPolitical correctness\n말의 표현이나 용어의 사용에서, 인종·민족·언어·종교·성차별 등의 편견이\n포함되지 않도록 하자는 주장"},{"label":"p.26","text":"[영상#1] 영화 인어공주에 대한 리액션 영상"},{"label":"p.30","text":"국내 애니메이션의 한계 및 지향점\n다양성"},{"label":"p.31","text":"다양성①\n성역할 고정 및 성차별 요소에 대한 민감성"},{"label":"p.33","text":"윤정미, '핑크 프로젝트-지원이와 지원이의 핑크색 물건들'. 서울. 한국. 라이트젯 프린트. 2014.\n윤정미, '블루 프로젝트-경진이와 경진이의 파란색 물건들'. 서울. 한국. 라이트젯 프린트. 2017\n참고"},{"label":"p.34","text":"[영상#2] \u003c바다 탐험대 옥토넛> 시즌1 e.36 통안어\n바다탐험대 옥토넛, 영국 BBC 유아채널 방영\n2010~\n참고\nhttps://www.youtube.com/watch?v=Ehdi6Rxuth4"},{"label":"p.37","text":"블루이 Bluey\n호주 애니메이션, 블루힐러 종 6살 강아지\n블루이 오프닝 송, https://youtu.be/8nv1m-aTCZI?si=TeX6-A1DWzIyJLCa"},{"label":"p.38","text":"다양성②\n외모에 대한 스테레오 타입과 외모지상주의\n우: 캐치티니핑 하트로즈베이커리 등장인물\n위: 브레드이발소 케이크 여왕님"},{"label":"p.39","text":"[영상3] 브레드이발소 시즌1, 에피소드31 \u003c케이크여왕의 다이어트>\nhttps://www.youtube.com/watch?v=yUPfBbJQEoI"},{"label":"p.40","text":"다양성③\n노인에 대한 관점\n콩순이 \u003c느려도 괜찮아>\n느리고 거동이 불편한 거북이 같은 할아버지\n느려서 볼 수 있는 자연의 아름다움. 느린 것의 가치\n블루이 시즌2\u003c치실 댄스>, 시즌3 \u003c불평쟁이 할머니>\n스마트폰에 익숙치 않음, 느림, 귀가 어두움, 손주불평이 많음\n묘사\n내용\n묘사\n내용 어르신의 유형의 다양성\n“늙음”을 일방적인 배려의 대상이나 도움이 필요한 존재로 그\n리지 않고, 자연스럽게 묘사"},{"label":"p.41","text":"[영상4] 엉뚱발랄 콩순이 \u003c느려도 괜찮아>(편집본)\nhttps://youtu.be/_7fzjKrM74Q?si=HoYz6ynaP-4kx7DQ"},{"label":"p.42","text":"[영상5] 블루이 \u003cGranny 할머니>\nhttps://youtu.be/D6JLZWVQd7A?si=EppB9pqujMzPl0Ln"},{"label":"p.43","text":"블루이 시즌3 \u003c불평쟁이 할머니 Grouchy Granny!> https://www.youtube.com/watch?v=Dtyspn6fGI0\nhttps://youtu.be/Dtyspn6fGI0?si=h3V62CRh_4S1zlar"},{"label":"p.44","text":"다양성④ 장애\n\u003c블루이> 속 패럴림픽 묘사"},{"label":"p.45","text":"[영상#6] \u003c페파피그> 시즌6 Mandy Mouse"},{"label":"p.46","text":"\u003c페파피그> 시즌6 새 캐릭터 맨디 Mandy Mouse\nIn every new series of Peppa Pig we like to add in some new friends for Peppa,” co-creator Mark Baker tells Teen\nVogue. “ For a while, we wanted to introduce a new friend for Peppa who had a disability, as the series is based on\nthe real experiences of small children and disability is a part of the world.” (중략) He said, “As Peppa is a simplified\nand stylized version of the real world shown from a child’s perspective, we deliberately kept the nature of Mandy’s\ndisability vague, so that she could represent children with different disabilities.” (2019 인터뷰)"},{"label":"p.47","text":"다양성④ 장애\n\u003c블루이> 속 ADHD 로 보여지는 잭"},{"label":"p.48","text":"[영상#7] 블루이, 시즌2 \u003c군대>"},{"label":"p.49","text":"기타 - 식생활 다양성\n블루이, 시즌2 \u003c아빠가 태워주는 날>"},{"label":"p.50","text":"기타 – 주인공과 주변인물들의 성격"}],"warnings":["텍스트가 거의 없는 페이지(이미지 위주일 가능성): p.2, p.8, p.10, p.18, p.19, p.20, p.23, p.25, p.27, p.28, p.29, p.32, p.35, p.36, p.51, p.52. 이 부분의 그림·도표 내용은 학습에 반영되지 않습니다."]}]}</script>

function buildBankConcepts(items) {
  return items.map((it) => {
    const keyPoint = it.cloze.replace(/\[\[|\]\]/g, "");
    const bank = [
      ...it.fills.map(([q, a]) => ({ type: "fill", question: q, choices: [], answer: a, explanation: it.text, keyPoint, requiredKeywords: [], modelAnswer: "" })),
      ...it.ox.map(([q, a, why]) => ({ type: "ox", question: q, choices: ["O", "X"], answer: a, explanation: why, keyPoint, requiredKeywords: [], modelAnswer: "" })),
      ...it.multi.map(([q, ch, ans, why]) => ({ type: "multi", question: q, choices: ch, answers: ans, answer: ans.join(" / "), explanation: why, keyPoint, requiredKeywords: [], modelAnswer: "" })),
    ];
    const cards = [
      ...it.fills.map(([q, a]) => ({ front: q, back: a.split(" / ")[0] })),
      ...it.ox.filter((o) => o[1] === "X").map(([q, , why]) => ({ front: `O / X ?\n${q}`, back: `X\n${why}` })),
    ].slice(0, 3);
    if (!cards.length) cards.push({ front: `${it.title}: 핵심 문장은?`, back: keyPoint });
    return {
      id: it.id, order: it.order, title: it.title, tier: it.tier, summary: it.summary,
      definition: it.text, keywords: [...it.cloze.matchAll(/\[\[([^\]]+)\]\]/g)].map((m) => m[1]),
      flashcards: cards, cloze: it.cloze, briefAnswer: "", essayOutline: [], confusions: [],
      source: it.source, emphasized: it.emphasized, bank, progress: EMPTY,
    };
  });
}

// ───────── 로컬 저장소 (이 브라우저의 IndexedDB) ─────────
// 경로(path) → 문서(JSON) 형태의 단순한 키-값 저장소. 컬렉션 조회는 경로 접두어로 한다.
function localStore() {
  let dbp = null;
  const fail = (err) => ({ code: err && err.name === "QuotaExceededError" ? "quota_exceeded" : "local_error", message: String(err) });
  const open = () => (dbp ||= new Promise((res, rej) => {
    let r;
    try { r = indexedDB.open("exam-helper", 1); } catch (e) { return rej(fail(e)); }
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(fail(r.error));
  }));
  const run = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      let out;
      try {
        const t = db.transaction("kv", mode);
        fn(t.objectStore("kv"), (v) => { out = v; });
        t.oncomplete = () => res(out);
        t.onerror = t.onabort = () => rej(fail(t.error));
      } catch (e) { rej(fail(e)); }
    });
  };
  const snap = (id, d) => ({ id, exists: d !== undefined, data: () => d });
  const json = (d) => JSON.parse(JSON.stringify(d));
  const doc = (path) => ({
    get: async () => snap(path.split("/").pop(), await run("readonly", (st, set) => { const r = st.get(path); r.onsuccess = () => set(r.result); })),
    set: (d) => run("readwrite", (st) => st.put(json(d), path)),
    update: (d) => run("readwrite", (st) => { const r = st.get(path); r.onsuccess = () => st.put({ ...(r.result || {}), ...json(d) }, path); }),
    delete: () => run("readwrite", (st) => st.delete(path)),
  });
  const collection = (path) => {
    const q = {
      limit: () => q,
      get: async () => {
        const docs = await run("readonly", (st, set) => {
          const found = [];
          const c = st.openCursor(IDBKeyRange.bound(path + "/", path + "/\uffff"));
          c.onsuccess = () => {
            const cur = c.result;
            if (!cur) return set(found);
            const rest = String(cur.key).slice(path.length + 1);
            if (!rest.includes("/")) found.push(snap(rest, cur.value));
            cur.continue();
          };
        });
        return { docs, size: docs.length, empty: !docs.length };
      },
    };
    return q;
  };
  return { doc, collection, ready: open };
}
// IndexedDB를 쓸 수 없을 때: 이번 방문 동안만 메모리에 보관
function memoryStore() {
  const m = new Map();
  const snap = (id, d) => ({ id, exists: d !== undefined, data: () => d && JSON.parse(JSON.stringify(d)) });
  return {
    doc: (path) => ({
      get: async () => snap(path.split("/").pop(), m.get(path)),
      set: async (d) => { m.set(path, JSON.parse(JSON.stringify(d))); },
      update: async (d) => { m.set(path, { ...(m.get(path) || {}), ...JSON.parse(JSON.stringify(d)) }); },
      delete: async () => { m.delete(path); },
    }),
    collection: (path) => {
      const q = { limit: () => q, get: async () => {
        const docs = [...m.keys()].filter((k) => k.startsWith(path + "/") && !k.slice(path.length + 1).includes("/")).map((k) => snap(k.slice(path.length + 1), m.get(k)));
        return { docs, size: docs.length, empty: !docs.length };
      } };
      return q;
    },
  };
}

async function retry(fn) {

    throw e;

}

async function upgradeBankSet(bk) {

  const types = ["multi", ...S.meta.settings.types.filter((t) => t !== "multi")];

const EMPTY = { status: "unlearned", streak: 0, correct: 0, wrong: 0, selfRating: null, lastAt: 0 };
const prog = (c) => c.progress || EMPTY;
function applyVerdict(p, v) {
  const now = Date.now();
  if (v === "correct") {
    const streak = p.streak + 1;
    const need = p.wrong > 0 ? 2 : 1; // 틀린 적 있으면 연속 2번
    return { ...p, streak, correct: p.correct + 1, status: streak >= need ? "mastered" : "review", lastAt: now };
  }
  if (v === "partial") return { ...p, streak: 0, status: "review", lastAt: now };
  return { ...p, streak: 0, wrong: p.wrong + 1, status: "review", lastAt: now };
}
function applySelf(p, r) {
  const next = { ...p, selfRating: r, lastAt: Date.now() };
  if (r !== "know" && p.status !== "review") next.status = "review";
  return next;
}
function priority(p) {
  let s = p.wrong * 3 - p.streak * 2;
  if (p.selfRating === "dontknow") s += 3;
  if (p.selfRating === "unsure") s += 2;
  if (p.status === "review") s += 4;
  if (p.status === "unlearned") s += 1;
  if (p.status === "mastered") s -= 10;
  return s;
}
const isWeak = (p) => p.status === "review" || (p.status !== "mastered" && (p.selfRating === "unsure" || p.selfRating === "dontknow"));
const weakConcepts = () => S.concepts.filter((c) => isWeak(prog(c))).sort((a, b) => priority(prog(b)) - priority(prog(a)));
function stats() {
  const ess = S.concepts.filter((c) => c.tier === "essential");
  const essential = { mastered: 0, review: 0, unlearned: 0 };
  for (const c of ess) essential[prog(c).status]++;
  const by = {};
  for (const a of S.attempts) {
    const t = (by[a.question.type] ||= { total: 0, score: 0 });
    t.total++; t.score += a.verdict === "correct" ? 1 : a.verdict === "partial" ? 0.5 : 0;
  }
  return {
    essentialTotal: ess.length, essential,
    percent: ess.length ? Math.round((essential.mastered / ess.length) * 100) : 0,
    byType: QTYPES.filter((t) => by[t]).map((t) => ({ type: t, total: by[t].total, rate: Math.round((by[t].score / by[t].total) * 100) })),
  };
}

async function parsePdf(buf) {
  if (!window.pdfjsLib) throw new Error("PDF 라이브러리를 불러오지 못했습니다.");
  pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
  const pdf = await pdfjsLib.getDocument({ data: new Uint8Array(buf), isEvalSupported: false }).promise;
  const pages = [];
  for (let i = 1; i <= pdf.numPages; i++) {
    const tc = await (await pdf.getPage(i)).getTextContent();
    let t = "";
    for (const it of tc.items) { t += it.str || ""; if (it.hasEOL) t += "\n"; }
    pages.push({ label: `p.${i}`, text: clean(t) });
  }
  return pages;
}
const decodeXml = (s) => s.replace(/&lt;/g, "<").replace(/&gt;/g, ">").replace(/&quot;/g, '"').replace(/&apos;/g, "'").replace(/&#(\d+);/g, (_, n) => String.fromCharCode(+n)).replace(/&amp;/g, "&");
async function parsePptx(buf) {
  if (!window.JSZip) throw new Error("PPTX 라이브러리를 불러오지 못했습니다.");
  const zip = await JSZip.loadAsync(buf);
  const slides = Object.keys(zip.files).map((n) => [n, n.match(/^ppt\/slides\/slide(\d+)\.xml$/)]).filter((x) => x[1]).map((x) => ({ name: x[0], n: +x[1][1] })).sort((a, b) => a.n - b.n);
  const pages = [];
  for (const s of slides) {
    const xml = await zip.file(s.name).async("string");
    const paras = xml.split(/<\/a:p>/).map((p) => [...p.matchAll(/<a:t>([^<]*)<\/a:t>/g)].map((m) => decodeXml(m[1])).join(""));
    pages.push({ label: `슬라이드 ${s.n}`, text: clean(paras.filter(Boolean).join("\n")) });
  }
  return pages;
}
function parseTxt(buf) {
  const text = new TextDecoder("utf-8").decode(buf);
  const pages = []; let cur = "";
  for (const p of text.split(/\n\s*\n/)) {
    if (cur.length + p.length > 3000 && cur) { pages.push({ label: `구간 ${pages.length + 1}`, text: clean(cur) }); cur = ""; }
    cur += p + "\n\n";
  }
  if (cur.trim()) pages.push({ label: `구간 ${pages.length + 1}`, text: clean(cur) });
  return pages;
}
async function parseFile(file) {
  const name = file.name.toLowerCase();
  if (name.endsWith(".ppt")) throw new Error("구버전 .ppt는 지원하지 않습니다. PowerPoint에서 .pptx 또는 PDF로 저장해 올려주세요.");
  if (!/\.(pdf|pptx|txt|md)$/.test(name)) throw new Error("PDF, PPTX, TXT 파일만 지원합니다.");
  if (file.size > 50 * 1024 * 1024) throw new Error("파일이 너무 큽니다(최대 50MB).");
  const buf = await file.arrayBuffer();
  let pages;
  try {
    pages = name.endsWith(".pdf") ? await parsePdf(buf) : name.endsWith(".pptx") ? await parsePptx(buf) : parseTxt(buf);
  } catch (e) {
    throw new Error(`파일을 읽지 못했습니다. 손상되었거나 암호가 걸려 있을 수 있습니다.`);
  }
  const empty = pages.filter((p) => p.text.length < MIN_TEXT).map((p) => p.label);
  if (!pages.length || empty.length === pages.length)
    throw new Error("텍스트를 찾지 못했습니다. 스캔본·이미지로만 된 자료는 텍스트 추출이 불가능합니다. 내용을 TXT로 붙여넣어 올려주세요.");
  const warnings = [];
  if (empty.length) warnings.push(`텍스트가 거의 없는 페이지(이미지 위주일 가능성): ${empty.slice(0, 15).join(", ")}${empty.length > 15 ? ` 외 ${empty.length - 15}개` : ""}. 이 부분의 그림·도표 내용은 학습에 반영되지 않습니다.`);
  return { pages: pages.filter((p) => p.text.length >= MIN_TEXT), warnings };
}
function buildChunks(materials) {
  const chunks = [];
  for (const m of materials) {
    let buf = [], size = 0, first = "", last = "";
    const flush = () => { if (buf.length) { chunks.push({ text: buf.join("\n\n"), label: `${m.lecture} ${first}${first !== last ? `~${last}` : ""}` }); buf = []; size = 0; } };
    for (const p of m.pages) {
      const block = `[${m.lecture} | ${p.label}]\n${p.text}`.slice(0, CHUNK_CHARS);
      if (size + block.length > CHUNK_CHARS && buf.length) flush();
      if (!buf.length) first = p.label;
      buf.push(block); size += block.length; last = p.label;
    }
    flush();
  }
  return chunks;
}

function cleanQuestions(raw, ids, types) {
  return arr(raw && raw.questions).map((q) => ({
    id: uid(), type: QTYPES.includes(q && q.type) ? q.type : "", conceptId: str(q && q.conceptId), question: str(q && q.question),
    choices: strs(q && q.choices), answers: strs(q && q.answers), answer: str(q && q.answer), explanation: str(q && q.explanation), keyPoint: str(q && q.keyPoint),
    requiredKeywords: strs(q && q.requiredKeywords), modelAnswer: str(q && q.modelAnswer),
  })).filter((q) => {
    if (!q.type || !types.includes(q.type) || !ids.has(q.conceptId) || !q.question) return false;
    if (q.type === "ox") q.choices = ["O", "X"];
    if (q.type === "multi") {
      q.answers = q.answers.filter((a) => q.choices.includes(a));
      q.answer = q.answers.join(" / ");
      return q.choices.length >= 3 && q.answers.length >= 1 && q.answers.length < q.choices.length;
    }
    if (q.type === "mcq" || q.type === "ox") return q.choices.includes(q.answer);
    return Boolean(q.answer || q.modelAnswer);
  });
}
function splitCounts(types, weights, total) {
  const w = types.map((t) => weights[t] || 0), sum = w.reduce((a, b) => a + b, 0);
  const raw = (sum ? w.map((x) => x / sum) : types.map(() => 1 / types.length)).map((r) => r * total);
  const counts = raw.map(Math.floor);
  let left = total - counts.reduce((a, b) => a + b, 0);
  raw.map((r, i) => [r - Math.floor(r), i]).sort((a, b) => b[0] - a[0]).forEach(([, i]) => { if (left > 0) { counts[i]++; left--; } });
  return Object.fromEntries(types.map((t, i) => [t, counts[i]]));
}

function newDraft() {

function draftCheck(d) {
  const done = d.uploads.filter((u) => u.state === "done");
  const parsing = d.uploads.some((u) => u.state === "parsing");
  const sum = d.types.reduce((a, t) => a + (d.weights[t] || 0), 0);
  const weightOk = sum === 0 || sum === 100;
  const chunks = buildChunks(done.map((u) => ({ lecture: u.lecture || u.fileName, pages: u.pages })));
  const chars = done.reduce((a, u) => a + u.pages.reduce((b, p) => b + p.text.length, 0), 0);
  let hint = "";
  if (!done.length) hint = parsing ? "파일을 읽는 중입니다." : "강의 자료를 올려주세요.";
  else if (!d.types.length) hint = "출제 유형을 하나 이상 선택해주세요.";
  else if (!d.goal) hint = "학습 목표를 선택해주세요.";
  else if (!weightOk) hint = `비중 합계가 ${sum}%입니다. 100%로 맞추거나 모두 비워두세요.`;
  else hint = `추출된 텍스트 약 ${chars.toLocaleString()}자 · AI 분석 ${chunks.length}회 진행 예정`;
  return { ok: done.length && !parsing && d.types.length && d.goal && weightOk, hint, sum, weightOk };
}

function statusBadge(c) { const s = prog(c).status; return badge(STATUS[s], STATUS_TONE[s]); }

}

function viewSummary(list) {

function viewCards(list) {

    </button>
    ${k.flipped ? rateRow(c, "card-rate") : `<div class="between"><button class="btn ghost" data-act="card-prev" ${k.i ? "" : "disabled"}>이전</button><button class="btn ghost" data-act="card-next">건너뛰기</button></div>`}`;

function clozeParts(text) { return str(text).split(/(\[\[[^\]]+\]\])/g).filter((p) => p !== "").map((p) => (p.startsWith("[[") ? { blank: p.slice(2, -2) } : { text: p })); }
function viewCloze(list) {
  const items = list.filter((c) => /\[\[[^\]]+\]\]/.test(c.cloze));
  if (!items.length) return `<div class="card muted">빈칸 문장이 없습니다.</div>`;
  return `<p class="tiny muted">빈칸에 들어갈 핵심 키워드를 쓰고 정답을 확인하세요. 틀리면 복습 목록에 들어갑니다. Enter로 확인할 수 있습니다.</p>` + items.map((c) => {
    const st = S.clozeState[c.id];
    let j = -1;
    const html = clozeParts(c.cloze).map((p) => {
      if (p.text !== undefined) return esc(p.text);
      j++;
      const val = st ? st.inputs[j] || "" : S.clozeDraft[`${c.id}-${j}`] || "";
      const cls = st && st.checked ? (norm(val) === norm(p.blank) ? "ok" : "no") : "";
      return `<input id="cz-${c.id}-${j}" data-cz="${c.id}" data-j="${j}" aria-label="빈칸 ${j + 1}" class="${cls}" value="${esc(val)}" ${st && st.checked ? "disabled" : ""}>${st && st.checked && cls === "no" ? `<span class="fix">${esc(p.blank)}</span>` : ""}`;
    }).join("");
    return `<article class="card">${conceptHead(c)}<p class="cloze">${html}</p>
      <div class="between"><span class="tiny muted">출처 ${esc(src(c))}</span>${st && st.checked ? `<button class="btn sec" data-act="cz-reset" data-id="${c.id}">다시 풀기</button>` : `<button class="btn" data-act="cz-check" data-id="${c.id}">정답 확인</button>`}</div></article>`;
  }).join("");
}

const SCOPE = { essential: "필수 개념", all: "전체 개념", weak: "취약 개념만" };
const scopeLabel = (s) => (S.meta && S.meta.bankMode && s === "essential" ? "교수님 표시" : SCOPE[s]);
function newQuiz(scope) { return { scope, types: [...S.meta.settings.types], count: S.meta.bankMode ? 20 : 5, questions: null, i: 0, answer: "", result: null, score: [] }; }
function pickConcepts(scope, limit = 12) {
  const pool = scope === "weak" ? weakConcepts() : S.concepts.filter((c) => scope === "all" || c.tier === "essential");
  return pool.map((c) => ({ c, p: priority(prog(c)) + Math.random() })).sort((a, b) => b.p - a.p).slice(0, limit).map((x) => x.c);
